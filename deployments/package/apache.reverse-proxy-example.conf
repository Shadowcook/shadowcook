<VirtualHost *:80>
    ServerName shadowcook.example.com

    RewriteEngine On

    # Keep Let's Encrypt HTTP-01 challenges reachable.
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName shadowcook.example.com

    ProxyPreserveHost On
    ProxyRequests Off

    SSLEngine On
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /etc/letsencrypt/live/shadowcook.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/shadowcook.example.com/privkey.pem

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Forwarded-Host "%{Host}i"
    RequestHeader unset X-Forwarded-For
    RequestHeader unset Forwarded
    RequestHeader unset X-Real-IP
    ProxyAddHeaders On

    # Standalone outage page: install errors/50x.html before enabling (see README).
    # Apache >= 2.4.47; modules: alias, headers, proxy, proxy_http, authz_core.
    # Keep this exclusion BEFORE all catch-all proxies, including custom sites.
    ProxyPass /_errors/ !
    Alias /_errors/ "/var/www/shadowcook-errors/"
    <Directory "/var/www/shadowcook-errors">
        Require all granted
        AllowOverride None
        Options -Indexes -ExecCGI
        <Files "50x.html">
            ForceType text/html
        </Files>
        Header always set Cache-Control "no-store"
    </Directory>
    ProxyErrorOverride Off
    <LocationMatch "^/(?!api(?:/|$)|mcp(?:/|$)|\.well-known(?:/|$)|_errors(?:/|$))">
        <If "%{REQUEST_METHOD} =~ /^(GET|HEAD)$/ && req('Accept') =~ m#text/html#">
            ProxyErrorOverride On 500 502 503 504
            ErrorDocument 500 /_errors/50x.html
            ErrorDocument 502 /_errors/50x.html
            ErrorDocument 503 /_errors/50x.html
            ErrorDocument 504 /_errors/50x.html
            Header always set Cache-Control "no-store" "expr=%{REQUEST_STATUS} >= 500"
        </If>
    </LocationMatch>

    # Optional custom landing website:
    # 1. Run your own website on 127.0.0.1:8080, or replace that address below.
    # 2. Serve /, /landing and /landing/* on that server without stripping /landing.
    #    Put all website assets under /landing/assets/ and link to /explore.
    # 3. Uncomment the two directives below. Keep them BEFORE the Shadowcook rules.
    #    Only / and the /landing namespace are replaced; /landing-kitchen stays a cookbook.
    # 4. Run apachectl configtest, then reload Apache.
    # ProxyPassMatch "^/(landing(?:/.*)?)?$" "http://127.0.0.1:8080/$1"
    # ProxyPassReverse "/" "http://127.0.0.1:8080/"

    # The Compose web service is bound to 127.0.0.1:4321 by default.
    # Change this upstream only when SHADOWCOOK_HTTP_BIND or
    # SHADOWCOOK_HTTP_PORT differs in deployments/package/.env.
    ProxyPass / http://127.0.0.1:4321/
    ProxyPassReverse / http://127.0.0.1:4321/
</VirtualHost>
