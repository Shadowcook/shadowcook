# Install this file inside Nginx's http context (for example, conf.d/shadowcook.conf).
# Replace the hostname and certificate paths and set PUBLIC_WEB_ORIGIN to the HTTPS origin.
server {
    listen 80;
    server_name shadowcook.example.com;

    # Keep Let's Encrypt HTTP-01 challenges reachable. Match your ACME client's webroot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://shadowcook.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name shadowcook.example.com;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/letsencrypt/live/shadowcook.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shadowcook.example.com/privkey.pem;

    client_max_body_size 16m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Host $http_host;
    # Replace incoming client-IP forwarding headers with the observed visitor IP.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Real-IP "";

    # Optional custom landing website:
    # 1. Run your own website on 127.0.0.1:8080, or replace that address below.
    # 2. Serve /, /landing and /landing/* on that server without stripping /landing.
    #    Put all website assets under /landing/assets/ and link to /explore.
    # 3. Uncomment all three location blocks below. Keep proxy_pass WITHOUT a trailing slash.
    #    Only / and the /landing namespace are replaced; /landing-kitchen stays a cookbook.
    # 4. Run nginx -t, then reload Nginx.
    # location = / {
    #     proxy_pass http://127.0.0.1:8080;
    # }
    # location = /landing {
    #     proxy_pass http://127.0.0.1:8080;
    # }
    # location ^~ /landing/ {
    #     proxy_pass http://127.0.0.1:8080;
    # }

    # The Compose web service is bound to 127.0.0.1:4321 by default.
    # Change this upstream only when SHADOWCOOK_HTTP_BIND or
    # SHADOWCOOK_HTTP_PORT differs in deployments/package/.env.
    location / {
        proxy_pass http://127.0.0.1:4321;
    }
}
