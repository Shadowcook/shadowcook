    RecipeDiet:
      type: [string, 'null']
      enum: [VEGAN, VEGETARIAN, OMNI, null]
      description: Explicit recipe classification. Null means unclassified. Vegetarian search includes vegan recipes; omnivorous search includes all three explicit classifications.
    RecipeCreatedAt:
      type: string
      format: date-time
      readOnly: true
      description: Original recipe creation timestamp, serialized in UTC. Never editable through recipe writes.
    RecipeUpdatedAt:
      type: [string, 'null']
      format: date-time
      readOnly: true
      description: Publication timestamp of the displayed revision, or of the current published revision in editor responses. Null before first publication. Draft and policy changes do not advance this value. Serialized in UTC.
    RecipeContentMetadata:
      type: object
      additionalProperties: false
      description: Optional versioned recipe content. All six fields are present in read responses and nullable. Supplying this object on create or draft update replaces all six fields; omitted properties become null. Omitting the object on update preserves existing values. Active minutes cannot exceed total minutes when both exist. kcal per serving is calculated only for non-null kcal and servings and is never stored or accepted as input. Incomplete calorie and serving data is valid.
      properties:
        difficulty: { type: [string, 'null'], enum: [EASY, MEDIUM, DEMANDING, null] }
        totalMinutes: { type: [integer, 'null'], minimum: 0, maximum: 5256000 }
        activeMinutes: { type: [integer, 'null'], minimum: 0, maximum: 5256000 }
        kcal: { type: [number, 'null'], minimum: 0, maximum: 1000000000 }
        servings: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 1000000 }
        utensils:
          type: [string, 'null']
          maxLength: 4000
          description: Authored free text, including line breaks. Empty or whitespace-only input clears this field. No catalogue association.
    RecipeDraftInput:
      description: Top-level metadata and diet project the selected variant, or the default variant when no selection exists. Legacy recipe writes of these fields update the default variant only.
