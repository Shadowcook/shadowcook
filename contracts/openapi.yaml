            - INVALID_REPORT_FILTER
            - INVALID_REPORT_UPDATE
            - INVALID_REPORT_ASSIGNEE
            - REPORT_NOT_FOUND
            - REPORT_TARGET_NOT_FOUND
            - REPORT_RATE_LIMITED
            - AI_CONTEXT_UNAVAILABLE
            - AI_CONTEXT_SCOPE_NOT_FOUND
            - INVALID_AI_CONTEXT
            - INVALID_CREDENTIALS
            - INVALID_LOGIN_BODY
            - INVALID_ACCOUNT_PROFILE
            - SMTP_REQUIRED
            - MAIL_NOT_CONFIGURED
            - MAIL_DELIVERY_FAILED
            - INVALID_PASSWORD
            - PASSWORD_CHANGE_REQUIRED
            - RECIPE_NOT_FOUND
            - RECIPE_DRAFT_NOT_FOUND
            - RECIPE_CONFLICT
            - INVALID_RECIPE
            - INVALID_RECIPE_CATEGORY
            - INVALID_RECIPE_SLUG_QUERY
            - INVALID_RECIPE_STEPS
            - INVALID_RECIPE_VARIANT
            - RECIPE_VARIANT_CONFLICT
            - RECIPE_VARIANT_HAS_STEPS
            - PUBLISH_CATEGORY_REQUIRED
            - RECIPE_NOT_PUBLISHED
            - INVALID_UNIT
            - UNIT_CONFLICT
            - UNIT_NOT_FOUND
            - UNIT_IN_USE
            - INVALID_CONVERSION
            - UNIT_DIMENSION_MISMATCH
            - INVALID_INGREDIENT
            - INGREDIENT_CONFLICT
            - INGREDIENT_NOT_FOUND
