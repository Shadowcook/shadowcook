      propertyNames:
        pattern: '^(?!en$)[a-z]{2,3}(?:-[a-z]{4})?(?:-(?:[a-z]{2}|[0-9]{3}))?$'
      additionalProperties:
        type: object
        additionalProperties: false
        required: [name, symbol]
