              application/json:
                {
                  schema:
                    {
                      'anyOf':
                        [
                          { '$ref': '#/components/schemas/ApiError' },
                          { '$ref': '#/components/schemas/UnhandledApiError' },
                        ],
                    },
                },
            }
        '409':
          description: >-
            The default name or symbol conflicts with a visible unit (UNIT_CONFLICT),
            or a used unit's conversion would change (UNIT_IN_USE).
          content:
            {
              application/json:
                {
                  schema:
                    {
                      'anyOf':
                        [
                          { '$ref': '#/components/schemas/ApiError' },
                          { '$ref': '#/components/schemas/UnhandledApiError' },
                        ],
                    },
                },
            }
