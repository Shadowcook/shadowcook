                    },
                },
            }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '409': { $ref: '#/components/responses/RecipeSlugConflict' }
  /cookbook/tenants/{tenantSlug}/recipes/slug-availability:
    get:
      operationId: checkRecipeSlugAvailability
      summary: Checks whether a recipe URL name is available in a cookbook.
      description: Requires recipe:create or recipe:update. Includes published and draft-only recipes. The optional excluded recipe public ID permits keeping an existing recipe's own slug. Returns no matching recipe identifiers or content. Availability is advisory; writes enforce uniqueness transactionally.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - name: slug
          in: query
          required: true
          schema: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        - name: excludePublicId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        default: { $ref: '#/components/responses/UnexpectedError' }
        '200':
          description: Whether the supplied URL name is available in this cookbook.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [available]
                properties:
                  available: { type: boolean }
        '400':
          description: INVALID_RECIPE_SLUG_QUERY. The slug or excluded recipe identifier is invalid.
          content:
            {
              application/json:
                {
                  schema:
                    {
                      'anyOf':
                        [
                          { '$ref': '#/components/schemas/ApiError' },
                          { '$ref': '#/components/schemas/UnhandledApiError' },
                        ],
                    },
                },
            }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
  /cookbook/tenants/{tenantSlug}/trash:
    get:
      operationId: listRecipeTrash
      summary: List unexpired soft-deleted recipes; requires tenant recipe:delete permission.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - { name: tenantSlug, in: path, required: true, schema: { type: string } }
      responses:
        default: { $ref: '#/components/responses/UnexpectedError' }
        '200':
          description: Recipes retained in the trash bin.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [recipes]
                properties:
                  recipes:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [publicId, slug, title, deletedAt, expiresAt]
                      properties:
                        publicId: { type: string, format: uuid }
                        slug: { type: string }
                        title: { type: string }
                        deletedAt: { type: string, format: date-time }
                        expiresAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '404':
          description: TENANT_NOT_FOUND or RECIPE_NOT_FOUND; recipe missing, already deleted, or retention expired.
          content:
            {
              application/json:
                {
                  schema:
                    {
                      'anyOf':
                        [
                          { '$ref': '#/components/schemas/ApiError' },
                          { '$ref': '#/components/schemas/UnhandledApiError' },
                        ],
                    },
                },
            }
  /cookbook/tenants/{tenantSlug}/trash/{publicId}/restore:
    post:
