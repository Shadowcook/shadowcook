            'revisionCount': { 'type': 'integer', 'minimum': 0 },
            'shareCount': { 'type': 'integer', 'minimum': 0 },
            'mediaCount': { 'type': 'integer', 'minimum': 0 },
            'memberCount': { 'type': 'integer', 'minimum': 0 },
          },
        'required': ['recipeCount', 'revisionCount', 'shareCount', 'mediaCount', 'memberCount'],
      }
    AdministrativeDeletion:
