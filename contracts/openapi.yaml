  /user-invitations/{token}:
    get:
      operationId: getUserInvitation
      description: Anonymous callers receive only existing-account and password-requirement metadata; email is null. A session matching the invited email receives the email address. An active session for another address is rejected without disclosing invitation details.
      security: [{}, { sessionCookie: [] }]
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Invitation details, account state, and current password requirement.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [email, passwordRequired, existingAccount]
                properties:
                  email: { type: [string, 'null'], format: email }
                  passwordRequired: { type: boolean }
                  existingAccount: { type: boolean }
        '403':
          description: INVITATION_EMAIL_MISMATCH. The active session belongs to another email address.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '404': { description: Invitation unavailable. }
  /user-invitations/{token}/accept:
    post:
      operationId: acceptUserInvitation
      description: An active session for another email address is rejected for both existing-account acceptance and new-account creation without consuming the invitation. Existing-account acceptance checks the signed-in account ID as well as the email address.
      security: [{}, { sessionCookie: [] }]
      summary: Accepts an instance or cookbook user invitation and completes the profile of a new account.
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: New accounts require firstName, lastName, and displayName. Existing invited cookbook accounts accept with an empty object and a matching authenticated session; their profile is unchanged. A new account also requires a password unless the login mode is EMAIL_CODE_ONLY.
              properties:
                firstName: { $ref: '#/components/schemas/ProfileName' }
                lastName: { $ref: '#/components/schemas/ProfileName' }
                displayName: { $ref: '#/components/schemas/ProfileName' }
                password:
                  {
                    type: string,
                    format: password,
                    description: Must meet the configured minimum estimated entropy.,
                  }
      responses:
        '204': { description: Account created or an existing account joined the invited cookbook. }
        '400':
          description: Invalid invitation details, INVALID_ACCOUNT_PROFILE for missing or invalid names, or INVALID_PASSWORD.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { description: Existing invited account must sign in before accepting. }
        '403':
          description: INVITATION_EMAIL_MISMATCH. The active session does not match the invited account or email; the invitation is preserved.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '404': { description: Invitation unavailable. }
        '409':
          { description: An instance-user invitation cannot be accepted for an existing account. }
  /invitations/{token}:
    get:
      operationId: getTenantInvitation
      description: Anonymous callers receive existing-account metadata; email and cookbookName are null. A session matching the invited email receives full details. An active session for another address is rejected without disclosing invitation details.
      security: [{}, { sessionCookie: [] }]
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Cookbook-owner invitation details and invited account state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [email, cookbookName, existingAccount]
                properties:
                  email: { type: [string, 'null'], format: email }
                  cookbookName: { type: [string, 'null'] }
                  existingAccount: { type: boolean }
        '403':
          description: INVITATION_EMAIL_MISMATCH. The active session belongs to another email address.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '404':
          description: Invitation unavailable.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /invitations/{token}/accept:
    post:
      operationId: acceptTenantInvitation
      summary: Accepts a cookbook-owner invitation and completes the profile of a new account.
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: New accounts require firstName, lastName, and displayName in addition to the email code. Existing accounts require only the email code; their profile is unchanged.
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
                firstName: { $ref: '#/components/schemas/ProfileName' }
                lastName: { $ref: '#/components/schemas/ProfileName' }
                displayName: { $ref: '#/components/schemas/ProfileName' }
      responses:
        '200':
          description: Invitation accepted and browser session started.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [cookbookSlug, hasPassword, passwordChangeRequired]
                properties:
                  cookbookSlug: { type: string }
                  hasPassword: { type: boolean }
                  passwordChangeRequired: { type: boolean }
        '400':
          description: INVALID_EMAIL_CODE for malformed code input or INVALID_ACCOUNT_PROFILE for missing or invalid names on a new account. Profile validation does not consume the email code.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401':
          description: Invalid email code.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '403':
          description: The active session uses a different email address.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '404':
          description: Invitation unavailable.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /health:
    get:
      operationId: getHealth
      summary: Returns API process readiness after database migrations have completed.
      responses:
        '200':
          description: The API process is accepting requests.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: ok
  /cookbook/tenants/{tenantSlug}/ai-contexts:
    post:
      operationId: createAiContext
      summary: Creates a one-time AI context link for a recipe, category subtree, or complete cookbook.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantSlug' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scopeType, scopePublicId, durationHours]
              properties:
                scopeType: { type: string, enum: [TENANT, RECIPE, CATEGORY] }
                scopePublicId: { type: string, minLength: 1 }
                durationHours: { type: integer, enum: [4, 8, 24] }
      responses:
        '201':
          description: The one-time access URL expires in thirty minutes; expiresAt is the reader grant expiry.
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '400':
          description: INVALID_AI_CONTEXT. Invalid scope type, scope identifier, or duration.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '404':
          description: TENANT_NOT_FOUND or AI_CONTEXT_SCOPE_NOT_FOUND.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /ai-context/{bootstrapToken}:
    get:
      operationId: exchangeAiContextLink
      summary: Exchanges a one-time AI context URL for a scoped read-only bearer token, tenant identity, web route templates, and endpoint manifest.
      description: Each endpoint includes an absolute public URL template preserving the PUBLIC_API_ORIGIN path prefix. Replace template placeholders with public IDs and authenticate every reader request using Authorization Bearer credentials or, when headers cannot be set, the URL-encoded accessToken in the access_token query parameter. Use exactly one authentication method per request. Query credentials apply only to reader endpoints and must not be appended to public web links. The recipeAuthoring object links the public recipe JSON skill, schema, examples and ZIP; fetch those resources without context credentials. Read its instructions before authoring recipe JSON. The path field is an internal API path, not a URL to resolve against baseUrl. Bootstrap tokens are single-use and cannot authenticate reader requests. AI reader tokens cannot authenticate ordinary API or MCP endpoints.
      parameters:
        - { name: bootstrapToken, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: AI context manifest and bearer token.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiContextManifest' }
        '404': { $ref: '#/components/responses/AiContextBootstrapUnavailable' }
  /ai-context/reader:
    get:
      operationId: getAiContextOverview
      summary: Returns categories and recipes inside an AI context scope, preferring current draft metadata.
      security: [{ aiContextBearerAuth: [] }, { aiContextQueryAuth: [] }]
      responses:
        '200':
          description: Scoped reader overview.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiContextOverview' }
        '401': { $ref: '#/components/responses/AiContextReaderUnavailable' }
  /ai-context/reader/recipes/{publicId}:
    get:
      operationId: getAiContextRecipe
      summary: Returns a published recipe inside an AI context scope.
      security: [{ aiContextBearerAuth: [] }, { aiContextQueryAuth: [] }]
      parameters:
        - { name: publicId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Scoped published recipe with visible variants and the default variant's steps.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiContextRecipe' }
        '401': { $ref: '#/components/responses/AiContextReaderUnavailable' }
        '404': { $ref: '#/components/responses/AiContextRecipeUnavailable' }
  /ai-context/reader/recipes/{publicId}/revisions:
    get:
      operationId: listAiContextRecipeRevisions
      summary: Lists published and archived revisions for a recipe inside an AI context scope.
      security: [{ aiContextBearerAuth: [] }, { aiContextQueryAuth: [] }]
      parameters:
        - { name: publicId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Scoped immutable recipe revisions, newest version first.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [revisions]
                properties:
                  revisions:
                    type: array
                    items: { $ref: '#/components/schemas/AiContextRevisionSummary' }
        '401': { $ref: '#/components/responses/AiContextReaderUnavailable' }
        '404': { $ref: '#/components/responses/AiContextRecipeUnavailable' }
  /ai-context/reader/recipes/{publicId}/revisions/{revisionPublicId}:
    get:
      operationId: getAiContextRecipeRevision
      summary: Returns an immutable published or archived recipe revision inside an AI context scope.
      security: [{ aiContextBearerAuth: [] }, { aiContextQueryAuth: [] }]
      parameters:
        - { name: publicId, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: revisionPublicId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200':
          description: Scoped immutable recipe revision.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiContextRevision' }
        '401': { $ref: '#/components/responses/AiContextReaderUnavailable' }
        '404': { $ref: '#/components/responses/AiContextRecipeUnavailable' }
  /ai-context/reader/recipes/{publicId}/draft:
    get:
      operationId: getAiContextRecipeDraft
      summary: Returns the current draft for a recipe inside an AI context scope.
      security: [{ aiContextBearerAuth: [] }, { aiContextQueryAuth: [] }]
      parameters:
        - { name: publicId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Scoped current recipe draft.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiContextRevision' }
        '401': { $ref: '#/components/responses/AiContextReaderUnavailable' }
        '404': { $ref: '#/components/responses/AiContextRecipeUnavailable' }
  /mcp:
    post:
      operationId: modelContextProtocol
      summary: Serves authenticated Shadowcook Model Context Protocol tools.
      description: Active OAuth access tokens and service-account bearer tokens are accepted. Tools can search recipes and create or modify drafts; none publish or delete recipes. The public web proxy serves this endpoint at /api/mcp and through the direct /mcp alias. OAuth discovery advertises the canonical resource at PUBLIC_API_ORIGIN/mcp. The tools/list input schemas represent nullable fields with anyOf containing separate non-null and null branches; UUID formats remain on string branches. Recipe summary and unit equivalenceAmount/referenceUnitPublicId remain optional and accept explicit null. Tool argument objects have additionalProperties set to false.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc: { type: string, const: '2.0' }
                id: {}
                method: { type: string }
                params: {}
      responses:
        '200': { description: JSON-RPC response. }
        '202': { description: JSON-RPC notification accepted. }
        '400': { description: The JSON-RPC request is invalid. }
        '401': { description: OAuth or service-account authentication is required. }
  /.well-known/oauth-protected-resource:
    get:
      operationId: getMcpProtectedResourceMetadata
      summary: Returns OAuth protected-resource metadata for the MCP endpoint.
      responses:
        '200':
          description: Protected-resource metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthProtectedResourceMetadata' }
  /.well-known/oauth-protected-resource/mcp:
    get:
      operationId: getRootAliasMcpProtectedResourceMetadata
      summary: Returns canonical OAuth protected-resource metadata for the public /mcp alias.
      responses:
        '200':
          description: Protected-resource metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthProtectedResourceMetadata' }
  /.well-known/oauth-protected-resource/api/mcp:
    get:
      operationId: getPathSpecificMcpProtectedResourceMetadata
      summary: Returns OAuth protected-resource metadata for the public /api/mcp endpoint.
      responses:
        '200':
          description: Protected-resource metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthProtectedResourceMetadata' }
  /.well-known/oauth-authorization-server:
    get:
      operationId: getOAuthAuthorizationServerMetadata
      summary: Returns OAuth authorization-server metadata.
      responses:
        '200':
          description: Authorization-server metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthAuthorizationServerMetadata' }
  /.well-known/oauth-authorization-server/api:
    get:
      operationId: getPathSpecificOAuthAuthorizationServerMetadata
      summary: Returns OAuth authorization-server metadata for the public /api issuer.
      responses:
        '200':
          description: Authorization-server metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthAuthorizationServerMetadata' }
  /oauth/register:
    post:
      operationId: registerOAuthClient
      summary: Registers a public OAuth client for the Shadowcook MCP authorization server.
      description: Redirect URIs use HTTPS or HTTP with the literal loopback address 127.0.0.1 or [::1], without credentials or fragments. Additional client metadata fields are accepted but not persisted. All registered clients use token_endpoint_auth_method none.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required: [redirect_uris, client_name]
              properties:
                redirect_uris:
                  type: array
                  minItems: 1
                  description: Callback URIs accepted during authorization. Each URI uses HTTPS or HTTP on literal IPv4 or IPv6 loopback and contains no credentials or fragment.
                  items: { type: string, format: uri }
                client_name: { type: string, minLength: 1, maxLength: 160 }
      responses:
        '201':
          description: OAuth client registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthClientRegistrationResponse' }
        '400': { description: OAuth client metadata is invalid. }
  /oauth/authorize:
    get:
      operationId: authorizeMcpOAuthClient
      summary: Authenticates a Shadowcook user and issues an OAuth authorization code.
      description: The redirect_uri must exactly match a registered callback URI and use HTTPS or HTTP on literal IPv4 or IPv6 loopback, without credentials or fragments.
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, const: code } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: resource, in: query, required: true, schema: { type: string, format: uri } }
        - {
            name: scope,
            in: query,
            required: false,
            schema: { type: string, const: shadowcook:recipes, default: shadowcook:recipes },
          }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - {
            name: code_challenge_method,
            in: query,
            required: true,
            schema: { type: string, const: S256 },
          }
      responses:
        '302': { description: Redirects to Shadowcook sign-in or the client's redirect URI. }
        '400': { description: The authorization request or client is invalid. }
  /oauth/token:
    post:
      operationId: exchangeMcpOAuthToken
      summary: Exchanges an OAuth authorization code or refresh token for an MCP access token.
      description: The public /api/oauth/token proxy accepts application/x-www-form-urlencoded POSTs from external OAuth clients, including requests with a different Origin or no Origin header. Token exchange validates the authorization code, client ID, exact callback URI, and S256 PKCE verifier; refresh exchange validates and rotates the refresh token.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/OAuthTokenRequest' }
      responses:
        '200':
          description: OAuth token response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthTokenResponse' }
        '400': { description: The OAuth grant is invalid or unsupported. }
  /admin/mail-settings:
    get:
      operationId: getInstanceMailSettings
      summary: Returns non-secret SMTP settings for the instance.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The mail settings state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceMailSettings'
        '401':
          {
            description: Authentication is required,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
        '403':
          {
            description: An instance permission is required,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
    put:
      operationId: saveInstanceMailSettings
      summary: Stores encrypted SMTP settings for the instance.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceMailSettingsInput'
      responses:
        '204': { description: The mail settings were stored. }
        '400':
          {
            description: The settings are invalid,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
        '401':
          {
            description: Authentication is required,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
        '403':
          {
            description: An instance permission is required,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
        '503':
          {
            description: The instance encryption key is not configured,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
  /admin/mail-settings/test:
    post:
      operationId: sendInstanceMailSettingsTest
      summary: Sends a test message using the stored SMTP settings.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recipient]
              properties:
                recipient: { type: string, format: email }
      responses:
        '204': { description: The test message was accepted for delivery. }
        '400':
          {
            description: The recipient is invalid,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
        '401':
          {
            description: Authentication is required,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
        '403':
          {
            description: An instance permission is required,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
        '409':
          {
            description: Mail is not configured,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
        '502':
          {
            description: SMTP delivery failed,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
        '503':
          {
            description: The instance encryption key is not configured,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
  /admin/email-templates:
    get:
      operationId: listInstanceEmailTemplates
      summary: Returns resolved system email templates and permitted placeholders.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: System email templates.
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items: { $ref: '#/components/schemas/InstanceEmailTemplate' }
        '401': { description: Authentication is required }
        '403': { description: An instance permission is required }
  /admin/email-templates/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          enum:
            [
              CONTENT_REPORT,
              REGISTRATION_VERIFICATION,
              EMAIL_CHANGE_VERIFICATION,
              LOGIN_CODE,
              PASSWORD_RESET,
              ADMIN_PASSWORD_RESET,
              INSTANCE_USER_INVITATION,
              COOKBOOK_USER_INVITATION,
              COOKBOOK_OWNER_INVITATION,
            ]
    put:
      operationId: saveInstanceEmailTemplate
      summary: Saves a customized system email template.
      security: [{ sessionCookie: [] }]
