          { $ref: '#/components/parameters/RecipePublicId' },
        ]
      responses:
        default: { $ref: '#/components/responses/UnexpectedError' }
        '200':
          description: Recipe variants.
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      additionalProperties: false,
                      required: [variants],
                      properties:
                        {
                          variants:
                            { type: array, items: { $ref: '#/components/schemas/RecipeVariant' } },
                        },
                    },
                },
            }
