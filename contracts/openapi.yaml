        application/json:
          schema:
            {
              'anyOf':
                [
                  { '$ref': '#/components/schemas/ApiError' },
                  { '$ref': '#/components/schemas/UnhandledApiError' },
                ],
            }
    ReportNotFound:
      description: REPORT_TARGET_NOT_FOUND or REPORT_NOT_FOUND.
      content:
        application/json:
          schema:
            {
              'anyOf':
                [
                  { '$ref': '#/components/schemas/ApiError' },
                  { '$ref': '#/components/schemas/UnhandledApiError' },
                ],
            }
    EmailChangeRateLimited:
