    ReportReason: { type: string, enum: [ILLEGAL_CONTENT, IMPROPER_NAME, HARASSMENT, SPAM, OTHER] }
    ReportStatus: { type: string, enum: [OPEN, UNDER_INVESTIGATION, CLOSED] }
    ReportResult:
      {
        type: [string, 'null'],
        enum: [BLOCKED, UNFOUNDED, USER_DELETED, COOKBOOK_DELETED, RECIPE_DELETED, OTHER, null],
      }
    ContentReportInput:
      type: object
      additionalProperties: false
      required: [targetType, targetPublicId, reason, description]
      properties:
        targetType: { $ref: '#/components/schemas/ReportTargetType' }
        targetPublicId: { type: string, format: uuid }
        reason: { $ref: '#/components/schemas/ReportReason' }
        description: { type: string, minLength: 1, maxLength: 5000, pattern: '\S' }
        shareToken: { type: string, maxLength: 200 }
    ContentReportUpdate:
      type: object
      additionalProperties: false
      required: [status, result, resultNote, assignedAdminPublicId]
      properties:
        status: { $ref: '#/components/schemas/ReportStatus' }
        result: { $ref: '#/components/schemas/ReportResult' }
        resultNote: { type: string, maxLength: 5000 }
        assignedAdminPublicId: { type: [string, 'null'], format: uuid }
      allOf:
        - if:
            properties:
              status: { const: CLOSED }
          then:
            properties:
              result: { type: string }
          else:
            properties:
              result: { type: 'null' }
    ContentReport:
      type: object
      additionalProperties: false
      required:
        [
          publicId,
          targetType,
          targetPublicId,
          targetName,
          targetUrl,
          reporterName,
          reporterEmail,
          reason,
          description,
          status,
          result,
          resultNote,
          assignedAdminPublicId,
          assignedAdminName,
          createdAt,
          updatedAt,
          notificationSentAt,
        ]
      properties:
        publicId: { type: string, format: uuid }
        targetType: { $ref: '#/components/schemas/ReportTargetType' }
        targetPublicId: { type: string, format: uuid }
        targetName: { type: [string, 'null'] }
        targetUrl:
          {
            type: [string, 'null'],
            description: Relative target URL or null when the target no longer exists.,
          }
        reporterName: { type: string }
        reporterEmail: { type: string, format: email }
        reason: { $ref: '#/components/schemas/ReportReason' }
        description: { type: string, minLength: 1, maxLength: 5000 }
        status: { $ref: '#/components/schemas/ReportStatus' }
        result: { $ref: '#/components/schemas/ReportResult' }
        resultNote: { type: string, maxLength: 5000 }
        assignedAdminPublicId: { type: [string, 'null'], format: uuid }
        assignedAdminName: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        notificationSentAt: { type: [string, 'null'], format: date-time }
    EmailChangeVerificationToken:
      type: object
      required: [token]
      properties:
        token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
    EmailChangeVerification:
      type: object
      additionalProperties: false
      required: [currentEmail, email, expiresAt, reauthenticationRequired]
      properties:
        currentEmail: { type: string, format: email }
        email: { type: string, format: email }
        expiresAt: { type: string, format: date-time }
        reauthenticationRequired:
          type: boolean
          description: True when the session was not created through authentication within the last five minutes. A new password or email-code sign-in is required before confirmation.
    AccountEmailChangeStatus:
      type: object
      additionalProperties: false
      required: [email, pending, nextResendAt, serverTime]
      properties:
        email: { type: string, format: email }
        pending:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [email, expiresAt]
              properties:
                email: { type: string, format: email }
                expiresAt: { type: string, format: date-time }
        nextResendAt:
          type: [string, 'null']
          format: date-time
          description: Earliest allowed send time, including when the requested target address changes. Null before any request.
        serverTime: { type: string, format: date-time }
    ProfileName:
      type: string
      minLength: 1
      maxLength: 120
      pattern: '\S'
      description: Leading and trailing whitespace is ignored. The trimmed name contains 1 to 120 characters.
