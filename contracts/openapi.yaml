  /cookbook:
    get:
      operationId: getCookbook
      summary: Returns published accessible recipe search results and the paginated featured front page.
      parameters:
        - name: tenantSlug
          in: query
          required: false
          schema: { type: string }
        - name: frontpagePage
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: recipeFilter
          in: query
          required: false
          description: Accent-insensitive recipe filter for titles and summaries. Non-alphanumeric ASCII characters are word separators. The recipes response contains all matching accessible discoverable recipes regardless of featured state; the frontpage response remains limited to matching featured recipes. Exact title, title phrase, title token, summary phrase, and summary token matches are returned in that order.
          schema: { type: string, maxLength: 200 }
        - name: diet
          in: query
          required: false
          description: VEGAN matches vegan recipes; VEGETARIAN matches vegetarian and vegan recipes; OMNI matches all explicitly classified recipes. Unclassified recipes match only when this filter is absent. Applies together with recipeFilter to recipes and frontpage results and counts.
          schema: { type: string, enum: [VEGAN, VEGETARIAN, OMNI] }
        - name: refreshFrontpageShuffle
          in: query
          required: false
          description: Renews the authenticated session's featured-recipe ordering.
          schema: { type: boolean, default: false }
      responses:
        default: { $ref: '#/components/responses/UnexpectedError' }
        '200':
          description: The accessible cookbook overview.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  [
                    tenant,
                    categories,
                    recipes,
                    frontpage,
                    canManageCategories,
                    canManageRecipes,
                    canDeleteRecipes,
                    canCreateRecipes,
                    canManageUsers,
                    canManageIngredients,
                    canManageUnits,
                    canManageServiceAccounts,
                    canCreateAiContexts,
                  ]
                properties:
                  tenant:
                    oneOf:
                      - type: 'null'
                      - type: object
                        additionalProperties: false
                        required: [public_id, display_name, frontpage_heading]
                        properties:
                          public_id: { type: string, format: uuid }
                          display_name: { type: string }
                          frontpage_heading: { type: [string, 'null'], maxLength: 80 }
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/CookbookCategory'
                  recipes:
                    description: Accessible discoverable recipes matching recipeFilter regardless of featured state.
                    type: array
                    items:
                      $ref: '#/components/schemas/CookbookRecipe'
                  frontpage:
                    $ref: '#/components/schemas/CookbookFrontpage'
                  canManageCategories:
                    type: boolean
                  canDeleteRecipes:
                    type: boolean
                    description: Granted by the tenant recipe:delete permission.
                  canManageRecipes:
                    type: boolean
                  canCreateRecipes:
                    type: boolean
                    description: Granted only by the tenant recipe:create permission.
                  canManageUsers:
                    type: boolean
                  canManageIngredients:
                    type: boolean
                    description: Granted by ingredient:create or ingredient:update; ingredient:read alone does not grant management access.
                  canManageUnits:
                    type: boolean
                    description: Granted by unit:create, unit:update, or unit:delete; unit:read alone does not grant management access.
                  canManageServiceAccounts:
                    type: boolean
                    description: Granted by the tenant service-account:manage permission.
                  canCreateAiContexts:
                    type: boolean
                    description: Granted by the tenant recipe:visibility-update permission.
        '400':
          description: INVALID_RECIPE_FILTER. The diet filter is invalid.
          content:
            application/json:
              schema:
                {
                  'anyOf':
                    [
                      { '$ref': '#/components/schemas/ApiError' },
                      { '$ref': '#/components/schemas/UnhandledApiError' },
                    ],
                }
        '403':
          description: A password change is required before accessing the cookbook.
          content:
            application/json:
              schema:
              $ref: '#/components/schemas/ApiError'
        '404':
          description: The requested tenant is disabled or does not exist.
          content:
            application/json:
              schema:
                {
                  'anyOf':
                    [
                      { '$ref': '#/components/schemas/ApiError' },
                      { '$ref': '#/components/schemas/UnhandledApiError' },
                    ],
                }
  /cookbook/tenants:
    get:
      operationId: listAccessibleCookbookTenants
      summary: Returns the paginated, shuffled accessible enabled cookbooks, the authenticated user's enabled cookbook memberships, and root-page presentation settings.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: filter
          in: query
          description: Case-insensitive contains filter for cookbook names and descriptions.
          schema: { type: string, maxLength: 200 }
        - name: shuffleSeed
          in: query
          description: Keeps the randomized cookbook order stable while paging and filtering.
          schema: { type: string, maxLength: 100 }
      responses:
        default: { $ref: '#/components/responses/UnexpectedError' }
        '200':
          description: Accessible enabled cookbooks and the authenticated user's enabled cookbook memberships.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookbookTenantSelection'
  /admin/audit-settings:
    get:
      operationId: getAdministrativeAuditSettings
      summary: Returns the administrative audit retention policy.
      description: >-
        Requires an active human instance:administer browser session without a required
        password change or pending cookbook identity repair. Any Authorization header is
        rejected. Returns the policy only; no audit events are exposed.
      security: [{ sessionCookie: [] }]
      responses:
        default: { $ref: '#/components/responses/UnexpectedError' }
        '200':
          description: Current retention period; initially 365 days.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrativeAuditSettings' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403':
          description: ADMIN_SESSION_REQUIRED, INSTANCE_PERMISSION_REQUIRED, PASSWORD_CHANGE_REQUIRED or COOKBOOK_NAME_RESET_REQUIRED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    put:
      operationId: updateAdministrativeAuditSettings
      summary: Updates the administrative audit retention policy.
      description: >-
        Requires the same active human administrator session as GET; any Authorization
        header is rejected. The period applies to all administrative audit events and
        public report notices at the next API startup or three-hour cleanup. One day
        equals 24 hours. Reducing the period also expires existing older records;
        increasing it does not restore deleted records. Saving does not prune immediately
        or change backup retention. No event editing or deletion API is exposed.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdministrativeAuditSettings' }
      responses:
        default: { $ref: '#/components/responses/UnexpectedError' }
        '204': { description: Audit retention settings saved. }
        '400':
          description: INVALID_AUDIT_SETTINGS; exactly one retentionDays integer from 1 through 3650 is required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403':
          description: ADMIN_SESSION_REQUIRED, INSTANCE_PERMISSION_REQUIRED, PASSWORD_CHANGE_REQUIRED or COOKBOOK_NAME_RESET_REQUIRED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /admin/media-settings:
    get:
      operationId: getInstanceMediaSettings
      summary: Returns instance-wide recipe-image retention settings.
      description: Requires instance:administer for a user principal.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      responses:
        default: { $ref: '#/components/responses/UnexpectedError' }
        '200':
          description: Persisted media settings. The initial limit is five published images per recipe.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstanceMediaSettings' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/InstancePermissionRequired' }
    put:
      operationId: updateInstanceMediaSettings
      summary: Updates instance-wide recipe-image retention settings.
      description: >-
        Requires instance:administer for a user principal. Zero preserves unlimited published
        image history; positive values include the current published image. The active draft
        image is protected separately. Changes apply on the next publication or hourly cleanup
        without a process restart. Unlimited history does not disable orphan-media cleanup.
        Increasing the limit cannot restore already deleted images.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstanceMediaSettings' }
      responses:
        default: { $ref: '#/components/responses/UnexpectedError' }
        '204': { description: Media settings saved. }
        '400':
          description: INVALID_MEDIA_SETTINGS; the limit must be a non-negative integer.
          content:
            application/json:
              schema:
                {
                  'anyOf':
                    [
                      { '$ref': '#/components/schemas/ApiError' },
                      { '$ref': '#/components/schemas/UnhandledApiError' },
                    ],
                }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/InstancePermissionRequired' }
  /admin/frontpage-settings:
    get:
