      responses:
        '204': { description: The template was saved. }
        '400': { description: The template or a placeholder is invalid }
        '401': { description: Authentication is required }
        '403': { description: An instance permission is required }
    delete:
      operationId: restoreInstanceEmailTemplateDefault
      summary: Removes a customized template and restores the built-in default.
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: The built-in default is active. }
        '401': { description: Authentication is required }
        '403': { description: An instance permission is required }
        '404': { description: The template key is unknown }
  /cookbook:
    get:
      operationId: getCookbook
      summary: Returns published accessible recipe search results and the paginated featured front page.
      parameters:
        - name: tenantSlug
          in: query
          required: false
          schema: { type: string }
        - name: frontpagePage
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: recipeFilter
          in: query
          required: false
          description: Accent-insensitive recipe filter for titles and summaries. Non-alphanumeric ASCII characters are word separators. The recipes response contains all matching accessible discoverable recipes regardless of featured state; the frontpage response remains limited to matching featured recipes. Exact title, title phrase, title token, summary phrase, and summary token matches are returned in that order.
          schema: { type: string, maxLength: 200 }
        - name: diet
          in: query
          required: false
          description: VEGAN matches vegan recipes; VEGETARIAN matches vegetarian and vegan recipes; OMNI matches all explicitly classified recipes. Unclassified recipes match only when this filter is absent. Applies together with recipeFilter to recipes and frontpage results and counts.
          schema: { type: string, enum: [VEGAN, VEGETARIAN, OMNI] }
        - name: refreshFrontpageShuffle
          in: query
          required: false
          description: Renews the authenticated session's featured-recipe ordering.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: The accessible cookbook overview.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  [
                    tenant,
                    categories,
                    recipes,
                    frontpage,
                    canManageCategories,
                    canManageRecipes,
                    canCreateRecipes,
                    canManageUsers,
                    canManageIngredients,
                    canManageUnits,
                    canManageServiceAccounts,
                    canCreateAiContexts,
                  ]
                properties:
                  tenant:
                    oneOf:
                      - type: 'null'
                      - type: object
                        additionalProperties: false
                        required: [public_id, display_name, frontpage_heading]
                        properties:
                          public_id: { type: string, format: uuid }
                          display_name: { type: string }
                          frontpage_heading: { type: [string, 'null'], maxLength: 80 }
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/CookbookCategory'
                  recipes:
                    description: Accessible discoverable recipes matching recipeFilter regardless of featured state.
                    type: array
                    items:
                      $ref: '#/components/schemas/CookbookRecipe'
                  frontpage:
                    $ref: '#/components/schemas/CookbookFrontpage'
                  canManageCategories:
                    type: boolean
                  canManageRecipes:
                    type: boolean
                  canCreateRecipes:
                    type: boolean
                    description: Granted only by the tenant recipe:create permission.
                  canManageUsers:
                    type: boolean
                  canManageIngredients:
                    type: boolean
                    description: Granted by ingredient:create or ingredient:update; ingredient:read alone does not grant management access.
                  canManageUnits:
                    type: boolean
                    description: Granted by unit:create, unit:update, or unit:delete; unit:read alone does not grant management access.
                  canManageServiceAccounts:
                    type: boolean
                    description: Granted by the tenant service-account:manage permission.
                  canCreateAiContexts:
                    type: boolean
                    description: Granted by the tenant recipe:visibility-update permission.
        '400':
          description: INVALID_RECIPE_FILTER. The diet filter is invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403':
          description: A password change is required before accessing the cookbook.
          content:
            application/json:
              schema:
              $ref: '#/components/schemas/ApiError'
        '404':
          description: The requested tenant is disabled or does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /cookbook/tenants:
    get:
      operationId: listAccessibleCookbookTenants
      summary: Returns the paginated, shuffled accessible enabled cookbooks, the authenticated user's enabled cookbook memberships, and root-page presentation settings.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: filter
          in: query
          description: Case-insensitive contains filter for cookbook names and descriptions.
          schema: { type: string, maxLength: 200 }
        - name: shuffleSeed
          in: query
          description: Keeps the randomized cookbook order stable while paging and filtering.
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Accessible enabled cookbooks and the authenticated user's enabled cookbook memberships.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookbookTenantSelection'
