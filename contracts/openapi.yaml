      security: [{ bearerAuth: [] }]
      parameters:
        - { name: publicId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Scoped published recipe. }
        '401': { description: AI context authentication is required. }
        '404': { description: Recipe outside the context scope or unavailable. }
  /ai-context/reader/recipes/{publicId}/revisions:
    get:
      operationId: listAiContextRecipeRevisions
      summary: Lists published and archived revisions for a recipe inside an AI context scope.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: publicId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Scoped immutable recipe revisions. }
        '401': { description: AI context authentication is required. }
        '404': { description: Recipe outside the context scope or unavailable. }
  /ai-context/reader/recipes/{publicId}/revisions/{revisionPublicId}:
    get:
      operationId: getAiContextRecipeRevision
      summary: Returns an immutable published or archived recipe revision inside an AI context scope.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: publicId, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: revisionPublicId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        '200': { description: Scoped immutable recipe revision. }
        '401': { description: AI context authentication is required. }
        '404': { description: Recipe or revision outside the context scope or unavailable. }
  /ai-context/reader/recipes/{publicId}/draft:
    get:
      operationId: getAiContextRecipeDraft
      summary: Returns the current draft for a recipe inside an AI context scope.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: publicId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Scoped current recipe draft. }
        '401': { description: AI context authentication is required. }
        '404':
          { description: Recipe outside the context scope has no current draft or is unavailable. }
  /admin/mail-settings:
    get:
      operationId: getInstanceMailSettings
      summary: Returns non-secret SMTP settings for the instance.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The mail settings state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceMailSettings'
        '401':
          {
            description: Authentication is required,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
        '403':
          {
            description: An instance permission is required,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
    put:
      operationId: saveInstanceMailSettings
      summary: Stores encrypted SMTP settings for the instance.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceMailSettingsInput'
      responses:
        '204': { description: The mail settings were stored. }
        '400':
          {
            description: The settings are invalid,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
        '401':
          {
            description: Authentication is required,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
        '403':
          {
            description: An instance permission is required,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
        '503':
          {
            description: The instance encryption key is not configured,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
  /admin/mail-settings/test:
    post:
      operationId: sendInstanceMailSettingsTest
      summary: Sends a test message using the stored SMTP settings.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recipient]
              properties:
                recipient: { type: string, format: email }
      responses:
        '204': { description: The test message was accepted for delivery. }
        '400':
          {
            description: The recipient is invalid,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
        '401':
          {
            description: Authentication is required,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
        '403':
          {
            description: An instance permission is required,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
        '409':
          {
            description: Mail is not configured,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
        '502':
          {
            description: SMTP delivery failed,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
        '503':
          {
            description: The instance encryption key is not configured,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
  /cookbook:
    get:
      operationId: getCookbook
      summary: Returns published public recipes, accessible membership recipes, and the paginated featured front page.
      parameters:
        - name: tenantSlug
          in: query
          required: false
          schema: { type: string }
        - name: frontpagePage
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: recipeFilter
          in: query
          required: false
          description: Case-insensitive contains filter for recipe titles and summaries. Title matches are ordered before summary-only matches.
          schema: { type: string, maxLength: 200 }
        - name: refreshFrontpageShuffle
          in: query
          required: false
          description: Renews the authenticated session's featured-recipe ordering.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: The accessible cookbook overview.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  [
                    tenant,
                    categories,
                    recipes,
                    frontpage,
                    canManageCategories,
                    canManageRecipes,
                    canManageUsers,
                    canManageIngredients,
                    canManageUnits,
                  ]
                properties:
                  tenant:
                    oneOf:
                      - type: 'null'
                      - type: object
                        additionalProperties: false
                        required: [display_name, frontpage_heading]
                        properties:
                          display_name: { type: string }
                          frontpage_heading: { type: [string, 'null'], maxLength: 80 }
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/CookbookCategory'
                  recipes:
                    type: array
                    items:
                      $ref: '#/components/schemas/CookbookRecipe'
                  frontpage:
                    $ref: '#/components/schemas/CookbookFrontpage'
                  canManageCategories:
                    type: boolean
                  canManageRecipes:
                    type: boolean
                  canManageUsers:
                    type: boolean
                  canManageIngredients:
                    type: boolean
                  canManageUnits:
                    type: boolean
        '403':
          description: A password change is required before accessing the cookbook.
          content:
            application/json:
              schema:
              $ref: '#/components/schemas/ApiError'
        '404':
          description: The requested tenant is disabled or does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /cookbook/tenants:
    get:
      operationId: listAccessibleCookbookTenants
      summary: Returns the paginated, shuffled accessible enabled cookbooks, the authenticated user's enabled cookbook memberships, and root-page presentation settings.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: filter
          in: query
          description: Case-insensitive contains filter for cookbook names and descriptions.
          schema: { type: string, maxLength: 200 }
        - name: shuffleSeed
          in: query
          description: Keeps the randomized cookbook order stable while paging and filtering.
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Accessible enabled cookbooks and the authenticated user's enabled cookbook memberships.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookbookTenantSelection'
