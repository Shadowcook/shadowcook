        dimension: { type: [string, 'null'], enum: [MASS, VOLUME, COUNT, TEMPERATURE, null] }
        baseFactor: { type: [string, 'null'] }
        baseOffset: { type: [string, 'null'] }
        usageCount: { type: integer, minimum: 0 }
    TenantUnitInput:
      type: object
      additionalProperties: false
      required: [name, symbol]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        symbol: { type: string, minLength: 1, maxLength: 100 }
        translations: { $ref: '#/components/schemas/UnitTranslations' }
        equivalenceAmount:
          { type: [string, 'null'], pattern: '^(?:0|[1-9][0-9]*)(?:\\.[0-9]{1,12})?$' }
        referenceUnitPublicId: { type: [string, 'null'], format: uuid }
    UnitInput:
      type: object
      additionalProperties: false
      required: [name, symbol, dimension, baseFactor, baseOffset]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        symbol: { type: string, minLength: 1, maxLength: 100 }
        translations: { $ref: '#/components/schemas/UnitTranslations' }
        dimension: { type: string, enum: [MASS, VOLUME, COUNT, TEMPERATURE] }
        baseFactor: { type: string, pattern: '^(?:0|[1-9][0-9]*)(?:\\.[0-9]{1,12})?$' }
        baseOffset: { type: string, pattern: '^-?(?:0|[1-9][0-9]*)(?:\\.[0-9]{1,12})?$' }
    Unit:
      type: object
      additionalProperties: false
      required:
        [
          publicId,
          name,
          symbol,
          localizationKey,
          translations,
          dimension,
          baseFactor,
          baseOffset,
          usageCount,
        ]
      properties:
        publicId: { type: string, format: uuid }
        name: { type: string }
        symbol: { type: string }
        localizationKey: { type: [string, 'null'] }
        translations: { $ref: '#/components/schemas/UnitTranslations' }
        dimension: { type: string, enum: [MASS, VOLUME, COUNT, TEMPERATURE] }
        baseFactor: { type: string }
        baseOffset: { type: string }
        usageCount: { type: integer, minimum: 0 }
    UnitTranslations:
      type: object
      description: >-
        Additional language versions keyed by lowercase language code. English is stored in the
        unit's top-level name and symbol, and must not be included here. On writes, supplying this
        object replaces all additional language versions atomically with the unit update. Omitting
        it preserves existing versions; an empty object removes them. Web clients select their UI
        locale and fall back to the top-level English name and symbol.
      maxProperties: 50
      propertyNames:
        pattern: '^(?!en$)[a-z]{2,3}(?:-[a-z]{4})?(?:-(?:[a-z]{2}|[0-9]{3}))?$'
      additionalProperties:
        type: object
        additionalProperties: false
        required: [name, symbol]
        properties:
          name: { type: string, minLength: 1, maxLength: 100 }
          symbol: { type: string, minLength: 1, maxLength: 100 }
    CookbookCategory:
      type: object
      additionalProperties: false
      required: [public_id, parent_public_id, name, slug, sort_order]
      properties:
        public_id:
          type: string
          format: uuid
        parent_public_id:
          type: [string, 'null']
          format: uuid
        name:
          type: string
        slug:
          type: string
        sort_order:
          type: integer
          minimum: 0
    CookbookRecipe:
      type: object
      additionalProperties: false
      required: [public_id, slug, title, summary, diet, category_public_ids, variants]
      properties:
        public_id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        summary:
          type: [string, 'null']
        diet:
          $ref: '#/components/schemas/RecipeDiet'
        variants:
          type: array
          description: Visible variants and the default variant of the published revision, ordered by name and variant key. Authored names are unchanged.
          items: { $ref: '#/components/schemas/PublishedRecipeVariant' }
        category_public_ids:
          type: array
          items:
            type: string
            format: uuid
    CookbookFrontpage:
      type: object
