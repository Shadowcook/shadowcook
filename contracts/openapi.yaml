              {
                'type': 'string',
                'maxLength': 2000,
                'description': 'Optional public explanation, trimmed before validation, sent only in the deletion email through user_reason. Not included in the private audit reason or request logs. May be empty or omitted.',
              },
            'relatedReportPublicId': { 'type': ['string', 'null'], 'format': 'uuid' },
            'confirmation': { 'type': 'string', 'format': 'uuid' },
            'preservationReviewed': { 'type': 'boolean', 'const': true },
            'expectedScope': { '$ref': '#/components/schemas/DeletionScope' },
          },
        'required': ['reason', 'confirmation', 'preservationReviewed', 'expectedScope'],
      }
    RecoveryDeliveries:
      {
        'type': 'object',
        'additionalProperties': false,
        'properties':
          {
            'deliveries':
              {
                'type': 'array',
                'minItems': 1,
                'maxItems': 2,
                'items':
                  {
                    'type': 'object',
                    'additionalProperties': false,
                    'properties':
                      {
                        'recipient': { 'type': 'string', 'enum': ['OLD_ADDRESS', 'NEW_ADDRESS'] },
                        'status': { 'type': 'string', 'enum': ['SENT', 'FAILED'] },
                      },
                    'required': ['recipient', 'status'],
                  },
              },
          },
        'required': ['deliveries'],
      }
    OwnershipCandidatesInput:
      {
        'type': 'object',
        'additionalProperties': false,
        'properties':
          {
            'reason':
              {
                'type': 'string',
                'minLength': 1,
                'maxLength': 2000,
                'description': 'Trimmed mandatory reason documenting recovery verification; never include identity documents or secrets.',
              },
            'relatedReportPublicId': { 'type': ['string', 'null'], 'format': 'uuid' },
            'query': { 'type': 'string', 'minLength': 2, 'maxLength': 254 },
          },
        'required': ['reason', 'query'],
      }
    OwnershipCandidates:
      {
        'type': 'object',
        'additionalProperties': false,
        'properties':
          {
            'users':
              {
                'type': 'array',
                'maxItems': 50,
                'items':
                  {
                    'type': 'object',
                    'additionalProperties': false,
                    'properties':
                      {
                        'publicId': { 'type': 'string', 'format': 'uuid' },
                        'displayName': { 'type': 'string' },
                        'email': { 'type': 'string', 'format': 'email' },
                      },
                    'required': ['publicId', 'displayName', 'email'],
                  },
              },
          },
        'required': ['users'],
      }
    OwnershipTransferInput:
      {
        'type': 'object',
        'additionalProperties': false,
        'properties':
          {
            'reason':
              {
                'type': 'string',
                'minLength': 1,
                'maxLength': 2000,
                'description': 'Trimmed mandatory reason documenting recovery verification; never include identity documents or secrets.',
              },
            'relatedReportPublicId': { 'type': ['string', 'null'], 'format': 'uuid' },
            'recipientPublicId': { 'type': 'string', 'format': 'uuid' },
            'expectedOwnerPublicId': { 'type': ['string', 'null'], 'format': 'uuid' },
            'formerOwnerRole': { 'type': 'string', 'enum': ['REMOVE', 'Viewer', 'Editor'] },
            'confirmed': { 'type': 'boolean', 'const': true },
          },
        'required':
          ['reason', 'recipientPublicId', 'expectedOwnerPublicId', 'formerOwnerRole', 'confirmed'],
      }
    OwnershipTransferResponse:
      {
        'type': 'object',
        'additionalProperties': false,
        'properties':
          {
            'cookbookPublicId': { 'type': 'string', 'format': 'uuid' },
            'oldOwnerPublicId': { 'type': ['string', 'null'], 'format': 'uuid' },
            'newOwnerPublicId': { 'type': 'string', 'format': 'uuid' },
            'formerOwnerRole': { 'type': 'string', 'enum': ['REMOVE', 'Viewer', 'Editor'] },
            'notifications':
              {
                'type': 'array',
                'minItems': 1,
                'maxItems': 2,
                'items':
                  {
                    'type': 'object',
                    'additionalProperties': false,
                    'properties':
                      {
                        'recipient': { 'type': 'string', 'enum': ['OLD_OWNER', 'NEW_OWNER'] },
                        'status': { 'type': 'string', 'enum': ['SENT', 'FAILED'] },
                      },
                    'required': ['recipient', 'status'],
                  },
              },
          },
        'required':
          [
            'cookbookPublicId',
            'oldOwnerPublicId',
            'newOwnerPublicId',
            'formerOwnerRole',
            'notifications',
          ],
      }
    InspectionPurpose:
      {
        'type': 'object',
        'additionalProperties': false,
        'required': ['reason'],
        'properties':
          {
            'reason':
              {
                'type': 'string',
                'minLength': 1,
                'maxLength': 2000,
                'description': 'Trimmed nonblank legitimate administrative purpose. Never send it in a URL.',
              },
            'relatedReportPublicId':
              {
                'type': ['string', 'null'],
                'format': 'uuid',
                'description': 'Optional public UUID of an existing content report.',
              },
          },
      }
    InspectionOverview:
      {
        'type': 'object',
