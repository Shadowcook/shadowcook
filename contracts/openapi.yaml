openapi: 3.1.1
info:
  title: Shadowcook API
  version: 0.1.0
paths:
  /registration/config:
    get:
      operationId: getPublicRegistrationConfiguration
      summary: Returns whether public self-service registration is enabled.
      responses:
        '200':
          description: Public registration configuration.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [enabled, turnstileSiteKey, turnstileRequired]
                properties:
                  enabled: { type: boolean }
                  turnstileSiteKey: { type: string }
                  turnstileRequired: { type: boolean }
  /admin/registration-settings:
    get:
      operationId: getRegistrationSettings
      summary: Returns the instance public-registration setting.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Registration settings.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [enabled, turnstileEnabled, turnstileConfigured]
                properties:
                  enabled: { type: boolean }
                  turnstileEnabled: { type: boolean }
                  turnstileConfigured: { type: boolean }
        '403': { description: Instance administration permission is required. }
    put:
      operationId: updateRegistrationSettings
      summary: Enables or disables public self-service registration.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, turnstileEnabled]
              properties:
                enabled: { type: boolean }
                turnstileEnabled: { type: boolean }
      responses:
        '204': { description: Registration setting updated. }
        '400': { description: Registration setting is invalid. }
        '403': { description: Instance administration permission is required. }
        '409':
          {
            description: Turnstile was requested but is not configured in the deployment environment.,
          }
  /registration:
    post:
      operationId: createPendingRegistration
      summary: Creates an email-verification pending registration without creating a user or tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, tenantName, turnstileToken, website]
              properties:
                email: { type: string, format: email }
                password:
                  {
                    type: string,
                    format: password,
                    description: Must meet the configured minimum estimated entropy.,
                  }
                tenantName: { type: string, minLength: 1, maxLength: 120 }
                turnstileToken: { type: string }
                website: { type: string, description: Honeypot field which must be empty. }
      responses:
        '202':
          {
            description: The generic registration acknowledgement; it does not disclose account existence.,
          }
        '400': { description: Registration details or Turnstile verification are invalid. }
        '403': { description: Public registration is disabled. }
        '429': { description: Registration request limit reached. }
        '503': { description: Verification email delivery is unavailable. }
  /registration/resend-verification:
    post:
      operationId: resendRegistrationVerification
      summary: Requests a new verification email without disclosing registration existence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Generic acknowledgement. }
        '403': { description: Public registration is disabled. }
  /registration/verify:
    post:
      operationId: verifyPendingRegistration
      summary: Consumes a registration verification token and atomically creates the user and tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
      responses:
        '201':
          description: User and tenant were created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [tenantSlug]
                properties:
                  tenantSlug: { type: string }
        '400': { description: Verification token is invalid, expired, or already consumed. }
  /auth/login:
    post:
      operationId: login
      summary: Authenticates a human user and starts a browser session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Authentication succeeded. The response sets the HttpOnly session cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [hasPassword, passwordChangeRequired]
                properties:
                  hasPassword:
                    type: boolean
                  passwordChangeRequired:
                    type: boolean
        '400':
          description: The request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/password-requirements:
    get:
      operationId: getPasswordRequirements
      summary: Returns the current instance minimum password entropy for local password-form feedback.
      responses:
        '200':
          description: Password requirements.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [minimumPasswordEntropy]
                properties:
                  minimumPasswordEntropy: { type: integer, minimum: 1, maximum: 256 }
  /auth/change-password:
    post:
      operationId: changePassword
      summary: Changes the authenticated user's password.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [newPassword]
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                  description: Must meet the configured minimum estimated entropy.
      responses:
        '204':
          description: The password was changed.
        '400':
          description: The request body or new password is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      summary: Requests a password-reset email without exposing whether an account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '204': { description: The request was accepted without account-existence disclosure. }
  /auth/password-reset/complete:
    post:
      operationId: completePasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword:
                  {
                    type: string,
                    format: password,
                    description: Must meet the configured minimum estimated entropy.,
                  }
      responses:
        '204': { description: The password was changed and the reset token was consumed. }
        '400':
          description: The reset token or password is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/session:
    get:
      operationId: getCurrentSession
      summary: Returns the current browser session state.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The active session.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [email, hasPassword, passwordChangeRequired]
                properties:
                  email:
                    type: string
                    format: email
                  hasPassword:
                    type: boolean
                  passwordChangeRequired:
                    type: boolean
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/logout:
    post:
      operationId: logout
      summary: Revokes the current browser session.
      security:
        - sessionCookie: []
      responses:
        '204':
          description: The session was revoked.
  /auth/authentication-methods:
    get:
      operationId: getAuthenticationMethods
      summary: Returns publicly enabled browser sign-in methods.
      responses:
        '200':
          description: Enabled methods.
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      additionalProperties: false,
                      required: [password, emailCode],
                      properties: { password: { type: boolean }, emailCode: { type: boolean } },
                    },
                },
            }
  /auth/email-code/request:
    post:
      operationId: requestLoginEmailCode
      summary: Requests a sign-in code without revealing whether an account exists.
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    additionalProperties: false,
                    required: [email],
                    properties: { email: { type: string, format: email } },
                  },
              },
          }
      responses: { '204': { description: The request was accepted. } }
  /auth/email-code/verify:
    post:
      operationId: verifyLoginEmailCode
      summary: Verifies a login code and starts a browser session.
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    additionalProperties: false,
                    required: [email, code],
                    properties:
                      {
                        email: { type: string, format: email },
                        code: { type: string, pattern: '^[0-9]{6}$' },
                      },
                  },
              },
          }
      responses:
        '200':
          {
            description: Authentication succeeded.,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        required: [hasPassword, passwordChangeRequired],
                        properties:
                          {
                            hasPassword: { type: boolean },
                            passwordChangeRequired: { type: boolean },
                          },
                      },
                  },
              },
          }
        '400':
          {
            description: Invalid request,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
        '401':
          {
            description: Invalid or expired code,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
  /admin/authentication-settings:
    get:
      operationId: getAuthenticationSettings
      security: [{ sessionCookie: [] }]
      responses:
        {
          '200':
            {
              description: Settings,
              content:
                {
                  application/json:
                    {
                      schema:
                        {
                          type: object,
                          required: [loginMode, minimumPasswordEntropy],
                          properties:
                            {
                              loginMode:
                                {
                                  type: string,
                                  enum: [PASSWORD_ONLY, EMAIL_CODE_ONLY, PASSWORD_OR_EMAIL_CODE],
                                },
                              minimumPasswordEntropy:
                                {
                                  type: integer,
                                  minimum: 1,
                                  maximum: 256,
                                  description: Minimum estimated password entropy in bits.,
                                },
                            },
                        },
                    },
                },
            },
        }
    put:
      operationId: saveAuthenticationSettings
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [loginMode, minimumPasswordEntropy],
                    properties:
                      {
                        loginMode:
                          {
                            type: string,
                            enum: [PASSWORD_ONLY, EMAIL_CODE_ONLY, PASSWORD_OR_EMAIL_CODE],
                          },
                        minimumPasswordEntropy:
                          {
                            type: integer,
                            minimum: 1,
                            maximum: 256,
                            description: Minimum estimated password entropy in bits.,
                          },
                      },
                  },
              },
          }
      responses:
        {
          '204': { description: Saved. },
          '400':
            {
              description: Invalid authentication settings,
              content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
            },
          '409':
            {
              description: SMTP required for email-only mode,
              content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
            },
        }
  /admin/units:
    get:
      operationId: listUnits
      summary: Lists instance-owned units of measure and recipe usage counts.
      security: [{ sessionCookie: [] }]
      responses:
        {
          '200':
            {
              description: Units,
              content:
                {
                  application/json:
                    {
                      schema:
                        {
                          type: object,
                          required: [units],
                          properties:
                            {
                              units: { type: array, items: { $ref: '#/components/schemas/Unit' } },
                            },
                        },
                    },
                },
            },
        }
    post:
      operationId: createUnit
      summary: Creates an instance-owned unit of measure.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UnitInput' } } }
      responses:
        {
          '201':
            {
              description: Unit created,
              content: { application/json: { schema: { $ref: '#/components/schemas/Unit' } } },
            },
          '400':
            {
              description: Invalid unit,
              content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
            },
          '409':
            {
              description: Unit name or symbol conflict,
              content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
            },
        }
  /admin/units/convert:
    post:
      operationId: convertUnitAmount
      summary: Converts an amount between two instance-owned units of the same dimension.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    additionalProperties: false,
                    required: [amount, sourceUnitPublicId, targetUnitPublicId],
                    properties:
                      {
                        amount:
                          { type: string, pattern: '^-?(?:0|[1-9][0-9]*)(?:\\.[0-9]{1,12})?$' },
                        sourceUnitPublicId: { type: string, format: uuid },
                        targetUnitPublicId: { type: string, format: uuid },
                      },
                  },
              },
          }
      responses:
        {
          '200':
            {
              description: Converted amount,
              content:
                {
                  application/json:
                    {
                      schema:
                        {
                          type: object,
                          required: [amount, dimension],
                          properties:
                            {
                              amount: { type: string },
                              dimension: { type: string, enum: [MASS, VOLUME, COUNT, TEMPERATURE] },
                            },
                        },
                    },
                },
            },
          '400':
            {
              description: Invalid conversion,
              content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
            },
          '404':
            {
              description: Unit not found,
              content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
            },
          '409':
            {
              description: Unit dimension mismatch,
              content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
            },
        }
  /admin/units/{publicId}:
    patch:
      operationId: updateUnit
      summary: Updates an instance-owned unit of measure.
      security: [{ sessionCookie: [] }]
      parameters:
        [{ name: publicId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UnitInput' } } }
      responses:
        {
          '204': { description: Unit updated. },
          '400':
            {
              description: Invalid unit,
              content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
            },
          '404':
            {
              description: Unit not found,
              content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
            },
          '409':
            {
              description: Unit name or symbol conflict,
              content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
            },
        }
    delete:
      operationId: deleteUnit
      summary: Deletes an unused instance-owned unit of measure.
      security: [{ sessionCookie: [] }]
      parameters:
        [{ name: publicId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        {
          '204': { description: Unit deleted. },
          '404':
            {
              description: Unit not found,
              content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
            },
          '409':
            {
              description: Unit is used by recipe ingredients,
              content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
            },
        }
  /admin/tenants:
    get:
      operationId: listTenants
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Tenant list and tenant-creation mail availability.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantListResponse' }
    post:
      operationId: createTenant
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [firstName, lastName, email, cookbookName, slug],
                    properties:
                      {
                        firstName: { type: string },
                        lastName: { type: string },
                        email: { type: string, format: email },
                        cookbookName: { type: string },
                        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' },
                      },
                  },
              },
          }
      responses:
        {
          '201': { description: Tenant and owner invitation created. },
          '400':
            {
              description: Invalid tenant,
              content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
            },
          '409':
            {
              description: Tenant slug conflict,
              content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
            },
          '429':
            {
              description: Invitation-code request limit reached; no tenant was created,
              content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
            },
          '502':
            {
              description: SMTP delivery failed; no tenant was created,
              content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
            },
          '503':
            {
              description: 'SMTP is not configured; no tenant was created. Returns SMTP_REQUIRED.',
              content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
            },
        }
  /admin/tenants/{publicId}:
    patch:
      operationId: updateTenant
      summary: Changes a tenant display name, slug, or enabled state.
      security: [{ sessionCookie: [] }]
      parameters:
        [{ name: publicId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    additionalProperties: false,
                    properties:
                      {
                        displayName: { type: string, minLength: 1 },
                        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' },
                        disabled: { type: boolean },
                      },
                    minProperties: 1,
                  },
              },
          }
      responses:
        {
          '204': { description: Tenant updated. },
          '400':
            {
              description: Invalid update,
              content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
            },
          '409':
            {
              description: Tenant slug conflict,
              content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
            },
          '404':
            {
              description: Tenant not found,
              content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
            },
        }
    delete:
      operationId: deleteTenant
      summary: Permanently deletes a tenant and all tenant-owned data.
      security: [{ sessionCookie: [] }]
      parameters:
        [{ name: publicId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        {
          '204': { description: Tenant and tenant-owned data deleted. },
          '404':
            {
              description: Tenant not found,
              content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
            },
        }
  /admin/users:
    get:
      operationId: listUsers
      security: [{ sessionCookie: [] }]
      responses:
        {
          '200':
            {
              description: Users,
              their lifecycle state,
              and tenant memberships.,
              content:
                {
                  application/json:
                    {
                      schema:
                        {
                          type: object,
                          additionalProperties: false,
                          required: [users],
                          properties:
                            {
                              users:
                                {
                                  type: array,
                                  items:
                                    {
                                      type: object,
                                      additionalProperties: false,
                                      required:
                                        [
                                          public_id,
                                          email,
                                          display_name,
                                          password_change_required,
                                          disabled_at,
                                          deleted_at,
                                          last_login_at,
                                          tenants,
                                          instance_roles,
                                        ],
                                      properties:
                                        {
                                          public_id: { type: string, format: uuid },
                                          email: { type: string, format: email },
                                          display_name: { type: string },
                                          password_change_required: { type: boolean },
                                          disabled_at:
                                            { type: [string, 'null'], format: date-time },
                                          deleted_at: { type: [string, 'null'], format: date-time },
                                          last_login_at:
                                            { type: [string, 'null'], format: date-time },
                                          tenants:
                                            {
                                              type: array,
                                              items:
                                                {
                                                  type: object,
                                                  additionalProperties: false,
                                                  required: [publicId, name],
                                                  properties:
                                                    {
                                                      publicId: { type: string, format: uuid },
                                                      name: { type: string },
                                                    },
                                                },
                                            },
                                          instance_roles: { type: array, items: { type: string } },
                                        },
                                    },
                                },
                            },
                        },
                    },
                },
            },
          '401': { description: Authentication required. },
          '403': { description: Instance administration permission required. },
        }
  /admin/instance-roles:
    get:
      operationId: listInstanceRoles
      summary: Lists assignable instance roles.
      security: [{ sessionCookie: [] }]
      responses:
        {
          '200':
            {
              description: Instance roles,
              content:
                {
                  application/json:
                    {
                      schema:
                        {
                          type: object,
                          additionalProperties: false,
                          required: [roles],
                          properties:
                            {
                              roles:
                                {
                                  type: array,
                                  items:
                                    {
                                      type: object,
                                      additionalProperties: false,
                                      required: [code, name],
                                      properties:
                                        { code: { type: string }, name: { type: string } },
                                    },
                                },
                            },
                        },
                    },
                },
            },
          '401': { description: Authentication required. },
          '403': { description: Instance administration permission required. },
        }
  /admin/users/{publicId}/instance-roles:
    put:
      operationId: replaceUserInstanceRoles
      summary: Replaces a user's instance role assignments.
      security: [{ sessionCookie: [] }]
      parameters:
        [{ name: publicId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [roleCodes]
              properties: { roleCodes: { type: array, items: { type: string }, uniqueItems: true } }
      responses:
        {
          '204': { description: Instance roles replaced. },
          '400': { description: Invalid instance role assignment. },
          '401': { description: Authentication required. },
          '403': { description: Instance administration permission required. },
          '404': { description: Active user not found. },
        }
  /cookbook/tenant-users:
    get:
      operationId: listTenantUsers
      summary: Lists only the users and assignable roles of the managed tenant.
      security: [{ sessionCookie: [] }]
      parameters: [{ name: tenantSlug, in: query, required: true, schema: { type: string } }]
      responses:
        {
          '200':
            {
              description: Tenant users and roles,
              content:
                {
                  application/json:
                    {
                      schema:
                        {
                          type: object,
                          additionalProperties: false,
                          required: [users, roles],
                          properties:
                            {
                              users:
                                {
                                  type: array,
                                  items:
                                    {
                                      type: object,
                                      additionalProperties: false,
                                      required: [public_id, email, display_name, roles],
                                      properties:
                                        {
                                          public_id: { type: string, format: uuid },
                                          email: { type: string, format: email },
                                          display_name: { type: string },
                                          roles:
                                            {
                                              type: array,
                                              items:
                                                {
                                                  type: object,
                                                  additionalProperties: false,
                                                  required: [id, name],
                                                  properties:
                                                    {
                                                      id: { type: string, format: uuid },
                                                      name: { type: string },
                                                    },
                                                },
                                            },
                                        },
                                    },
                                },
                              roles:
                                {
                                  type: array,
                                  items:
                                    {
                                      type: object,
                                      additionalProperties: false,
                                      required: [id, name],
                                      properties:
                                        {
                                          id: { type: string, format: uuid },
                                          name: { type: string },
                                        },
                                    },
                                },
                            },
                        },
                    },
                },
            },
          '400': { description: Invalid tenant. },
          '401': { description: Authentication required. },
          '403': { description: Tenant management permission required. },
          '404': { description: Tenant not found. },
        }
  /cookbook/tenant-users/invitations:
    post:
      operationId: inviteTenantUser
      summary: Invites a new user to a tenant with one selected tenant role.
      description: Requires the tenant-scoped `tenant:manage` permission; instance-wide roles do not grant access.
      security: [{ sessionCookie: [] }]
      parameters: [{ name: tenantSlug, in: query, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, roleId]
              properties:
                { email: { type: string, format: email }, roleId: { type: string, format: uuid } }
      responses:
        {
          '201': { description: Tenant invitation sent. },
          '400': { description: Invalid invitation or tenant role. },
          '401': { description: Authentication required. },
          '403': { description: Tenant management permission required. },
          '409': { description: Active user already uses the email. },
          '503': { description: Email delivery is not configured. },
        }
  /cookbook/tenant-users/{publicId}/roles:
    put:
      operationId: replaceTenantUserRoles
      summary: Replaces roles for an existing user of the specified tenant.
      description: Requires the tenant-scoped `tenant:manage` permission; instance-wide roles do not grant access.
      security: [{ sessionCookie: [] }]
      parameters:
        [
          { name: publicId, in: path, required: true, schema: { type: string, format: uuid } },
          { name: tenantSlug, in: query, required: true, schema: { type: string } },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [roleIds]
              properties:
                {
                  roleIds:
                    {
                      type: array,
                      minItems: 1,
                      uniqueItems: true,
                      items: { type: string, format: uuid },
                    },
                }
      responses:
        {
          '204': { description: Tenant roles replaced. },
          '400': { description: Invalid tenant role assignment. },
          '401': { description: Authentication required. },
          '403': { description: Tenant management permission required. },
          '404': { description: Tenant or tenant user not found. },
        }
  /admin/users/{publicId}:
    patch:
      operationId: updateUser
      security: [{ sessionCookie: [] }]
      parameters:
        [{ name: publicId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    additionalProperties: false,
                    minProperties: 1,
                    properties:
                      { displayName: { type: string, minLength: 1 }, disabled: { type: boolean } },
                  },
              },
          }
      responses:
        {
          '204': { description: User updated. },
          '400': { description: Invalid user update. },
          '404': { description: Active user not found. },
        }
    delete:
      operationId: deleteUser
      summary: Soft-deletes a user, revokes sessions, and releases the email address for a new account.
      security: [{ sessionCookie: [] }]
      parameters:
        [{ name: publicId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        {
          '204': { description: User soft-deleted. },
          '404': { description: Active user not found. },
        }
  /admin/users/invitations:
    post:
      operationId: inviteUser
      summary: Sends an account-creation invitation to an email address.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '201': { description: Invitation email sent. }
        '400': { description: Invalid invitation email. }
        '409': { description: An active user already has this email address. }
        '503': { description: Invitation email delivery is not configured. }
  /admin/users/{publicId}/reset-password:
    post:
      operationId: resetUserPassword
      summary: Sends an administrator-required password-reset link to the registered email address.
      security: [{ sessionCookie: [] }]
      parameters:
        [{ name: publicId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        {
          '204': { description: Reset email sent and existing sessions revoked. },
          '404': { description: Active user not found. },
          '502': { description: Password-reset email delivery failed. },
          '503': { description: Password-reset email delivery is not configured. },
        }
  /user-invitations/{token}:
    get:
      operationId: getUserInvitation
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Invitation details, account state, and current password requirement.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [email, passwordRequired, existingAccount]
                properties:
                  email: { type: string, format: email }
                  passwordRequired: { type: boolean }
                  existingAccount: { type: boolean }
        '404': { description: Invitation unavailable. }
  /user-invitations/{token}/accept:
    post:
      operationId: acceptUserInvitation
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                displayName: { type: string, minLength: 1 }
                password:
                  {
                    type: string,
                    format: password,
                    description: Must meet the configured minimum estimated entropy.,
                  }
      responses:
        '204': { description: Account created or an existing account joined the invited cookbook. }
        '400': { description: Invalid invitation details or password. }
        '401': { description: Existing invited account must sign in before accepting. }
        '403': { description: Signed-in email address does not match the invitation. }
        '404': { description: Invitation unavailable. }
        '409':
          { description: An instance-user invitation cannot be accepted for an existing account. }
  /invitations/{token}:
    get:
      operationId: getTenantInvitation
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        {
          '200': { description: Invitation details. },
          '404':
            {
              description: Invitation unavailable,
              content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
            },
        }
  /invitations/{token}/accept:
    post:
      operationId: acceptTenantInvitation
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [code],
                    properties: { code: { type: string, pattern: '^[0-9]{6}$' } },
                  },
              },
          }
      responses:
        '200':
          description: Invitation accepted and browser session started.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [cookbookSlug, hasPassword, passwordChangeRequired]
                properties:
                  cookbookSlug: { type: string }
                  hasPassword: { type: boolean }
                  passwordChangeRequired: { type: boolean }
        '401':
          description: Invalid email code.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '403':
          description: The active session uses a different email address.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '404':
          description: Invitation unavailable.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /health:
    get:
      operationId: getHealth
      summary: Returns API process readiness after database migrations have completed.
      responses:
        '200':
          description: The API process is accepting requests.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: ok
  /cookbook/tenants/{tenantSlug}/ai-contexts:
    post:
      operationId: createAiContext
      summary: Creates a one-time AI context link for a private recipe or category subtree.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantSlug' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scopeType, scopePublicId, durationHours]
              properties:
                scopeType: { type: string, enum: [TENANT, RECIPE, CATEGORY] }
                scopePublicId: { type: string, minLength: 1 }
                durationHours: { type: integer, enum: [4, 8, 24] }
      responses:
        '201':
          description: The one-time access URL. It expires in thirty minutes.
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
  /ai-context/{bootstrapToken}:
    get:
      operationId: exchangeAiContextLink
      summary: Exchanges a one-time AI context URL for a scoped read-only bearer token, tenant identity, web route templates, and endpoint manifest.
      parameters:
        - { name: bootstrapToken, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: AI context manifest and bearer token. }
        '404': { description: The context link is expired, consumed, or revoked. }
  /ai-context/reader:
    get:
      operationId: getAiContextOverview
      summary: Returns the categories and published recipes inside an AI context scope.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Scoped reader overview. }
        '401': { description: AI context authentication is required. }
  /ai-context/reader/recipes/{publicId}:
    get:
      operationId: getAiContextRecipe
