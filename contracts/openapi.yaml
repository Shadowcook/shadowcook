        usage_key: { type: string, format: uuid }
        ingredient_public_id: { type: [string, 'null'], format: uuid }
        ingredient_alias_public_id: { type: [string, 'null'], format: uuid }
        text_override: { type: [string, 'null'] }
        special_kind:
          {
            type: [string, 'null'],
