                    'disabled_at',
                    'name_reset_required',
                    'created_at',
                    'updated_at',
                    'owner_public_id',
                    'owner_name',
                  ],
                'properties':
                  {
                    'public_id': { 'type': 'string', 'format': 'uuid' },
                    'display_name': { 'type': 'string' },
                    'slug': { 'type': 'string' },
                    'description': { 'type': ['string', 'null'] },
                    'disabled_at': { 'type': ['string', 'null'], 'format': 'date-time' },
                    'name_reset_required': { 'type': 'boolean' },
                    'created_at': { 'type': 'string', 'format': 'date-time' },
                    'updated_at': { 'type': 'string', 'format': 'date-time' },
                    'owner_public_id': { 'type': ['string', 'null'], 'format': 'uuid' },
                    'owner_name': { 'type': ['string', 'null'] },
                  },
              },
            'counts':
              {
                'type': 'object',
                'additionalProperties': false,
                'required': ['recipes', 'members', 'reports'],
                'properties':
                  {
                    'recipes': { 'type': 'integer', 'minimum': 0 },
                    'members': { 'type': 'integer', 'minimum': 0 },
                    'reports': { 'type': 'integer', 'minimum': 0 },
                  },
              },
          },
      }
    InspectionListInput:
      {
        'type': 'object',
        'additionalProperties': false,
        'required': ['reason'],
        'properties':
          {
            'reason':
              {
                'type': 'string',
                'minLength': 1,
                'maxLength': 2000,
                'description': 'Trimmed nonblank legitimate administrative purpose. Never send it in a URL.',
              },
            'relatedReportPublicId':
              {
                'type': ['string', 'null'],
                'format': 'uuid',
                'description': 'Optional public UUID of an existing content report.',
              },
            'query':
              {
                'type': 'string',
                'maxLength': 254,
                'default': '',
                'description': 'Trimmed literal case-insensitive substring; recipes match latest title/slug/exact UUID, revisions match title/exact UUID, members match name/exact account UUID, reports match status/exact report UUID. Kept out of URLs.',
              },
            'page': { 'type': 'integer', 'minimum': 1, 'maximum': 1000000, 'default': 1 },
            'pageSize': { 'type': 'integer', 'minimum': 1, 'maximum': 50, 'default': 25 },
          },
      }
    InspectionRecipesPage:
      {
        'type': 'object',
        'additionalProperties': false,
        'required': ['items', 'total', 'page', 'pageSize'],
        'properties':
          {
            'items':
              {
                'type': 'array',
                'maxItems': 50,
                'items':
                  {
                    'type': 'object',
                    'additionalProperties': false,
                    'required':
                      ['public_id', 'slug', 'title', 'deleted_at', 'moderation_blocked_at'],
                    'properties':
                      {
                        'public_id': { 'type': 'string', 'format': 'uuid' },
                        'slug': { 'type': 'string' },
                        'deleted_at': { 'type': ['string', 'null'], 'format': 'date-time' },
                        'moderation_blocked_at':
                          { 'type': ['string', 'null'], 'format': 'date-time' },
                        'title':
                          {
                            'type': ['string', 'null'],
                            'description': 'Title of the latest revision, or null when no revision exists. No revision list is embedded.',
                          },
                      },
                  },
              },
            'total': { 'type': 'integer', 'minimum': 0 },
            'page': { 'type': 'integer', 'minimum': 1 },
            'pageSize': { 'type': 'integer', 'minimum': 1, 'maximum': 50 },
          },
      }
    InspectionMembersPage:
      {
        'type': 'object',
        'additionalProperties': false,
        'required': ['items', 'total', 'page', 'pageSize'],
        'properties':
          {
            'items':
              {
                'type': 'array',
                'maxItems': 50,
                'items':
                  {
                    'type': 'object',
                    'additionalProperties': false,
                    'required': ['public_id', 'display_name', 'joined_at', 'roles'],
                    'properties':
                      {
                        'public_id': { 'type': 'string', 'format': 'uuid' },
                        'display_name': { 'type': 'string' },
                        'joined_at': { 'type': 'string', 'format': 'date-time' },
                        'roles': { 'type': 'array', 'items': { 'type': 'string' } },
                      },
                  },
              },
            'total': { 'type': 'integer', 'minimum': 0 },
            'page': { 'type': 'integer', 'minimum': 1 },
            'pageSize': { 'type': 'integer', 'minimum': 1, 'maximum': 50 },
          },
      }
    InspectionReportsPage:
      {
        'type': 'object',
        'additionalProperties': false,
        'required': ['items', 'total', 'page', 'pageSize'],
        'properties':
          {
            'items':
              {
                'type': 'array',
                'maxItems': 50,
                'items':
                  {
                    'type': 'object',
                    'additionalProperties': false,
                    'required':
                      ['public_id', 'target_type', 'target_public_id', 'status', 'created_at'],
                    'properties':
                      {
                        'public_id': { 'type': 'string', 'format': 'uuid' },
                        'target_type': { 'type': 'string', 'enum': ['COOKBOOK', 'RECIPE'] },
                        'target_public_id': { 'type': 'string', 'format': 'uuid' },
                        'status':
                          { 'type': 'string', 'enum': ['OPEN', 'UNDER_INVESTIGATION', 'CLOSED'] },
                        'created_at': { 'type': 'string', 'format': 'date-time' },
                      },
                  },
              },
            'total': { 'type': 'integer', 'minimum': 0 },
            'page': { 'type': 'integer', 'minimum': 1 },
            'pageSize': { 'type': 'integer', 'minimum': 1, 'maximum': 50 },
          },
      }
    InspectionRevisionsPage:
      {
        'type': 'object',
        'additionalProperties': false,
        'required': ['items', 'total', 'page', 'pageSize'],
        'properties':
          {
            'items':
              {
                'type': 'array',
                'maxItems': 50,
                'items':
                  {
                    'type': 'object',
                    'additionalProperties': false,
                    'required': ['public_id', 'title', 'status', 'revision_no', 'published_at'],
                    'properties':
                      {
                        'public_id': { 'type': 'string', 'format': 'uuid' },
                        'title': { 'type': 'string' },
                        'status': { 'type': 'string', 'enum': ['DRAFT', 'PUBLISHED', 'ARCHIVED'] },
                        'revision_no': { 'type': 'integer' },
                        'published_at': { 'type': ['string', 'null'], 'format': 'date-time' },
                      },
                  },
              },
            'total': { 'type': 'integer', 'minimum': 0 },
            'page': { 'type': 'integer', 'minimum': 1 },
            'pageSize': { 'type': 'integer', 'minimum': 1, 'maximum': 50 },
          },
      }
    InspectionRevision:
      {
        'type': 'object',
        'additionalProperties': false,
        'required': ['revision', 'steps', 'categories', 'media', 'variants'],
        'properties':
          {
            'revision':
              {
                'type': 'object',
                'additionalProperties': false,
                'required':
                  [
                    'public_id',
                    'title',
                    'status',
                    'revision_no',
                    'published_at',
                    'summary',
                    'created_at',
                  ],
                'properties':
                  {
                    'public_id': { 'type': 'string', 'format': 'uuid' },
                    'title': { 'type': 'string' },
                    'status': { 'type': 'string', 'enum': ['DRAFT', 'PUBLISHED', 'ARCHIVED'] },
                    'revision_no': { 'type': 'integer' },
                    'published_at': { 'type': ['string', 'null'], 'format': 'date-time' },
                    'summary': { 'type': ['string', 'null'] },
                    'created_at': { 'type': 'string', 'format': 'date-time' },
                  },
              },
            'steps':
              {
                'type': 'array',
                'items':
                  {
                    'type': 'object',
                    'additionalProperties': false,
                    'required': ['step_key', 'sort_order', 'instruction', 'ingredients'],
                    'properties':
                      {
                        'step_key': { 'type': 'string', 'format': 'uuid' },
                        'sort_order': { 'type': 'integer' },
                        'instruction': { 'type': 'string' },
                        'ingredients':
                          {
                            'type': 'array',
                            'items':
                              {
                                'type': 'object',
                                'additionalProperties': false,
                                'required':
                                  ['name', 'amount', 'unit', 'note', 'special_kind', 'optional'],
                                'properties':
                                  {
                                    'name': { 'type': ['string', 'null'] },
                                    'amount': { 'type': ['string', 'null'] },
                                    'unit': { 'type': ['string', 'null'] },
                                    'note': { 'type': ['string', 'null'] },
                                    'special_kind':
                                      {
                                        'type': ['string', 'null'],
                                        'enum':
                                          [
                                            null,
                                            'NO_ICON',
                                            'REMOVE',
                                            'ADD',
                                            'INFO',
                                            'IMPORTANT',
                                            'COOK',
                                            'COOL',
                                            'HEAT',
                                            'WAIT',
                                            'WORK_STEP',
                                          ],
                                      },
                                    'optional': { 'type': 'boolean' },
                                  },
                              },
                          },
                      },
                  },
              },
            'categories':
              {
                'type': 'array',
                'items':
                  {
                    'type': 'object',
                    'additionalProperties': false,
                    'required': ['public_id', 'name'],
                    'properties':
                      {
                        'public_id': { 'type': 'string', 'format': 'uuid' },
                        'name': { 'type': 'string' },
                      },
                  },
              },
            'media':
              {
                'type': 'array',
                'items':
                  {
                    'type': 'object',
                    'additionalProperties': false,
                    'required': ['public_id'],
                    'properties': { 'public_id': { 'type': 'string', 'format': 'uuid' } },
                  },
              },
            'variants':
              {
                'type': 'array',
                'items':
                  {
                    'type': 'object',
                    'additionalProperties': false,
                    'required':
                      [
                        'variant_key',
                        'name',
                        'is_default',
                        'is_visible',
                        'metadata',
                        'diet',
                        'step_keys',
                      ],
                    'properties':
                      {
                        'variant_key': { 'type': 'string', 'format': 'uuid' },
                        'name': { 'type': 'string' },
                        'is_default': { 'type': 'boolean' },
                        'is_visible': { 'type': 'boolean' },
                        'metadata': { '$ref': '#/components/schemas/RecipeContentMetadata' },
                        'diet':
                          {
                            'type': ['string', 'null'],
                            'enum': [null, 'VEGAN', 'VEGETARIAN', 'OMNI'],
                          },
                        'step_keys':
                          { 'type': 'array', 'items': { 'type': 'string', 'format': 'uuid' } },
                      },
                  },
              },
          },
      }
    UnhandledApiError:
      type: object
      description: Safe framework request error, unhandled server exception, or unavailable web proxy upstream.
      required: [error]
      properties:
        statusCode: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string }
        error: { type: string }
        message: { type: string }
    AiContextScope:
      type: object
      additionalProperties: false
      required: [type, publicId]
      properties:
        type: { type: string, enum: [TENANT, CATEGORY, RECIPE] }
        publicId: { type: string, format: uuid }
    AiContextEndpoint:
      type: object
      additionalProperties: false
      required: [method, path, url]
      properties:
        method: { type: string, const: GET }
        path: { type: string, description: Internal API route template. }
        url:
          {
            type: string,
            description: Absolute public URL template including the API path prefix. Replace placeholders before requesting.,
          }
    RecipeAuthoringResources:
      type: object
      additionalProperties: false
      required:
        [
          name,
          version,
          format,
          formatVersion,
          skillUrl,
          schemaUrl,
          downloadUrl,
          examples,
          instructions,
        ]
      description: Public recipe-authoring resources, independent of the context grant. URLs retain the configured public API prefix. Fetch them without credentials. Context reader access remains read-only; import requires ordinary cookbook permissions and explicit local catalogue mappings.
      properties:
        name: { type: string, const: shadowcook-recipe }
        version: { type: string, const: '1' }
        format: { type: string, const: shadowcook-recipe }
        formatVersion: { type: integer, const: 1 }
        skillUrl: { type: string, format: uri }
        schemaUrl: { type: string, format: uri }
        downloadUrl: { type: string, format: uri }
        examples:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: string, format: uri }
        instructions: { type: string }
    PortableRecipeDocument:
      $ref: ../apps/api/skills/v1/shadowcook-recipe/recipe.schema.json
    RecipeEditorCategory:
      type: object
      additionalProperties: false
      required: [public_id, parent_public_id, name, slug, sort_order]
      properties:
        public_id: { type: string, format: uuid }
        parent_public_id: { type: [string, 'null'], format: uuid }
        name: { type: string }
        slug: { type: string }
        sort_order: { type: integer, minimum: 0 }
    RecipeImportPreviewInput:
      type: object
      additionalProperties: false
      required:
        - json
      properties:
        json:
          type: string
          description: UTF-8 recipe JSON text, at most 1048576 bytes. Files and pasted
            input use the same field.
    RecipeImportIssue:
      type: object
      additionalProperties: false
      required:
        - path
        - code
      properties:
        path:
          type: string
        code:
          type: string
          enum:
            - JSON
            - SCHEMA
            - DUPLICATE
            - REFERENCE
            - VARIANT
            - DURATION
            - URL
            - LIMIT
    RecipeImportError:
      type: object
      additionalProperties: false
      required:
        - code
        - error
      properties:
        code:
          type: string
        error:
          type: string
        issues:
          type: array
          items:
            $ref: '#/components/schemas/RecipeImportIssue'
          maxItems: 40
    RecipeImportCandidate:
      type: object
      additionalProperties: false
      required:
        - publicId
        - name
        - symbol
        - conversion
        - match
      properties:
        publicId:
          type: string
          format: uuid
        name:
          type: string
        symbol:
          type:
            - string
            - 'null'
        conversion:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - dimension
                - baseFactor
                - baseOffset
              properties:
                dimension:
                  type: string
                  enum:
                    - MASS
                    - VOLUME
                    - COUNT
                    - TEMPERATURE
                baseFactor:
                  type: string
                baseOffset:
                  type: string
            - type: 'null'
        match:
          type: string
          enum:
            - EXACT
            - ALIAS
            - SIMILAR
            - DEFINITION
        translations:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required:
              - name
              - symbol
            properties:
              name:
                type: string
              symbol:
                type: string
    RecipeImportSuggestions:
      type: object
      additionalProperties: false
      required:
        - key
        - candidates
        - suggestedPublicId
      properties:
        key:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,79}$
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/RecipeImportCandidate'
          maxItems: 10
        suggestedPublicId:
          type:
            - string
            - 'null'
          format: uuid
    RecipeImportMapping:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - key
            - action
            - publicId
          properties:
            key:
              type: string
            action:
              type: string
              const: EXISTING
            publicId:
              type: string
              format: uuid
            addAsAlias:
              type: boolean
              default: false
              description:
                Ingredient mappings only. Explicitly adds the original ingredient name as an alias
                of the selected local ingredient in the import transaction. Requires ingredient:update. Existing
                equivalent aliases are reused.
        - type: object
          additionalProperties: false
          required:
            - key
            - action
            - name
          properties:
            key:
              type: string
            action:
              type: string
              const: CREATE
            name:
              type: string
              pattern: \S
              maxLength: 240
            symbol:
              type: string
              pattern: \S
              maxLength: 80
          description:
            Creating a unit additionally requires a non-blank symbol. The source conversion definition
            is retained.
    RecipeImportUnitMapping:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - key
            - action
            - publicId
          properties:
            key:
              type: string
            action:
              type: string
              const: EXISTING
            publicId:
              type: string
              format: uuid
        - type: object
          additionalProperties: false
          required:
            - key
            - action
            - name
          properties:
            key:
              type: string
            action:
              type: string
              const: CREATE
            name:
              type: string
              pattern: \S
              maxLength: 240
            symbol:
              type: string
              pattern: \S
              maxLength: 80
          description:
            Creating a unit additionally requires a non-blank symbol. The source conversion definition
            is retained.
    RecipeImportInput:
      type: object
      additionalProperties: false
      required:
        - json
        - slug
        - categoryPublicIds
        - ingredients
        - units
      properties:
        json:
          type: string
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 160
          not:
            enum:
              - admin
              - api
              - assets
              - auth
              - health
              - login
              - logout
              - recipes
              - settings
        categoryPublicIds:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
          maxItems: 200
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/RecipeImportMapping'
          maxItems: 500
        units:
          type: array
          items:
            $ref: '#/components/schemas/RecipeImportUnitMapping'
          maxItems: 200
      description:
        Supply exactly one mapping for every ingredient/unit used by any recipe step. Unused catalogue
        declarations are ignored. Source public IDs are not local mapping targets.
    RecipeImportPreview:
      type: object
      additionalProperties: false
      required:
        - document
        - categories
        - permissions
        - ingredients
        - units
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/RecipeEditorCategory'
        document:
          $ref: '#/components/schemas/PortableRecipeDocument'
        permissions:
          type: object
          additionalProperties: false
          required:
            - canCreateIngredients
            - canCreateUnits
            - canCreateVariants
            - canAddIngredientAliases
          properties:
            canCreateIngredients:
              type: boolean
            canCreateUnits:
              type: boolean
            canCreateVariants:
              type: boolean
            canAddIngredientAliases:
              type: boolean
              description: The current principal has ingredient:update in the receiving cookbook.
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/RecipeImportSuggestions'
        units:
          type: array
          items:
            $ref: '#/components/schemas/RecipeImportSuggestions'
    CookbookImportSources:
      type: object
      additionalProperties: false
      required:
        - recipes
        - ingredients
        - units
      properties:
        recipes:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - recipe_public_id
              - instance_url
              - tenant_public_id
              - remote_recipe_public_id
              - remote_revision_public_id
            properties:
              recipe_public_id:
                type: string
                format: uuid
              instance_url:
                type: string
                format: uri
              tenant_public_id:
                type: string
                format: uuid
              remote_recipe_public_id:
                type: string
                format: uuid
              remote_revision_public_id:
                type:
                  - string
                  - 'null'
                format: uuid
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/CookbookEntityImportSource'
        units:
          type: array
          items:
            $ref: '#/components/schemas/CookbookEntityImportSource'
      description: Unverified import provenance. These source claims are not active federation
        relationships or authorization grants.
    CookbookEntityImportSource:
      type: object
      additionalProperties: false
      required:
        - recipe_public_id
        - local_public_id
        - instance_url
        - remote_tenant_public_id
        - remote_entity_public_id
      properties:
        recipe_public_id:
          type: string
          format: uuid
        local_public_id:
          type: string
          format: uuid
        instance_url:
          type: string
          format: uri
        remote_tenant_public_id:
          type:
            - string
            - 'null'
          format: uuid
        remote_entity_public_id:
          type: string
          format: uuid
    AiContextManifest:
      type: object
      additionalProperties: false
      required:
        [
          version,
          baseUrl,
          accessToken,
          expiresAt,
          tenant,
          web,
          scope,
          endpoints,
          requestInstructions,
          recipeAuthoring,
          authentication,
          restrictions,
        ]
      properties:
        version: { type: string, const: '1' }
        baseUrl: { type: string, format: uri }
        accessToken: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        expiresAt: { type: string, format: date-time }
        tenant:
          type: object
          additionalProperties: false
          required: [publicId, slug, displayName]
          properties:
            publicId: { type: string, format: uuid }
            slug: { type: string }
            displayName: { type: string }
        web:
          type: object
          additionalProperties: false
          required: [baseUrl, routes, categorySlugPath, recipeLinkRule]
          properties:
            baseUrl: { type: string, format: uri }
            routes:
              type: object
              additionalProperties: false
              required: [cookbook, category, rootRecipe, categoryRecipe, variantSuffix]
              properties:
                cookbook: { type: string }
                category: { type: string }
                rootRecipe: { type: string }
                categoryRecipe: { type: string }
                variantSuffix: { type: string }
            categorySlugPath: { type: string }
            recipeLinkRule: { type: string }
        recipeAuthoring: { $ref: '#/components/schemas/RecipeAuthoringResources' }
        scope: { $ref: '#/components/schemas/AiContextScope' }
        endpoints:
          type: object
          additionalProperties: false
          required: [overview, recipe, revisions, revision, draft]
          properties:
            overview: { $ref: '#/components/schemas/AiContextEndpoint' }
            recipe: { $ref: '#/components/schemas/AiContextEndpoint' }
            revisions: { $ref: '#/components/schemas/AiContextEndpoint' }
            revision: { $ref: '#/components/schemas/AiContextEndpoint' }
            draft: { $ref: '#/components/schemas/AiContextEndpoint' }
        requestInstructions: { type: string }
        authentication:
          type: object
          additionalProperties: false
          required: [type, header, queryParameter, queryTemplate]
          properties:
            type: { type: string, const: bearer }
            header: { type: string, const: 'Authorization: Bearer {accessToken}' }
            queryParameter: { type: string, const: access_token }
            queryTemplate: { type: string, const: 'access_token={accessToken}' }
        restrictions:
          type: array
          items: { type: string, enum: [read-only, no administration, scope-limited] }
    AiContextOverview:
      type: object
      additionalProperties: false
      required: [tenant, scope, categories, recipes]
      properties:
        tenant:
          type: object
          additionalProperties: false
          required: [displayName, slug]
          properties:
            displayName: { type: string }
            slug: { type: string }
        scope:
          type: object
          additionalProperties: false
          properties:
            type: { type: string, enum: [TENANT, CATEGORY, RECIPE] }
            publicId: { type: string, format: uuid }
            name: { type: [string, 'null'] }
          required: [type, publicId, name]
        categories:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [public_id, parent_public_id, name, slug, sort_order]
            properties:
              public_id: { type: string, format: uuid }
              parent_public_id: { type: [string, 'null'], format: uuid }
              name: { type: string }
              slug: { type: string }
              sort_order: { type: integer }
        recipes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [public_id, slug, title, summary]
            properties:
              public_id: { type: string, format: uuid }
              slug: { type: string }
              title: { type: string }
              summary: { type: [string, 'null'] }
    AiContextVariant:
      type: object
      additionalProperties: false
      required: [metadata, diet, variant_key, name, slug, is_default, is_visible]
      properties:
        metadata: { $ref: '#/components/schemas/RecipeContentMetadata' }
        diet: { $ref: '#/components/schemas/RecipeDiet' }
        variant_key: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        is_default: { type: boolean }
        is_visible: { type: boolean }
    AiContextRecipe:
      description: Top-level metadata and diet project the selected variant, or the default variant when no selection exists. Legacy recipe writes of these fields update the default variant only.
      type: object
      additionalProperties: false
      required:
        [publicId, slug, title, summary, metadata, diet, createdAt, updatedAt, variants, steps]
      properties:
        metadata: { $ref: '#/components/schemas/RecipeContentMetadata' }
        diet: { $ref: '#/components/schemas/RecipeDiet' }
