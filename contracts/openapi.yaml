          }
        unit_public_id: { type: [string, 'null'], format: uuid }
        amount:
          {
            type: [string, 'null'],
            description: Exact decimal amount without conversion to floating point.,
          }
        is_optional: { type: boolean }
        note: { type: [string, 'null'] }
        sort_order: { type: integer, minimum: 0 }
    ReportSettings:
      type: object
      additionalProperties: false
      required: [recipientEmail]
      properties:
        recipientEmail: { type: [string, 'null'], format: email, maxLength: 254 }
    ReportUser:
      type: object
      additionalProperties: false
      required: [publicId, displayName]
      properties:
        publicId: { type: string, format: uuid }
        displayName: { type: string }
