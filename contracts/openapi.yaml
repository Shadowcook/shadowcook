          'security': [{ 'sessionCookie': [] }],
          'requestBody':
            {
              'required': true,
              'content':
                {
                  'application/json':
                    {
                      'schema':
                        {
                          'type': 'object',
                          'additionalProperties': false,
                          'properties':
                            {
                              'reason': { 'type': 'string', 'minLength': 1, 'maxLength': 2000 },
                              'confirmed': { 'type': 'boolean', 'const': true },
                              'auditEventPublicId': { 'type': 'string', 'format': 'uuid' },
                            },
                          'required': ['reason', 'confirmed', 'auditEventPublicId'],
                        },
                    },
                },
            },
          'responses':
            {
              '204': { 'description': 'Association committed and audited.' },
              '400':
                {
                  'description': 'INVALID_REPORT_HISTORY, INVALID_REPORT_NOTICE or INVALID_ADMINISTRATIVE_PURPOSE; unknown fields and missing purpose/confirmation are rejected.',
                  'content':
                    {
                      'application/json':
                        {
