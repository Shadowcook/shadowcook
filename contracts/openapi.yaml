  /auth/email-recovery/complete:
    post:
      operationId: confirmAdministrativeEmailRecovery
      description: Confirms possession of the administrator-selected new mailbox without any session. Single-use token expires in one hour. Disabled/deleted accounts, expired, replaced and consumed tokens are rejected. Atomically changes the unique email, revokes account access, consumes pending recovery and audits recipient confirmation attributed to the initiating administrator. Prior/new-address notifications follow commit; delivery failures are logged and never undo correction. Uses private/no-store. Does not change passwords, ownership, memberships or content.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{43}$'
      responses:
        '204':
          description: New address confirmed; no account details returned.
        '400':
          description: INVALID_RECOVERY_PROOF; malformed, expired, replaced, used or ineligible target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: EMAIL_UNAVAILABLE or LAST_USABLE_ADMINISTRATOR; transaction rolled back.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          $ref: '#/components/responses/UnexpectedError'
  /admin/users/{publicId}/email-recovery:
    {
      'post':
        {
          'operationId': 'requestAdminEmailRecovery',
          'description': 'Active human administrator browser session, reason and confirmation required; bearer headers denied. Sends a single-use confirmation link to the normalized available new address. One-hour expiry and one-minute resend cooldown. Replacement invalidates previous links. The address stays unchanged until recipient confirmation, which requires no administrator session or follow-up. Returns mail delivery outcomes without tokens or addresses. No automatic mail retry. Uses private/no-store; audit failure rolls back issuance.',
          'security': [{ 'sessionCookie': [] }],
          'requestBody':
            {
              'required': true,
              'content':
                {
                  'application/json':
                    {
                      'schema':
                        {
                          'type': 'object',
                          'additionalProperties': false,
                          'properties':
                            {
                              'reason': { 'type': 'string', 'minLength': 1, 'maxLength': 2000 },
                              'relatedReportPublicId':
                                { 'type': ['string', 'null'], 'format': 'uuid' },
                              'confirmed': { 'type': 'boolean', 'const': true },
                              'email': { 'type': 'string', 'format': 'email', 'maxLength': 254 },
                            },
                          'required': ['reason', 'confirmed', 'email'],
                        },
                    },
                },
            },
          'responses':
            {
              '200':
                {
                  'description': 'Per-recipient delivery outcome; no verification token or email address is returned.',
                  'content':
                    {
                      'application/json':
                        { 'schema': { '$ref': '#/components/schemas/RecoveryDeliveries' } },
                    },
                },
              '400':
                {
                  'description': 'INVALID_ACCOUNT_ACTION, INVALID_EMAIL, INVALID_ADMINISTRATIVE_PURPOSE.',
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'anyOf':
                                [
                                  { '$ref': '#/components/schemas/ApiError' },
                                  { '$ref': '#/components/schemas/UnhandledApiError' },
                                ],
                            },
