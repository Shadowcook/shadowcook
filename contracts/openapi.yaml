                  },
              },
          },
        'required':
          [
            'available',
            'cookbookPublicId',
            'recipePublicId',
            'inspectionPath',
            'accountPath',
            'cookbookDisabled',
            'identityResetRequired',
            'recipeBlocked',
            'trashed',
            'accountDisabled',
            'recipients',
          ],
      }
    AdministrativeEventState:
      {
        'type': ['object', 'null'],
        'additionalProperties': false,
        'properties':
          {
            'disabled': { 'type': 'boolean' },
            'nameResetRequired': { 'type': 'boolean' },
            'moderationBlocked': { 'type': 'boolean' },
            'membershipRetained': { 'type': 'boolean' },
            'preservationReviewed': { 'type': 'boolean' },
            'recipeCount': { 'type': 'integer', 'minimum': 0 },
            'revisionCount': { 'type': 'integer', 'minimum': 0 },
            'shareCount': { 'type': 'integer', 'minimum': 0 },
            'mediaCount': { 'type': 'integer', 'minimum': 0 },
            'memberCount': { 'type': 'integer', 'minimum': 0 },
            'ownerPrincipalId': { 'type': 'string', 'format': 'uuid' },
            'auditEventPublicId': { 'type': 'string', 'format': 'uuid' },
            'noticePublicId': { 'type': 'string', 'format': 'uuid' },
            'assigneePublicId': { 'type': ['string', 'null'], 'format': 'uuid' },
            'reportResult': { 'type': ['string', 'null'], 'pattern': '^[A-Z_]{1,64}$' },
            'status': { 'type': 'string', 'pattern': '^[A-Za-z0-9_:-]{1,64}$' },
            'confirmation': { 'type': 'string', 'enum': ['RECIPIENT_LINK'] },
            'roleCode': { 'type': 'string', 'pattern': '^[A-Za-z0-9_:-]{1,64}$' },
            'roleCodes':
              {
                'type': 'array',
                'maxItems': 32,
                'uniqueItems': true,
                'items': { 'type': 'string', 'pattern': '^[a-z][a-z0-9-]{0,63}$' },
              },
          },
      }
    ReportAdministrativeEvent:
      {
        'type': 'object',
        'additionalProperties': false,
        'properties':
          {
            'publicId': { 'type': 'string', 'format': 'uuid' },
            'createdAt': { 'type': 'string', 'format': 'date-time' },
            'actorPrincipalId': { 'type': 'string', 'format': 'uuid' },
            'action': { 'type': 'string', 'pattern': '^ADMIN_[A-Z0-9_]{1,100}$' },
            'targetType':
              { 'type': 'string', 'enum': ['COOKBOOK', 'RECIPE', 'USER', 'INSTANCE', 'REPORT'] },
            'targetPublicId': { 'type': 'string', 'format': 'uuid' },
            'cookbookPublicId': { 'type': ['string', 'null'], 'format': 'uuid' },
            'revisionPublicId': { 'type': ['string', 'null'], 'format': 'uuid' },
            'mediaPublicId': { 'type': ['string', 'null'], 'format': 'uuid' },
            'reason': { 'type': 'string', 'minLength': 1, 'maxLength': 2000 },
            'previousState': { '$ref': '#/components/schemas/AdministrativeEventState' },
            'newState': { '$ref': '#/components/schemas/AdministrativeEventState' },
            'requestId': { 'type': 'string', 'minLength': 1, 'maxLength': 200 },
            'outcome': { 'type': 'string', 'const': 'SUCCEEDED' },
            'recheckPath': { 'type': ['string', 'null'] },
          },
        'required':
          [
            'publicId',
            'createdAt',
            'actorPrincipalId',
            'action',
            'targetType',
            'targetPublicId',
            'cookbookPublicId',
            'revisionPublicId',
            'mediaPublicId',
            'reason',
            'previousState',
            'newState',
            'requestId',
            'outcome',
            'recheckPath',
          ],
      }
    ReportPublicNotice:
      {
        'type': 'object',
        'additionalProperties': false,
        'properties':
          {
            'publicId': { 'type': 'string', 'format': 'uuid' },
            'recipientPublicId': { 'type': 'string', 'format': 'uuid' },
            'recipientRole': { 'type': 'string', 'enum': ['REPORTER', 'TARGET'] },
            'message': { 'type': 'string', 'minLength': 1, 'maxLength': 5000 },
            'reviewInstructions': { 'type': 'string', 'minLength': 1, 'maxLength': 2000 },
            'deliveryStatus': { 'type': 'string', 'enum': ['PENDING', 'SENT', 'FAILED'] },
            'createdAt': { 'type': 'string', 'format': 'date-time' },
            'deliveredAt': { 'type': ['string', 'null'], 'format': 'date-time' },
          },
        'required':
          [
            'publicId',
            'recipientPublicId',
            'recipientRole',
            'message',
            'reviewInstructions',
            'deliveryStatus',
            'createdAt',
            'deliveredAt',
          ],
      }
    ReportAdministrativeHistory:
      {
        'type': 'object',
        'additionalProperties': false,
