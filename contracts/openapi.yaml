          {
            'reason': { 'type': 'string', 'minLength': 1, 'maxLength': 2000 },
            'confirmed': { 'type': 'boolean', 'const': true },
            'recipientRole': { 'type': 'string', 'enum': ['REPORTER', 'TARGET'] },
            'expectedRecipientPublicId': { 'type': 'string', 'format': 'uuid' },
            'message': { 'type': 'string', 'minLength': 1, 'maxLength': 5000 },
            'reviewInstructions': { 'type': 'string', 'minLength': 1, 'maxLength': 2000 },
          },
        'required':
          [
            'reason',
            'confirmed',
            'recipientRole',
            'expectedRecipientPublicId',
            'message',
            'reviewInstructions',
          ],
      }
    DeletionScope:
