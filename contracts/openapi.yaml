          items: { type: string, enum: [authorization_code, refresh_token] }
        token_endpoint_auth_methods_supported:
          type: array
          items: { type: string, const: none }
        code_challenge_methods_supported:
          type: array
          items: { type: string, const: S256 }
        scopes_supported:
          type: array
          items: { type: string, const: shadowcook:recipes }
