                                  { '$ref': '#/components/schemas/ApiError' },
                                  { '$ref': '#/components/schemas/UnhandledApiError' },
                                ],
                            },
                        },
                    },
                },
              '403':
                {
                  'description': 'ADMIN_SESSION_REQUIRED, INSTANCE_PERMISSION_REQUIRED, PASSWORD_CHANGE_REQUIRED or COOKBOOK_NAME_RESET_REQUIRED.',
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'anyOf':
                                [
                                  { '$ref': '#/components/schemas/ApiError' },
                                  { '$ref': '#/components/schemas/UnhandledApiError' },
                                ],
                            },
                        },
                    },
                },
              '404':
                {
                  'description': 'RESOURCE_NOT_FOUND',
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'anyOf':
                                [
                                  { '$ref': '#/components/schemas/ApiError' },
                                  { '$ref': '#/components/schemas/UnhandledApiError' },
                                ],
                            },
                        },
                    },
                },
              '409':
                {
                  'description': 'EMAIL_UNAVAILABLE, RECOVERY_ACCOUNT_DISABLED, LAST_USABLE_ADMINISTRATOR.',
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'anyOf':
                                [
                                  { '$ref': '#/components/schemas/ApiError' },
                                  { '$ref': '#/components/schemas/UnhandledApiError' },
                                ],
                            },
                        },
                    },
                },
              'default': { '$ref': '#/components/responses/UnexpectedError' },
            },
          'parameters':
            [
              {
                'name': 'publicId',
                'in': 'path',
                'required': true,
                'schema': { 'type': 'string', 'format': 'uuid' },
              },
            ],
        },
    }

  /admin/tenants/{publicId}/recipes/{recipeId}/deletion-preview:
    {
      'post':
        {
          'operationId': 'reviewRecipeDeletion',
          'description': 'Audited scope review including trashed/restricted content. memberCount reports cookbook members; recipe deletion preserves those memberships. Active human instance:administer browser session required; bearer headers denied. Requires reason, with optional existing-report correlation. Success uses private/no-store. Audit failures roll back mutations. Before deletion, capture the non-deleted canonical cookbook owner and target identity under locks. After commit, attempt one RECIPE_DELETED or COOKBOOK_DELETED email with optional userReason. Cookbook deletion sends one summary without per-recipe emails. No trash move occurs. Private reason is never supplied to the template. Email failure or missing recipient does not undo deletion; identifier-only delivery outcomes are logged. No automatic retry or durable queue; interruption after commit may prevent delivery. Preview, failed, rolled-back and repeated deletion requests send no email.',
          'security': [{ 'sessionCookie': [] }],
          'requestBody':
            {
              'required': true,
              'content':
                {
                  'application/json':
                    { 'schema': { '$ref': '#/components/schemas/InspectionPurpose' } },
                },
            },
          'responses':
