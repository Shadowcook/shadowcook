          { name: publicId, in: path, required: true, schema: { type: string, format: uuid } },
        ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UnitInput' } } }
      responses: { '204': { description: Unit updated. } }
    delete:
      operationId: deleteTenantUnit
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { name: publicId, in: path, required: true, schema: { type: string, format: uuid } },
        ]
      responses: { '204': { description: Unit deleted. }, '409': { description: Unit is in use. } }
  /cookbook/tenants/{tenantSlug}/recipes/{publicId}/share-links:
    get:
      operationId: listRecipeShareLinks
      summary: Lists active share links for a published recipe.
      security: [{ sessionCookie: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { $ref: '#/components/parameters/RecipePublicId' },
        ]
      responses:
        '200':
          description: Active share links.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [shareLinks]
                properties:
                  shareLinks:
                    { type: array, items: { $ref: '#/components/schemas/RecipeShareLinkListItem' } }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
    post:
      operationId: createRecipeShareLink
      summary: Creates a tokenized share link for the published recipe.
      security: [{ sessionCookie: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { $ref: '#/components/parameters/RecipePublicId' },
        ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: [string, 'null'], minLength: 1, maxLength: 160 }
                expiresAt: { type: [string, 'null'], format: date-time }
      responses:
        '201':
          {
            description: Share link created,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/RecipeShareLink' } } },
          }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
  /cookbook/tenants/{tenantSlug}/recipes/{publicId}/share-links/{shareLinkId}:
    delete:
      operationId: revokeRecipeShareLink
      summary: Revokes an active recipe share link.
      security: [{ sessionCookie: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { $ref: '#/components/parameters/RecipePublicId' },
          { name: shareLinkId, in: path, required: true, schema: { type: string, format: uuid } },
        ]
      responses:
        '204': { description: Share link revoked. }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '404': { description: Share link not found. }
  /cookbook/tenants/{tenantSlug}/service-accounts:
    get:
      operationId: listServiceAccounts
      summary: Lists tenant-scoped service accounts, roles, and token metadata.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantSlug' }]
      responses:
        '200':
          description: Service accounts and assignable tenant roles.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [serviceAccounts, roles]
                properties:
                  serviceAccounts:
                    type: array
                    items: { $ref: '#/components/schemas/ServiceAccount' }
                  roles:
                    type: array
                    items: { $ref: '#/components/schemas/TenantRole' }
    post:
      operationId: createServiceAccount
      summary: Creates a tenant-scoped service account with explicit tenant roles.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantSlug' }]
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/ServiceAccountInput' } } }
      responses:
        '201':
          description: Service account created.
          content:
            application/json:
              schema:
                type: object
                required: [publicId]
                properties: { publicId: { type: string, format: uuid } }
  /cookbook/tenants/{tenantSlug}/service-accounts/{publicId}:
    patch:
      operationId: updateServiceAccount
      summary: Updates a service account's name and tenant roles.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { $ref: '#/components/parameters/PublicId' },
        ]
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/ServiceAccountInput' } } }
      responses: { '204': { description: Service account updated. } }
    delete:
      operationId: disableServiceAccount
      summary: Disables a service account and revokes all of its API tokens.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { $ref: '#/components/parameters/PublicId' },
        ]
      responses: { '204': { description: Service account disabled. } }
  /cookbook/tenants/{tenantSlug}/service-accounts/{publicId}/tokens:
    post:
      operationId: createServiceAccountToken
      summary: Creates an opaque bearer token and returns its plaintext value once.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { $ref: '#/components/parameters/PublicId' },
        ]
      requestBody:
        required: true
        content:
          {
            application/json: { schema: { $ref: '#/components/schemas/ServiceAccountTokenInput' } },
          }
      responses:
        '201':
          description: Token created. Persist the token now; it cannot be retrieved again.
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/ServiceAccountTokenCreated' } },
            }
  /cookbook/tenants/{tenantSlug}/service-accounts/{publicId}/tokens/{tokenId}:
    delete:
      operationId: revokeServiceAccountToken
      summary: Revokes a service-account token.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { $ref: '#/components/parameters/PublicId' },
          { name: tokenId, in: path, required: true, schema: { type: string, format: uuid } },
        ]
      responses: { '204': { description: Token revoked. } }
  /cookbook/share-links/{token}:
    get:
      operationId: getSharedRecipe
      summary: Resolves an active share link to its published recipe.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          {
            description: Shared recipe,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/SharedRecipeDetail' } } },
          }
components:
  parameters:
    TenantSlug:
      name: tenantSlug
      in: path
      required: true
      schema: { type: string }
    PublicId:
      name: publicId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RecipePublicId:
      name: publicId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    AuthenticationRequired:
      description: Authentication is required.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    InstancePermissionRequired:
      description: The active user lacks the required instance permission.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    TenantPermissionRequired:
      description: The active user lacks the required tenant permission.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    TenantNotFound:
      description: The tenant does not exist or is disabled.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    CategoryNotFound:
      description: The category was not found.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    InvalidCategory:
      description: The category input or parent relation is invalid.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    CategoryConflict:
      description: A category with the supplied URL name already exists.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    CategoryInUse:
      description: The category or one of its descendants is used by a recipe revision.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  schemas:
    TenantListResponse:
      type: object
      additionalProperties: false
      required: [tenants, smtpConfigured]
      properties:
        tenants:
          type: array
          items: { $ref: '#/components/schemas/TenantSummary' }
        smtpConfigured:
          type: boolean
    TenantSummary:
      type: object
      additionalProperties: false
      required: [public_id, display_name, description, slug, disabled_at, recipe_count, owner_name]
      properties:
        public_id: { type: string, format: uuid }
        display_name: { type: string }
        description: { type: [string, 'null'] }
        slug: { type: string }
        disabled_at: { type: [string, 'null'], format: date-time }
        recipe_count: { type: integer, minimum: 0 }
        owner_name: { type: [string, 'null'] }
    TenantRecipePolicy:
      type: object
      additionalProperties: false
      required:
        [
          defaultVisibility,
          defaultDiscoverability,
          showOnStartPage,
          frontpageRecipeCount,
          frontpageHeading,
          description,
        ]
      properties:
        defaultVisibility: { type: string, enum: [PRIVATE, MEMBERS_ONLY, PUBLIC] }
        defaultDiscoverability: { type: string, enum: [DISCOVERABLE, UNLISTED] }
        showOnStartPage: { type: boolean }
        frontpageRecipeCount: { type: integer, minimum: 1, maximum: 100 }
        frontpageHeading: { type: [string, 'null'], minLength: 1, maxLength: 80 }
        description: { type: [string, 'null'], minLength: 1, maxLength: 280 }
    InstanceFrontpageSettings:
      type: object
      additionalProperties: false
      required: [siteName, slogan, cookbooksPerPage]
      properties:
        siteName: { type: string, minLength: 1, maxLength: 80 }
        slogan: { type: string, minLength: 1, maxLength: 80 }
        cookbooksPerPage: { type: integer, minimum: 1, maximum: 100 }
    InstanceLegalDocuments:
      type: object
      additionalProperties: false
      required: [privacyStatementMarkdown, imprintMarkdown]
      properties:
        privacyStatementMarkdown: { type: string, maxLength: 50000 }
        imprintMarkdown: { type: string, maxLength: 50000 }
    CookbookTenantSelection:
      type: object
      additionalProperties: false
      required:
        [
          siteName,
          slogan,
          cookbooksPerPage,
          tenants,
          myCookbooks,
          page,
          totalPages,
          totalTenants,
          shuffleSeed,
        ]
      properties:
        siteName: { type: string, minLength: 1, maxLength: 80 }
        slogan: { type: string, minLength: 1, maxLength: 80 }
        cookbooksPerPage: { type: integer, minimum: 1, maximum: 100 }
        tenants:
          type: array
          items: { $ref: '#/components/schemas/CookbookTenant' }
        myCookbooks:
          description: Enabled cookbooks where the authenticated principal has a tenant membership. This list does not apply root-page or recipe visibility filters.
          type: array
          items: { $ref: '#/components/schemas/CookbookTenant' }
        page: { type: integer, minimum: 1 }
        totalPages: { type: integer, minimum: 0 }
        totalTenants: { type: integer, minimum: 0 }
        shuffleSeed: { type: string, maxLength: 100 }
    CookbookTenant:
      type: object
      additionalProperties: false
      required: [public_id, display_name, description, slug, recipe_count]
      properties:
        public_id: { type: string, format: uuid }
        display_name: { type: string }
        description: { type: [string, 'null'] }
        slug: { type: string }
        recipe_count: { type: integer, minimum: 0 }
    RecipeDraftInput:
      type: object
      additionalProperties: false
      required: [title, summary, categoryPublicIds]
      properties:
        title: { type: string, minLength: 1, maxLength: 240 }
        summary: { type: string, maxLength: 2000 }
        categoryPublicIds:
          type: array
          items: { type: string, format: uuid }
    RecipeMetadataInput:
      type: object
      additionalProperties: false
      required: [slug, visibilityOverride, discoverabilityOverride, isFeatured]
      properties:
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        visibilityOverride: { type: [string, 'null'], enum: [PRIVATE, MEMBERS_ONLY, PUBLIC, null] }
        discoverabilityOverride: { type: [string, 'null'], enum: [DISCOVERABLE, UNLISTED, null] }
        isFeatured: { type: boolean }
    RecipeCreateInput:
      type: object
      additionalProperties: false
      required:
        [
          title,
          summary,
          categoryPublicIds,
          slug,
          visibilityOverride,
          discoverabilityOverride,
          isFeatured,
        ]
      properties:
        title: { type: string, minLength: 1, maxLength: 240 }
        summary: { type: string, maxLength: 2000 }
        categoryPublicIds:
          type: array
          items: { type: string, format: uuid }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        visibilityOverride: { type: [string, 'null'], enum: [PRIVATE, MEMBERS_ONLY, PUBLIC, null] }
        discoverabilityOverride: { type: [string, 'null'], enum: [DISCOVERABLE, UNLISTED, null] }
        isFeatured: { type: boolean }
    EditableRecipe:
      type: object
      additionalProperties: false
      required:
        [
          publicId,
          slug,
          title,
          summary,
          categoryPublicIds,
          visibilityOverride,
          discoverabilityOverride,
          isFeatured,
          effectiveVisibility,
          effectiveDiscoverability,
          canChangeVisibility,
          publishedVersion,
          hasPublishedRevision,
          isDraft,
        ]
      properties:
        publicId: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        summary: { type: [string, 'null'] }
        categoryPublicIds: { type: array, items: { type: string, format: uuid } }
        visibilityOverride: { type: [string, 'null'], enum: [PRIVATE, MEMBERS_ONLY, PUBLIC, null] }
        discoverabilityOverride: { type: [string, 'null'], enum: [DISCOVERABLE, UNLISTED, null] }
        isFeatured: { type: boolean }
        effectiveVisibility: { type: string, enum: [PRIVATE, MEMBERS_ONLY, PUBLIC] }
        effectiveDiscoverability: { type: string, enum: [DISCOVERABLE, UNLISTED] }
        canChangeVisibility: { type: boolean }
        publishedVersion: { type: [integer, 'null'], minimum: 1 }
        hasPublishedRevision: { type: boolean }
        isDraft: { type: boolean }
    RecipeRevision:
      type: object
      additionalProperties: false
      required: [publicId, version, status, publishedAt, title]
      properties:
        publicId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [PUBLISHED, ARCHIVED] }
        publishedAt: { type: string, format: date-time }
        title: { type: string }
    RecipeRevisionSnapshot:
      allOf:
        - $ref: '#/components/schemas/RecipeRevision'
        - type: object
          additionalProperties: false
          required: [summary, categories, steps, variants]
          properties:
            summary: { type: [string, 'null'] }
            categories:
              type: array
              items: { $ref: '#/components/schemas/RecipeRevisionCategory' }
            steps:
              type: array
              items: { $ref: '#/components/schemas/RecipeRevisionStep' }
            variants:
              type: array
              items: { $ref: '#/components/schemas/RecipeRevisionVariant' }
    RecipeRevisionCategory:
      type: object
      additionalProperties: false
      required: [publicId, name]
      properties:
        publicId: { type: string, format: uuid }
        name: { type: string }
    RecipeRevisionStep:
      type: object
      additionalProperties: false
      required: [stepKey, sortOrder, instruction, ingredients]
      properties:
        stepKey: { type: string, format: uuid }
        sortOrder: { type: integer, minimum: 0 }
        instruction: { type: string }
        ingredients:
          type: array
          items: { $ref: '#/components/schemas/RecipeRevisionUsage' }
    RecipeRevisionUsage:
      type: object
      additionalProperties: false
      required:
        [
          usageKey,
          ingredientName,
          textOverride,
          specialKind,
          amount,
          unitSymbol,
          note,
          isOptional,
          sortOrder,
        ]
      properties:
        usageKey: { type: string, format: uuid }
        ingredientName: { type: [string, 'null'] }
        textOverride: { type: [string, 'null'] }
        specialKind: { type: [string, 'null'] }
        amount: { type: [string, 'null'] }
        unitSymbol: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        isOptional: { type: boolean }
        sortOrder: { type: integer, minimum: 0 }
    RecipeRevisionVariant:
      type: object
      additionalProperties: false
      required: [variantKey, name, slug, isDefault, isVisible, includedStepKeys]
      properties:
        variantKey: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        isDefault: { type: boolean }
        isVisible: { type: boolean }
        includedStepKeys:
          type: array
          items: { type: string, format: uuid }
    RecipeShareLink:
      type: object
      additionalProperties: false
      required: [token, path]
      properties:
        token: { type: string }
        path: { type: string }
    RecipeShareLinkListItem:
      type: object
      additionalProperties: false
      required: [id, name, path, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, 'null'] }
        path: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
    SharedRecipeDetail:
      allOf:
        - $ref: '#/components/schemas/CookbookRecipeDetail'
        - type: object
          additionalProperties: false
          required: [tenant_slug]
          properties:
            tenant_slug: { type: string }
    CategoryInput:
      type: object
      additionalProperties: false
      required: [name, slug, parentPublicId]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        parentPublicId: { type: [string, 'null'], format: uuid }
    EditableCategory:
      type: object
      additionalProperties: false
      required: [publicId, parentPublicId, name, slug, sortOrder, canDelete]
      properties:
        publicId: { type: string, format: uuid }
        parentPublicId: { type: [string, 'null'], format: uuid }
        name: { type: string }
        slug: { type: string }
        sortOrder: { type: integer, minimum: 0 }
        canDelete: { type: boolean }
    CategoryMoveInput:
      type: object
      additionalProperties: false
      required: [direction]
      properties:
        direction: { type: string, enum: [UP, DOWN] }
    InstanceMailSettings:
      oneOf:
        - type: object
          additionalProperties: false
          required: [configured]
          properties: { configured: { const: false } }
        - type: object
          additionalProperties: false
          required:
            [configured, host, port, transportSecurity, username, hasPassword, fromEmail, fromName]
          properties:
            configured: { const: true }
            host: { type: string }
            port: { type: integer }
            transportSecurity: { type: string, enum: [STARTTLS, IMPLICIT_TLS] }
            username: { type: [string, 'null'] }
            hasPassword: { type: boolean }
            fromEmail: { type: string, format: email }
            fromName: { type: string }
    InstanceMailSettingsInput:
      type: object
      additionalProperties: false
      required: [host, port, transportSecurity, username, fromEmail, fromName]
      properties:
        host: { type: string, minLength: 1 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        transportSecurity: { type: string, enum: [STARTTLS, IMPLICIT_TLS] }
        username: { type: [string, 'null'] }
        password: { type: [string, 'null'], writeOnly: true }
        fromEmail: { type: string, format: email }
        fromName: { type: string, minLength: 1 }
    IngredientInput:
      type: object
      additionalProperties: false
      required: [canonicalName]
      properties: { canonicalName: { type: string, minLength: 1, maxLength: 160 } }
    TenantIngredientInput:
      type: object
      additionalProperties: false
      required: [canonicalName]
      properties:
        canonicalName: { type: string, minLength: 1, maxLength: 160 }
        aliases:
          type: array
          items: { type: string, minLength: 1, maxLength: 160 }
    IngredientAliasInput:
      type: object
      additionalProperties: false
      required: [alias]
      properties: { alias: { type: string, minLength: 1, maxLength: 160 } }
    IngredientConsolidationInput:
      type: object
      additionalProperties: false
      required: [targetPublicId]
      properties:
        targetPublicId: { type: string, format: uuid }
    TenantIngredientAlias:
      type: object
      additionalProperties: false
      required: [publicId, alias]
      properties:
        publicId: { type: string, format: uuid }
        alias: { type: string }
    TenantIngredient:
      type: object
      additionalProperties: false
      required: [publicId, canonicalName, usageCount, aliases]
      properties:
        publicId: { type: string, format: uuid }
        canonicalName: { type: string }
        usageCount: { type: integer, minimum: 0 }
        aliases: { type: array, items: { $ref: '#/components/schemas/TenantIngredientAlias' } }
    TenantUnit:
      type: object
      additionalProperties: false
      required: [publicId, name, symbol, dimension, baseFactor, baseOffset, usageCount]
      properties:
        publicId: { type: string, format: uuid }
        name: { type: string }
        symbol: { type: string }
        dimension: { type: string, enum: [MASS, VOLUME, COUNT, TEMPERATURE] }
        baseFactor: { type: string }
        baseOffset: { type: string }
        usageCount: { type: integer, minimum: 0 }
    UnitInput:
      type: object
      additionalProperties: false
      required: [name, symbol, dimension, baseFactor, baseOffset]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        symbol: { type: string, minLength: 1, maxLength: 100 }
        dimension: { type: string, enum: [MASS, VOLUME, COUNT, TEMPERATURE] }
        baseFactor: { type: string, pattern: '^(?:0|[1-9][0-9]*)(?:\\.[0-9]{1,12})?$' }
        baseOffset: { type: string, pattern: '^-?(?:0|[1-9][0-9]*)(?:\\.[0-9]{1,12})?$' }
    Unit:
      type: object
      additionalProperties: false
      required:
        [publicId, name, symbol, localizationKey, dimension, baseFactor, baseOffset, usageCount]
      properties:
        publicId: { type: string, format: uuid }
        name: { type: string }
        symbol: { type: string }
        localizationKey: { type: [string, 'null'] }
        dimension: { type: string, enum: [MASS, VOLUME, COUNT, TEMPERATURE] }
        baseFactor: { type: string }
        baseOffset: { type: string }
        usageCount: { type: integer, minimum: 0 }
    CookbookCategory:
      type: object
      additionalProperties: false
      required: [public_id, parent_public_id, name, slug, sort_order]
      properties:
        public_id:
          type: string
          format: uuid
        parent_public_id:
          type: [string, 'null']
          format: uuid
        name:
          type: string
        slug:
          type: string
        sort_order:
          type: integer
          minimum: 0
    CookbookRecipe:
      type: object
      additionalProperties: false
      required: [public_id, slug, title, summary, category_public_ids]
      properties:
        public_id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        summary:
          type: [string, 'null']
        category_public_ids:
          type: array
          items:
            type: string
            format: uuid
    CookbookFrontpage:
      type: object
      additionalProperties: false
      required: [recipes, page, pageSize, totalPages, totalRecipes]
      properties:
        recipes:
          type: array
          items: { $ref: '#/components/schemas/CookbookRecipe' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalPages: { type: integer, minimum: 0 }
        totalRecipes: { type: integer, minimum: 0 }
    RecipeManagementPage:
      type: object
      additionalProperties: false
      required: [recipes, page, pageSize, totalPages, totalRecipes]
      properties:
        recipes:
          type: array
          items: { $ref: '#/components/schemas/CookbookRecipe' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalPages: { type: integer, minimum: 0 }
        totalRecipes: { type: integer, minimum: 0 }
    CookbookRecipeDetail:
      type: object
      additionalProperties: false
      required:
        [
          public_id,
          slug,
          title,
          summary,
          can_edit,
          can_share,
          selectedVariant,
          variants,
          steps,
          recipe_links,
        ]
      properties:
        public_id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        summary:
          type: [string, 'null']
        can_edit:
          type: boolean
        can_share:
          type: boolean
        selectedVariant:
          type: string
        variants:
          type: array
          items: { $ref: '#/components/schemas/PublishedRecipeVariant' }
        steps:
          type: array
          items:
            $ref: '#/components/schemas/CookbookRecipeStep'
        recipe_links:
          type: array
          items: { $ref: '#/components/schemas/RecipeLink' }
    CookbookRecipeStep:
      type: object
      additionalProperties: false
      required: [public_id, sort_order, instruction, ingredients]
      properties:
        public_id:
          type: string
          format: uuid
        sort_order:
          type: integer
          minimum: 0
        instruction:
          type: string
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/CookbookIngredientUsage'
    CookbookIngredientUsage:
      type: object
      additionalProperties: false
      required:
        [
          sort_order,
          amount,
          unit_public_id,
          unit_symbol,
          unit_localization_key,
          ingredient_public_id,
          ingredient_name,
          is_catalog_ingredient,
          special_kind,
          note,
          is_optional,
        ]
      properties:
        sort_order:
          type: integer
          minimum: 0
        amount:
          type: [string, 'null']
        unit_public_id:
          type: [string, 'null']
          format: uuid
        unit_symbol:
          type: [string, 'null']
        unit_localization_key:
          type: [string, 'null']
        ingredient_public_id:
          type: [string, 'null']
          format: uuid
        ingredient_name:
          type: string
        is_catalog_ingredient:
          type: boolean
        special_kind:
          type: [string, 'null']
          enum: [NO_ICON, REMOVE, ADD, INFO, IMPORTANT, COOK, COOL, HEAT, WAIT, WORK_STEP, null]
        note:
          type: [string, 'null']
        is_optional:
          type: boolean
    RecipeDraftStep:
      type: object
      additionalProperties: false
      required: [id, instruction, sortOrder, ingredients]
      properties:
        id: { type: string, format: uuid }
        instruction: { type: string }
        sortOrder: { type: integer, minimum: 0 }
        ingredients:
          type: array
          items: { $ref: '#/components/schemas/RecipeDraftUsage' }
    RecipeDraftStepInput:
      type: object
      additionalProperties: false
      required: [instruction, ingredients]
      properties:
        instruction: { type: string, minLength: 1 }
        ingredients:
          type: array
          items: { $ref: '#/components/schemas/RecipeDraftUsageInput' }
    RecipeDraftUsage:
      type: object
      additionalProperties: false
      required:
        [
          id,
          ingredientPublicId,
          ingredientAliasPublicId,
          ingredientName,
          textOverride,
          specialKind,
          amount,
          unitPublicId,
          note,
          isOptional,
          sortOrder,
        ]
      properties:
        id: { type: string, format: uuid }
        ingredientPublicId: { type: [string, 'null'], format: uuid }
        ingredientAliasPublicId: { type: [string, 'null'], format: uuid }
        ingredientName: { type: [string, 'null'] }
        textOverride: { type: [string, 'null'] }
        specialKind:
          type: [string, 'null']
          enum: [NO_ICON, REMOVE, ADD, INFO, IMPORTANT, COOK, COOL, HEAT, WAIT, WORK_STEP, null]
        amount: { type: [string, 'null'] }
        unitPublicId: { type: [string, 'null'], format: uuid }
        note: { type: [string, 'null'] }
        isOptional: { type: boolean }
        sortOrder: { type: integer, minimum: 0 }
    RecipeDraftUsageInput:
      type: object
      additionalProperties: false
      properties:
        ingredientPublicId: { type: string, format: uuid }
        ingredientAliasPublicId: { type: string, format: uuid }
        textOverride: { type: string, minLength: 1 }
        specialKind:
          type: string
          enum: [NO_ICON, REMOVE, ADD, INFO, IMPORTANT, COOK, COOL, HEAT, WAIT, WORK_STEP]
          description: When supplied, textOverride, amount, unitPublicId, and isOptional are ignored.
        amount: { type: string, pattern: '^\\d+(?:\\.\\d+)?$' }
        unitPublicId: { type: string, format: uuid }
        note: { type: string }
        isOptional: { type: boolean }
    EditorUnit:
      type: object
      additionalProperties: false
      required: [publicId, symbol]
      properties:
        publicId: { type: string, format: uuid }
        symbol: { type: string }
    EditorIngredient:
      type: object
      additionalProperties: false
      required: [publicId, aliasPublicId, name, exactMatch]
      properties:
        publicId: { type: string, format: uuid }
        aliasPublicId: { type: [string, 'null'], format: uuid }
        name: { type: string }
        exactMatch: { type: boolean }
    EditorRecipe:
      type: object
      additionalProperties: false
      required: [publicId, title]
      properties:
        publicId: { type: string, format: uuid }
        title: { type: string }
    RecipeLink:
      type: object
      additionalProperties: false
      required: [public_id, slug, title]
      properties:
        public_id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
    PublishedRecipeVariant:
      type: object
      additionalProperties: false
      required: [variant_key, name, slug, is_default, is_visible]
      properties:
        variant_key: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        is_default: { type: boolean }
        is_visible: { type: boolean }
    RecipeVariant:
      type: object
      additionalProperties: false
      required: [variantKey, name, slug, isDefault, isVisible, overrides]
      properties:
        variantKey: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        isDefault: { type: boolean, description: Only a visible variant may be the default. }
        isVisible: { type: boolean }
        overrides:
          type: array
          items: { $ref: '#/components/schemas/RecipeVariantStepOverride' }
    RecipeVariantInput:
      type: object
      additionalProperties: false
      required: [name, slug, isDefault, isVisible]
      properties:
        name: { type: string, minLength: 1, maxLength: 240 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        isDefault: { type: boolean, description: Only a visible variant may be the default. }
        isVisible: { type: boolean }
    TenantRole:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    ServiceAccountInput:
      type: object
      additionalProperties: false
      required: [name, roleIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        roleIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
    ServiceAccountToken:
      type: object
      additionalProperties: false
      required: [id, name, tokenPrefix, expiresAt, lastUsedAt, revokedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        tokenPrefix: { type: string }
        expiresAt: { type: [string, 'null'], format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    ServiceAccount:
      type: object
      additionalProperties: false
      required: [public_id, name, disabled_at, roles, tokens]
      properties:
        public_id: { type: string, format: uuid }
        name: { type: string }
        disabled_at: { type: [string, 'null'], format: date-time }
        roles:
          type: array
          items: { $ref: '#/components/schemas/TenantRole' }
        tokens:
          type: array
          items: { $ref: '#/components/schemas/ServiceAccountToken' }
    ServiceAccountTokenInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        expiresAt: { type: [string, 'null'], format: date-time }
    ServiceAccountTokenCreated:
      type: object
      additionalProperties: false
      required: [id, token, tokenPrefix]
      properties:
        id: { type: string, format: uuid }
        token: { type: string, writeOnly: true }
        tokenPrefix: { type: string }
    RecipeVariantDeleteInput:
      type: object
      additionalProperties: false
      properties:
        replacementDefaultVariantKey: { type: string, format: uuid }
    RecipeVariantStepOverride:
      type: object
      additionalProperties: false
      required: [stepId, state]
      properties:
        stepId: { type: string, format: uuid }
        state: { type: string, enum: [INCLUDE] }
    ApiError:
      type: object
      additionalProperties: false
      required: [code, error]
      properties:
        code:
          type: string
          enum:
            - AUTHENTICATION_FAILED
            - AUTHENTICATION_REQUIRED
            - AI_CONTEXT_UNAVAILABLE
            - AI_CONTEXT_SCOPE_NOT_FOUND
            - INVALID_AI_CONTEXT
            - INVALID_CREDENTIALS
            - INVALID_LOGIN_BODY
            - SMTP_REQUIRED
            - MAIL_NOT_CONFIGURED
            - MAIL_DELIVERY_FAILED
            - INVALID_PASSWORD
            - PASSWORD_CHANGE_REQUIRED
            - RECIPE_NOT_FOUND
            - RECIPE_CONFLICT
            - INVALID_RECIPE
            - INVALID_RECIPE_CATEGORY
            - PUBLISH_CATEGORY_REQUIRED
            - RECIPE_NOT_PUBLISHED
            - INVALID_UNIT
            - UNIT_CONFLICT
            - UNIT_NOT_FOUND
            - UNIT_IN_USE
            - INVALID_CONVERSION
            - UNIT_DIMENSION_MISMATCH
            - INVALID_INGREDIENT
            - INGREDIENT_CONFLICT
            - INGREDIENT_NOT_FOUND
            - INGREDIENT_IN_USE
            - INVALID_INGREDIENT_CONSOLIDATION
            - TARGET_INGREDIENT_NOT_FOUND
            - INVALID_ALIAS
            - ALIAS_CONFLICT
            - ALIAS_NOT_FOUND
        error:
          type: string
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: shadowcook_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque API token
