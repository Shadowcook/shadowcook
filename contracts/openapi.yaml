          type: [string, 'null']
          description: Same-origin media URL; shared responses include the share token. Null when no cover image exists or its historical reference has expired under the configured image-retention policy.
        metadata: { $ref: '#/components/schemas/RecipeContentMetadata' }
        diet: { $ref: '#/components/schemas/RecipeDiet' }
        createdAt: { $ref: '#/components/schemas/RecipeCreatedAt' }
        updatedAt: { $ref: '#/components/schemas/RecipeUpdatedAt' }
        cookbook_name:
          type: string
          description: Current display name of the cookbook that owns this recipe.
        version:
          type: integer
          minimum: 1
          description: Version number of the published recipe revision returned in this response. An unpublished draft does not change this value.
        public_id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        summary:
          type: [string, 'null']
        creator_display_name:
          type: [string, 'null']
          description: Current display name of the principal that created the earliest recipe revision. Human creators use their account display name; service creators use their service-account name. No account identifiers or authentication data are exposed. Null when that revision has no creator.
        contributors:
          type: array
          description: Creators and recorded content editors of published and archived revisions, deduplicated by principal and ordered by first contributed revision and current display name. Draft-only contributions are excluded. Returns display names without account identifiers or authentication data.
          items: { $ref: '#/components/schemas/RecipeContributor' }
        can_edit:
          type: boolean
        can_share:
          type: boolean
        selectedVariant:
          type: string
        variants:
          type: array
          items: { $ref: '#/components/schemas/PublishedRecipeVariant' }
        steps:
          type: array
          items:
            $ref: '#/components/schemas/CookbookRecipeStep'
        recipe_links:
          type: array
          items: { $ref: '#/components/schemas/RecipeLink' }
    RecipeContributor:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name: { type: string }
    CookbookRecipeStep:
      type: object
      additionalProperties: false
      required: [public_id, sort_order, instruction, ingredients]
      properties:
        public_id:
          type: string
          format: uuid
        sort_order:
          type: integer
          minimum: 0
        instruction:
          type: string
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/CookbookIngredientUsage'
    CookbookIngredientUsage:
      type: object
      additionalProperties: false
      required:
        [
          sort_order,
          amount,
          unit_public_id,
          unit_symbol,
          unit_localization_key,
          unit_translations,
          ingredient_public_id,
          ingredient_name,
          is_catalog_ingredient,
          special_kind,
          note,
          is_optional,
        ]
      properties:
        sort_order:
          type: integer
          minimum: 0
        amount:
          type: [string, 'null']
        unit_public_id:
          type: [string, 'null']
          format: uuid
        unit_symbol:
          type: [string, 'null']
        unit_localization_key:
          type: [string, 'null']
        unit_translations:
          $ref: '#/components/schemas/UnitTranslations'
        ingredient_public_id:
          type: [string, 'null']
          format: uuid
        ingredient_name:
          type: string
        is_catalog_ingredient:
          type: boolean
        special_kind:
          type: [string, 'null']
          enum: [NO_ICON, REMOVE, ADD, INFO, IMPORTANT, COOK, COOL, HEAT, WAIT, WORK_STEP, null]
        note:
          type: [string, 'null']
        is_optional:
          type: boolean
    RecipeDraftStep:
      type: object
      additionalProperties: false
      required: [id, stepKey, instruction, sortOrder, ingredients]
      properties:
        id: { type: string, format: uuid }
        stepKey:
          { type: string, format: uuid, description: Stable step identity across recipe revisions. }
        instruction: { type: string }
        sortOrder: { type: integer, minimum: 0 }
        ingredients:
          type: array
          items: { $ref: '#/components/schemas/RecipeDraftUsage' }
    RecipeDraftStepInput:
      type: object
      additionalProperties: false
      required: [instruction, ingredients]
      properties:
        id:
          type: string
          format: uuid
          description: Existing step row ID or a client-generated identifier for a new step. Must be unique within the request.
        includedVariantKeys:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
          description: Complete direct membership for this step. Keys must belong to this draft. An empty array excludes the step from every variant.
        instruction:
          type: string
          minLength: 1
          description: Authored preparation text. Whitespace and line breaks are preserved verbatim.
        ingredients:
          type: array
          items: { $ref: '#/components/schemas/RecipeDraftUsageInput' }
    RecipeDraftUsage:
      type: object
      additionalProperties: false
      required:
        [
          id,
          ingredientPublicId,
          ingredientAliasPublicId,
          ingredientName,
          textOverride,
          specialKind,
          amount,
          unitPublicId,
          note,
          isOptional,
          sortOrder,
        ]
      properties:
        id: { type: string, format: uuid }
        ingredientPublicId: { type: [string, 'null'], format: uuid }
        ingredientAliasPublicId: { type: [string, 'null'], format: uuid }
        ingredientName: { type: [string, 'null'] }
        textOverride: { type: [string, 'null'] }
        specialKind:
          type: [string, 'null']
          enum: [NO_ICON, REMOVE, ADD, INFO, IMPORTANT, COOK, COOL, HEAT, WAIT, WORK_STEP, null]
        amount: { type: [string, 'null'] }
        unitPublicId: { type: [string, 'null'], format: uuid }
        note: { type: [string, 'null'] }
        isOptional: { type: boolean }
        sortOrder: { type: integer, minimum: 0 }
    RecipeDraftUsageInput:
      type: object
      additionalProperties: false
      properties:
        ingredientPublicId: { type: string, format: uuid }
        ingredientAliasPublicId: { type: string, format: uuid }
        textOverride: { type: string, minLength: 1 }
        specialKind:
          type: string
          enum: [NO_ICON, REMOVE, ADD, INFO, IMPORTANT, COOK, COOL, HEAT, WAIT, WORK_STEP]
          description: When supplied, textOverride, amount, unitPublicId, and isOptional are ignored.
        amount: { type: string, pattern: '^\\d+(?:\\.\\d+)?$' }
        unitPublicId: { type: string, format: uuid }
        note: { type: string }
        isOptional: { type: boolean }
    EditorUnit:
      type: object
      additionalProperties: false
      required: [publicId, symbol, translations]
      properties:
        publicId: { type: string, format: uuid }
        symbol: { type: string }
        translations: { $ref: '#/components/schemas/UnitTranslations' }
    EditorIngredient:
      type: object
      additionalProperties: false
      required: [publicId, aliasPublicId, name, exactMatch]
      properties:
        publicId: { type: string, format: uuid }
        aliasPublicId: { type: [string, 'null'], format: uuid }
        name: { type: string }
        exactMatch: { type: boolean }
    EditorRecipe:
      type: object
      additionalProperties: false
      required: [publicId, title]
      properties:
        publicId: { type: string, format: uuid }
        title: { type: string }
    RecipeLink:
      type: object
      additionalProperties: false
      required: [public_id, slug, title]
      properties:
        public_id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
    PublishedRecipeVariant:
      type: object
      additionalProperties: false
      required: [metadata, diet, variant_key, name, slug, is_default, is_visible]
      properties:
        metadata: { $ref: '#/components/schemas/RecipeContentMetadata' }
        diet: { $ref: '#/components/schemas/RecipeDiet' }
        variant_key: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        is_default: { type: boolean }
        is_visible: { type: boolean }
    RecipeVariant:
      type: object
      additionalProperties: false
      required: [metadata, diet, variantKey, name, slug, isDefault, isVisible, overrides]
      properties:
        metadata: { $ref: '#/components/schemas/RecipeContentMetadata' }
        diet: { $ref: '#/components/schemas/RecipeDiet' }
        variantKey: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        isDefault: { type: boolean, description: Only a visible variant may be the default. }
        isVisible: { type: boolean }
        overrides:
          type: array
          items: { $ref: '#/components/schemas/RecipeVariantStepOverride' }
    RecipeVariantInput:
      description: Variant preparation data. New variants copy metadata and diet from the current default variant before applying explicitly supplied fields. Explicit null diet clears the inherited classification; a supplied metadata object replaces all inherited metadata. Omitted metadata or diet preserves existing values on update.
      type: object
      additionalProperties: false
      required: [name, slug, isDefault, isVisible]
      properties:
        metadata: { $ref: '#/components/schemas/RecipeContentMetadata' }
        diet: { $ref: '#/components/schemas/RecipeDiet' }
        name: { type: string, minLength: 1, maxLength: 240 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        isDefault: { type: boolean, description: Only a visible variant may be the default. }
        isVisible: { type: boolean }
    TenantRole:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    ServiceAccountInput:
      type: object
      additionalProperties: false
      required: [name, roleIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        roleIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
    ServiceAccountToken:
      type: object
      additionalProperties: false
      required: [id, name, tokenPrefix, expiresAt, lastUsedAt, revokedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        tokenPrefix: { type: string }
        expiresAt: { type: [string, 'null'], format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    ServiceAccount:
      type: object
      additionalProperties: false
      required: [public_id, name, disabled_at, roles, tokens]
      properties:
        public_id: { type: string, format: uuid }
        name: { type: string }
        disabled_at: { type: [string, 'null'], format: date-time }
        roles:
          type: array
          items: { $ref: '#/components/schemas/TenantRole' }
        tokens:
          type: array
          items: { $ref: '#/components/schemas/ServiceAccountToken' }
    ServiceAccountTokenInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        expiresAt: { type: [string, 'null'], format: date-time }
    ServiceAccountTokenCreated:
      type: object
      additionalProperties: false
      required: [id, token, tokenPrefix]
      properties:
        id: { type: string, format: uuid }
        token: { type: string, writeOnly: true }
        tokenPrefix: { type: string }
    RecipeVariantDeleteInput:
      type: object
      additionalProperties: false
      properties:
        replacementDefaultVariantKey: { type: string, format: uuid }
    RecipeVariantStepOverride:
      type: object
      additionalProperties: false
      required: [stepId, state]
      properties:
        stepId: { type: string, format: uuid }
        state: { type: string, enum: [INCLUDE] }
    RecipeImageRequestError:
      type: object
      required: [statusCode, code, error, message]
      properties:
        statusCode: { type: integer, enum: [400, 413, 415] }
        code: { type: string }
        error: { type: string }
        message: { type: string }
    ApiError:
      type: object
      additionalProperties: false
      required: [code, error]
      properties:
        code:
          type: string
          enum:
            - AUTHENTICATION_FAILED
            - AUTHENTICATION_REQUIRED
            - INSTANCE_PERMISSION_REQUIRED
            - TENANT_PERMISSION_REQUIRED
            - TENANT_NOT_FOUND
            - INVALID_TENANT_USER
            - TENANT_USER_NOT_FOUND
            - OWNER_MEMBERSHIP_PROTECTED
            - INVALID_MEDIA_SETTINGS
            - INVALID_RECIPE_IMAGE
            - IMAGE_NOT_FOUND
            - FST_ERR_CTP_BODY_TOO_LARGE
            - INVALID_REPORT
            - INVALID_REPORT_SETTINGS
            - INVALID_REPORT_FILTER
            - INVALID_REPORT_UPDATE
            - INVALID_REPORT_ASSIGNEE
            - REPORT_NOT_FOUND
            - REPORT_TARGET_NOT_FOUND
            - REPORT_RATE_LIMITED
            - AI_CONTEXT_UNAVAILABLE
            - AI_CONTEXT_SCOPE_NOT_FOUND
            - INVALID_AI_CONTEXT
            - INVALID_CREDENTIALS
            - INVALID_LOGIN_BODY
            - INVALID_ACCOUNT_PROFILE
            - SMTP_REQUIRED
            - MAIL_NOT_CONFIGURED
            - MAIL_DELIVERY_FAILED
            - INVALID_PASSWORD
            - PASSWORD_CHANGE_REQUIRED
            - RECIPE_NOT_FOUND
            - RECIPE_DRAFT_NOT_FOUND
            - RECIPE_CONFLICT
            - INVALID_RECIPE
            - INVALID_RECIPE_CATEGORY
            - INVALID_RECIPE_SLUG_QUERY
            - INVALID_RECIPE_STEPS
            - INVALID_RECIPE_VARIANT
            - RECIPE_VARIANT_CONFLICT
            - RECIPE_VARIANT_HAS_STEPS
            - PUBLISH_CATEGORY_REQUIRED
            - RECIPE_NOT_PUBLISHED
            - INVALID_UNIT
            - UNIT_CONFLICT
            - UNIT_NOT_FOUND
            - UNIT_IN_USE
            - INVALID_CONVERSION
            - UNIT_DIMENSION_MISMATCH
            - INVALID_INGREDIENT
            - INGREDIENT_CONFLICT
            - INGREDIENT_NOT_FOUND
            - INGREDIENT_IN_USE
            - INVALID_INGREDIENT_CONSOLIDATION
            - TARGET_INGREDIENT_NOT_FOUND
            - INVALID_ALIAS
            - ALIAS_CONFLICT
            - ALIAS_NOT_FOUND
        error:
          type: string
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: shadowcook_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque service-account or OAuth access token
    aiContextBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque AI context reader access token
      description: Issued by the single-use AI context bootstrap endpoint. Accepted only on AI context reader routes while the grant is active.
    aiContextQueryAuth:
      type: apiKey
      in: query
      name: access_token
      description: Fallback for clients that cannot set Authorization headers. Uses the same AI context reader accessToken, lifetime, and scope as aiContextBearerAuth. Accepted only on AI context reader routes. Send exactly one access_token parameter and no Authorization header. URLs contain credentials and must be excluded or redacted in external proxy and access logs.
