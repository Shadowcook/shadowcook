      'delete':
        {
          'operationId': 'permanentlyDeleteRecipe',
          'description': 'Permanent live deletion. Exact target UUID and affirmative preservation review required. expectedScope must match fresh locked counts or the request is rejected. Recipe deletion preserves media shared with other recipes; cookbook deletion queues its media, refuses cross-cookbook media references and removes inbound grants. Audit is inserted before deletion in the same transaction. Files are removed by durable asynchronous cleanup. Backups and existing downloads are unaffected. Cookbook preview/deletion remains available during owned-cookbook identity repair; password change is still required. Active human instance:administer browser session required; bearer headers denied. Requires reason, with optional existing-report correlation. Success uses private/no-store. Audit failures roll back mutations. Before deletion, capture the non-deleted canonical cookbook owner and target identity under locks. After commit, attempt one RECIPE_DELETED or COOKBOOK_DELETED email with optional userReason. Cookbook deletion sends one summary without per-recipe emails. No trash move occurs. Private reason is never supplied to the template. Email failure or missing recipient does not undo deletion; identifier-only delivery outcomes are logged. No automatic retry or durable queue; interruption after commit may prevent delivery. Preview, failed, rolled-back and repeated deletion requests send no email.',
          'security': [{ 'sessionCookie': [] }],
          'requestBody':
            {
              'required': true,
              'content':
                {
                  'application/json':
                    { 'schema': { '$ref': '#/components/schemas/AdministrativeDeletion' } },
                },
            },
          'responses':
