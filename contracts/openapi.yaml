        '400':
          description: Invalid legal documents.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/InstancePermissionRequired' }
  /cookbook/tenants/{tenantSlug}/export:
    get:
      operationId: downloadCookbook
      summary: Downloads a portable cookbook content export as zipped JSON.
      description: >-
        Requires tenant:manage in the selected enabled cookbook and a completed sign-in.
        Reads one consistent database snapshot without pagination or visibility filtering.
        The ZIP contains one UTF-8 cookbook.json file conforming to CookbookExport.
        References use public IDs and revision-scoped step, variant, and usage keys;
        numeric quantities and conversion factors are decimal strings without precision loss.
        Operational credentials, accounts, memberships, live sharing grants, and cryptographic
        identity keys are excluded. This content format supports a future import into a new
        cookbook; an import endpoint is not currently implemented.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantSlug' }]
      responses:
        '200':
          description: ZIP archive containing cookbook.json, including all drafts and revision history.
          headers:
            Content-Disposition:
              description: Attachment filename containing the cookbook slug and UTC export timestamp.
              schema:
                {
                  type: string,
                  example: 'attachment; filename="my-cookbook-20261013T190000Z.shadowcook.zip"',
                }
            Cache-Control:
              schema: { type: string, const: no-store }
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
          content:
            application/zip:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403':
          description: TENANT_PERMISSION_REQUIRED or PASSWORD_CHANGE_REQUIRED.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '404': { $ref: '#/components/responses/TenantNotFound' }
  /cookbook/tenants/{tenantSlug}/recipe-policy:
    get:
      operationId: getTenantRecipePolicy
      summary: Returns the tenant's general cookbook settings.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantSlug' }]
      responses:
        '200':
          description: Tenant recipe policy.
          content:
            { application/json: { schema: { $ref: '#/components/schemas/TenantRecipePolicy' } } }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
    patch:
      operationId: updateTenantRecipePolicy
      summary: Updates the tenant's general cookbook settings.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantSlug' }]
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/TenantRecipePolicy' } } }
      responses:
        '204': { description: Tenant recipe policy updated. }
        '400': { description: Invalid recipe policy. }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
  /cookbook/tenants/{tenantSlug}/categories:
    get:
      operationId: listEditableCategories
      summary: Returns all categories in a tenant for category editors.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      responses:
        '200':
          description: Tenant categories.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [categories]
                properties:
                  categories:
                    { type: array, items: { $ref: '#/components/schemas/EditableCategory' } }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
    post:
      operationId: createCategory
      summary: Creates a category in a tenant.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CategoryInput' } } }
      responses:
        '201':
          description: Category created.
          content:
            { application/json: { schema: { $ref: '#/components/schemas/EditableCategory' } } }
        '400': { $ref: '#/components/responses/InvalidCategory' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '409': { $ref: '#/components/responses/CategoryConflict' }
  /cookbook/tenants/{tenantSlug}/categories/{publicId}:
    patch:
      operationId: updateCategory
      summary: Updates a category's name, URL name, or parent category.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/PublicId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CategoryInput' } } }
      responses:
        '200':
          description: Category updated.
          content:
            { application/json: { schema: { $ref: '#/components/schemas/EditableCategory' } } }
        '400': { $ref: '#/components/responses/InvalidCategory' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '404': { $ref: '#/components/responses/CategoryNotFound' }
        '409': { $ref: '#/components/responses/CategoryConflict' }
    delete:
      operationId: deleteCategory
      summary: Deletes an unused category and its unused descendants.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/PublicId'
      responses:
        '204': { description: Category deleted. }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '404': { $ref: '#/components/responses/CategoryNotFound' }
        '409': { $ref: '#/components/responses/CategoryInUse' }
  /cookbook/tenants/{tenantSlug}/categories/{publicId}/move:
    post:
      operationId: moveCategory
      summary: Moves a category before or after its adjacent sibling.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/PublicId'
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/CategoryMoveInput' } } }
      responses:
        '204': { description: Category order updated or already at the requested boundary. }
        '400': { $ref: '#/components/responses/InvalidCategory' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '404': { $ref: '#/components/responses/CategoryNotFound' }
  /cookbook/recipes/{publicId}:
    get:
      operationId: getCookbookRecipe
      summary: Returns one accessible published recipe with its step-specific ingredient usages.
      parameters:
        - name: publicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: variant
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: The accessible published recipe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookbookRecipeDetail'
        '403':
          description: A password change is required before accessing the recipe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The recipe is not accessible or does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /cookbook/tenants/{tenantSlug}/drafts:
    get:
      operationId: listRecipeDrafts
      summary: Lists editable recipe drafts for a tenant.
      description: Requires recipe:create or recipe:update in the requested cookbook. recipe:read alone does not grant access to drafts.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      responses:
        '200':
          description: Recipe drafts.
          content:
            application/json:
              schema:
                type: object
                required: [recipes]
                properties:
                  recipes:
                    type: array
                    items: { $ref: '#/components/schemas/EditableRecipe' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '404':
          description: The requested cookbook is disabled or does not exist.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /cookbook/tenants/{tenantSlug}/recipes:
    get:
      operationId: listManagedRecipes
      summary: Lists published tenant recipes for management in alphabetical pages.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: filter
          in: query
          required: false
          description: Accent-insensitive recipe filter for titles and summaries. Non-alphanumeric ASCII characters are word separators. Exact title, title phrase, title token, summary phrase, and summary token matches are returned in that order.
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Published recipes for management, ordered by normalized recipe match rank and then alphabetically by title.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeManagementPage'
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
    post:
      operationId: createRecipeDraft
      summary: Creates a recipe with its first draft revision.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecipeCreateInput' }
      responses:
        '201':
          description: Draft created.
          content: { application/json: { schema: { $ref: '#/components/schemas/EditableRecipe' } } }
        '400':
          description: INVALID_RECIPE or INVALID_RECIPE_CATEGORY. The recipe data or selected categories are invalid.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
        '409': { $ref: '#/components/responses/RecipeSlugConflict' }
  /cookbook/tenants/{tenantSlug}/recipes/slug-availability:
    get:
      operationId: checkRecipeSlugAvailability
      summary: Checks whether a recipe URL name is available in a cookbook.
      description: Requires recipe:create or recipe:update. Includes published and draft-only recipes. The optional excluded recipe public ID permits keeping an existing recipe's own slug. Returns no matching recipe identifiers or content. Availability is advisory; writes enforce uniqueness transactionally.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - name: slug
          in: query
          required: true
          schema: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        - name: excludePublicId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Whether the supplied URL name is available in this cookbook.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [available]
                properties:
                  available: { type: boolean }
        '400':
          description: INVALID_RECIPE_SLUG_QUERY. The slug or excluded recipe identifier is invalid.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '404': { $ref: '#/components/responses/TenantNotFound' }
  /cookbook/tenants/{tenantSlug}/recipes/{publicId}:
    patch:
      operationId: updateRecipeMetadata
      summary: Updates immediate recipe metadata without creating a recipe draft or revision.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { $ref: '#/components/parameters/RecipePublicId' },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecipeMetadataInput' }
      responses:
        '200':
          description: Recipe metadata saved.
          content: { application/json: { schema: { $ref: '#/components/schemas/EditableRecipe' } } }
        '400':
          description: INVALID_RECIPE. The recipe metadata is invalid.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '404':
          description: RECIPE_NOT_FOUND or TENANT_NOT_FOUND. The recipe or cookbook is unavailable.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '409': { $ref: '#/components/responses/RecipeSlugConflict' }
  /cookbook/tenants/{tenantSlug}/recipes/{publicId}/draft:
    delete:
      operationId: discardRecipeDraft
      summary: Discards the active recipe draft.
      description: Requires recipe:update in the selected tenant. Deletes the draft and dependent content in one transaction. Published and archived revisions and immediate recipe metadata are retained. A recipe that has never been published is deleted completely. A recipe without an active draft is not modified.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/TenantSlug' }
        - { $ref: '#/components/parameters/RecipePublicId' }
      responses:
        '204': { description: Draft discarded. No response body. }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '404':
          description: The tenant is unavailable, or the recipe or active draft was not found. Error code is TENANT_NOT_FOUND or RECIPE_DRAFT_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    get:
      operationId: getRecipeDraft
      summary: Returns the current editable revision or published revision.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { $ref: '#/components/parameters/RecipePublicId' },
        ]
      responses:
        '200':
          {
            description: Recipe editor state,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/EditableRecipe' } } },
          }
    patch:
      operationId: updateRecipeDraft
      summary: Saves a recipe draft, creating one from the published revision when needed.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { $ref: '#/components/parameters/RecipePublicId' },
        ]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/RecipeDraftInput' } } },
        }
      responses:
        '200':
          {
            description: Draft saved,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/EditableRecipe' } } },
          }
        '400':
          description: INVALID_RECIPE or INVALID_RECIPE_CATEGORY. The draft data or selected categories are invalid.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '404':
          description: RECIPE_NOT_FOUND or TENANT_NOT_FOUND. The recipe or cookbook is unavailable.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '409': { $ref: '#/components/responses/RecipeSlugConflict' }
  /cookbook/tenants/{tenantSlug}/recipes/{publicId}/publish:
    post:
      operationId: publishRecipeDraft
      summary: Publishes the current draft when it has at least one category.
      security: [{ sessionCookie: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { $ref: '#/components/parameters/RecipePublicId' },
        ]
      responses:
        '200':
          {
            description: Recipe published,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/EditableRecipe' } } },
          }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '404': { $ref: '#/components/responses/RecipeUnavailable' }
        '409':
          description: PUBLISH_CATEGORY_REQUIRED. Assign at least one category before publishing.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  /cookbook/tenants/{tenantSlug}/recipes/{publicId}/revisions:
    get:
      operationId: listRecipeRevisions
      summary: Lists immutable published and archived recipe revisions.
      security: [{ sessionCookie: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { $ref: '#/components/parameters/RecipePublicId' },
        ]
      responses:
        '200':
          description: Recipe revision history.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [revisions]
                properties:
                  revisions:
                    type: array
                    items: { $ref: '#/components/schemas/RecipeRevision' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '404': { description: The recipe does not exist. }
  /cookbook/tenants/{tenantSlug}/recipes/{publicId}/revisions/{revisionPublicId}:
    get:
      operationId: getRecipeRevisionSnapshot
      summary: Returns a read-only immutable recipe revision snapshot.
      security: [{ sessionCookie: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { $ref: '#/components/parameters/RecipePublicId' },
          {
            name: revisionPublicId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      responses:
        '200':
          description: Immutable recipe revision snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipeRevisionSnapshot' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '404': { description: The recipe revision does not exist. }
  /cookbook/tenants/{tenantSlug}/recipes/{publicId}/draft/steps:
    get:
      operationId: getRecipeDraftSteps
      summary: Returns the editable preparation steps for a recipe revision.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { $ref: '#/components/parameters/RecipePublicId' },
        ]
      responses:
        '200':
          description: Editable preparation steps.
          content:
            application/json:
              schema:
                type: object
                required: [steps]
                properties:
                  steps:
                    type: array
                    items: { $ref: '#/components/schemas/RecipeDraftStep' }
    put:
      operationId: replaceRecipeDraftSteps
      summary: Replaces the editable preparation steps and memberships atomically, creating a draft when needed.
      description: Requires recipe:update. Explicit includedVariantKeys additionally requires variant:update. Existing step keys and memberships are retained when id identifies a step in this recipe and includedVariantKeys is omitted. New steps without explicit membership join the default variant. Response step row IDs must be reloaded after saving.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { $ref: '#/components/parameters/RecipePublicId' },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [steps]
              properties:
                steps:
                  type: array
                  items: { $ref: '#/components/schemas/RecipeDraftStepInput' }
      responses:
        '204': { description: Preparation steps saved. }
        '400':
          description: INVALID_RECIPE_STEPS. The recipe steps, variant keys, ingredient references, units, or amounts are invalid.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '404': { $ref: '#/components/responses/RecipeUnavailable' }
  /cookbook/tenants/{tenantSlug}/recipes/{publicId}/draft/variants:
    get:
      operationId: listRecipeDraftVariants
      summary: Lists the variants and direct step memberships of an editable recipe revision.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { $ref: '#/components/parameters/RecipePublicId' },
        ]
      responses:
        '200':
          description: Recipe variants.
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      additionalProperties: false,
                      required: [variants],
                      properties:
                        {
                          variants:
                            { type: array, items: { $ref: '#/components/schemas/RecipeVariant' } },
                        },
                    },
                },
            }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '404': { description: The recipe does not exist. }
    post:
      operationId: createRecipeDraftVariant
      summary: Creates a variant in the editable revision.
      description: Copies the current default variant's persisted step memberships in the same transaction. If isDefault is true, membership is copied from the previous default. Creates a draft from the published revision when needed. Subsequent membership edits are independent.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { $ref: '#/components/parameters/RecipePublicId' },
        ]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/RecipeVariantInput' } } },
        }
      responses:
        '201':
          description: Variant created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [variantKey]
                properties:
                  variantKey: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/RecipeVariantInvalid' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '404': { $ref: '#/components/responses/RecipeUnavailable' }
        '409': { $ref: '#/components/responses/RecipeVariantConflict' }
  /cookbook/tenants/{tenantSlug}/recipes/{publicId}/draft/variants/{variantKey}:
    put:
      operationId: updateRecipeDraftVariant
      summary: Updates a variant in the editable revision.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { $ref: '#/components/parameters/RecipePublicId' },
          { name: variantKey, in: path, required: true, schema: { type: string, format: uuid } },
        ]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/RecipeVariantInput' } } },
        }
      responses:
        '204': { description: Variant updated. }
        '400': { $ref: '#/components/responses/RecipeVariantInvalid' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '404': { $ref: '#/components/responses/RecipeUnavailable' }
        '409': { $ref: '#/components/responses/RecipeVariantConflict' }
    delete:
      operationId: deleteRecipeDraftVariant
      summary: Deletes a variant when no recipe steps are assigned to it.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { $ref: '#/components/parameters/RecipePublicId' },
          { name: variantKey, in: path, required: true, schema: { type: string, format: uuid } },
        ]
      requestBody:
        {
          required: false,
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/RecipeVariantDeleteInput' } },
            },
        }
      responses:
        '204': { description: Variant deleted. }
        '400': { description: The variant or replacement default is invalid. }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '404': { description: The recipe does not exist. }
  /cookbook/tenants/{tenantSlug}/recipes/{publicId}/draft/variants/{variantKey}/step-overrides:
    put:
      operationId: replaceRecipeDraftVariantStepOverrides
      summary: Replaces one variant's direct recipe-step memberships.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { $ref: '#/components/parameters/RecipePublicId' },
          { name: variantKey, in: path, required: true, schema: { type: string, format: uuid } },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      additionalProperties: false,
                      required: [overrides],
                      properties:
                        {
                          overrides:
                            {
                              type: array,
                              items: { $ref: '#/components/schemas/RecipeVariantStepOverride' },
                            },
                        },
                    },
                },
            },
        }
      responses:
        '204': { description: Step memberships replaced. }
        '400': { description: The variant step-membership input is invalid. }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '404': { description: The recipe does not exist. }
  /cookbook/tenants/{tenantSlug}/editor-catalogue:
    get:
      operationId: getRecipeEditorCatalogue
      summary: Returns visible units and the complete category tree of the receiving cookbook for recipe creation, editing and import.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      responses:
        '200':
          description: Recipe editor units and categories; requires recipe:create or recipe:update.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [units, categories]
                properties:
                  categories:
                    type: array
                    items: { $ref: '#/components/schemas/RecipeEditorCategory' }
                  units:
                    type: array
                    items: { $ref: '#/components/schemas/EditorUnit' }
  /cookbook/tenants/{tenantSlug}/editor-catalogue/ingredients:
    get:
      operationId: searchRecipeEditorIngredients
      summary: Searches up to twenty accessible ingredients for the recipe editor.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - name: search
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Matching ingredients, with exact matches first and names sorted case-insensitively within each match group. Public IDs break ties.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ingredients]
                properties:
                  ingredients:
                    type: array
                    maxItems: 20
                    items: { $ref: '#/components/schemas/EditorIngredient' }
  /cookbook/tenants/{tenantSlug}/editor-catalogue/recipes:
    get:
      operationId: searchRecipeEditorRecipes
      summary: Searches up to one hundred recipes for recipe links in the recipe editor.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - name: search
          in: query
          required: false
          description: Accent-insensitive title search. Non-alphanumeric ASCII characters are word separators.
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Matching recipes.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [recipes]
                properties:
                  recipes:
                    type: array
                    maxItems: 100
                    items: { $ref: '#/components/schemas/EditorRecipe' }
  /cookbook/tenants/{tenantSlug}/ingredients:
    get:
      operationId: listTenantIngredients
      summary: Lists ingredients owned by a cookbook with aliases and recipe usage counts.
      description: Requires ingredient:create or ingredient:update in the requested cookbook. ingredient:read alone does not grant management access.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantSlug' }]
      responses:
        '200':
          description: Tenant ingredients and their aliases sorted case-insensitively by name, with public IDs breaking ties.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ingredients]
                properties:
                  ingredients:
                    type: array
                    items: { $ref: '#/components/schemas/TenantIngredient' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '404':
          description: The requested cookbook is disabled or does not exist.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    post:
      operationId: createTenantIngredient
      summary: Creates a cookbook-owned ingredient and optional aliases.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantSlug' }]
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/TenantIngredientInput' } } }
      responses:
        '201':
          description: Ingredient created.
          content:
            { application/json: { schema: { $ref: '#/components/schemas/TenantIngredient' } } }
        '400': { description: Invalid ingredient input. }
        '409': { description: Ingredient or alias conflict. }
  /cookbook/tenants/{tenantSlug}/ingredients/{publicId}:
    patch:
      operationId: updateTenantIngredient
      security: [{ sessionCookie: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { name: publicId, in: path, required: true, schema: { type: string, format: uuid } },
        ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IngredientInput' } } }
      responses: { '204': { description: Ingredient updated. } }
    delete:
      operationId: deleteTenantIngredient
      security: [{ sessionCookie: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { name: publicId, in: path, required: true, schema: { type: string, format: uuid } },
        ]
      responses:
        {
          '204': { description: Ingredient deleted. },
          '409': { description: Ingredient is in use. },
        }
  /cookbook/tenants/{tenantSlug}/ingredients/{publicId}/aliases:
    post:
      operationId: createTenantIngredientAlias
      security: [{ sessionCookie: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { name: publicId, in: path, required: true, schema: { type: string, format: uuid } },
        ]
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/IngredientAliasInput' } } }
      responses:
        {
          '201':
            {
              description: Alias created,
              content:
                {
                  application/json:
                    { schema: { $ref: '#/components/schemas/TenantIngredientAlias' } },
                },
            },
        }
  /cookbook/tenants/{tenantSlug}/ingredients/{publicId}/convert-to-alias:
    post:
      operationId: convertTenantIngredientToAlias
      summary: Reassigns recipe uses and converts a cookbook-owned source ingredient name into an alias.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { name: publicId, in: path, required: true, schema: { type: string, format: uuid } },
        ]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/IngredientConsolidationInput' } },
          }
      responses:
        '204': { description: Ingredient converted to an alias. }
        '400': { description: Invalid ingredient consolidation. }
        '404': { description: Source or target ingredient not found. }
  /cookbook/tenants/{tenantSlug}/ingredients/{publicId}/merge:
    post:
      operationId: mergeTenantIngredient
      summary: Reassigns recipe uses to a cookbook-owned target ingredient and removes the source ingredient.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { name: publicId, in: path, required: true, schema: { type: string, format: uuid } },
        ]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/IngredientConsolidationInput' } },
          }
      responses:
        '204': { description: Ingredient merged. }
        '400': { description: Invalid ingredient consolidation. }
        '404': { description: Source or target ingredient not found. }
  /cookbook/tenants/{tenantSlug}/ingredients/{publicId}/convert-to-note:
    post:
      operationId: convertTenantIngredientToNote
      summary: Converts recipe uses into free-text entries and removes the cookbook-owned source ingredient.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { name: publicId, in: path, required: true, schema: { type: string, format: uuid } },
        ]
      responses:
        '204': { description: Ingredient converted to free-text recipe entries. }
        '404': { description: Source ingredient not found. }
  /cookbook/tenants/{tenantSlug}/ingredients/{publicId}/aliases/{aliasPublicId}:
    delete:
      operationId: deleteTenantIngredientAlias
      summary: Separates the alias into an independent cookbook ingredient and reassigns only uses that selected the alias.
      security: [{ sessionCookie: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { name: publicId, in: path, required: true, schema: { type: string, format: uuid } },
          { name: aliasPublicId, in: path, required: true, schema: { type: string, format: uuid } },
        ]
      responses:
        {
          '204': { description: Alias separated into an independent ingredient. },
          '404': { description: Alias not found. },
          '409': { description: An ingredient with the alias name already exists. },
        }
  /cookbook/tenants/{tenantSlug}/units:
    get:
      operationId: listTenantUnits
      summary: Lists units of measure owned by a cookbook.
      description: Requires unit:create, unit:update, or unit:delete in the requested cookbook. unit:read alone does not grant management access.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantSlug' }]
      responses:
        '200':
          description: Tenant units.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [units, referenceUnits]
                properties:
                  units:
                    type: array
                    items: { $ref: '#/components/schemas/TenantUnit' }
                  referenceUnits:
                    type: array
                    items: { $ref: '#/components/schemas/TenantUnit' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '404':
          description: The requested cookbook is disabled or does not exist.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    post:
      operationId: createTenantUnit
      summary: Creates a cookbook-owned unit of measure.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantSlug' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TenantUnitInput' } } }
      responses:
        '201':
          description: Unit created.
          content: { application/json: { schema: { $ref: '#/components/schemas/TenantUnit' } } }
  /cookbook/tenants/{tenantSlug}/units/{publicId}:
    patch:
      operationId: updateTenantUnit
      description: >-
        Updates default names, symbols, and supplied language versions. Omitting conversion
        fields preserves the stored conversion. Numerically identical conversions are
        accepted regardless of trailing decimal zeroes. Changes to conversion state or
        values are rejected when the unit is used by recipe ingredients.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { name: publicId, in: path, required: true, schema: { type: string, format: uuid } },
        ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TenantUnitInput' } } }
      responses:
        '204': { description: Unit updated. }
        '400':
          description: Invalid unit input or conversion reference (INVALID_UNIT or INVALID_REFERENCE_UNIT).
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '404':
          description: Unit not found in the cookbook (UNIT_NOT_FOUND), or cookbook absent or disabled (TENANT_NOT_FOUND).
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '409':
          description: >-
            The default name or symbol conflicts with a visible unit (UNIT_CONFLICT),
            or a used unit's conversion would change (UNIT_IN_USE).
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    delete:
      operationId: deleteTenantUnit
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { name: publicId, in: path, required: true, schema: { type: string, format: uuid } },
        ]
      responses: { '204': { description: Unit deleted. }, '409': { description: Unit is in use. } }
  /cookbook/tenants/{tenantSlug}/recipes/{publicId}/share-links:
    get:
      operationId: listRecipeShareLinks
      summary: Lists active share links for a published recipe.
      security: [{ sessionCookie: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { $ref: '#/components/parameters/RecipePublicId' },
        ]
      responses:
        '200':
          description: Active share links.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [shareLinks]
                properties:
                  shareLinks:
                    { type: array, items: { $ref: '#/components/schemas/RecipeShareLinkListItem' } }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
    post:
      operationId: createRecipeShareLink
      summary: Creates a tokenized share link for the published recipe.
      security: [{ sessionCookie: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { $ref: '#/components/parameters/RecipePublicId' },
        ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: [string, 'null'], minLength: 1, maxLength: 160 }
                expiresAt: { type: [string, 'null'], format: date-time }
      responses:
        '201':
          {
            description: Share link created,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/RecipeShareLink' } } },
          }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
  /cookbook/tenants/{tenantSlug}/recipes/{publicId}/share-links/{shareLinkId}:
    delete:
      operationId: revokeRecipeShareLink
      summary: Revokes an active recipe share link.
      security: [{ sessionCookie: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { $ref: '#/components/parameters/RecipePublicId' },
          { name: shareLinkId, in: path, required: true, schema: { type: string, format: uuid } },
        ]
      responses:
        '204': { description: Share link revoked. }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/TenantPermissionRequired' }
        '404': { description: Share link not found. }
  /cookbook/tenants/{tenantSlug}/service-accounts:
    get:
      operationId: listServiceAccounts
      summary: Lists tenant-scoped service accounts, roles, and token metadata.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantSlug' }]
      responses:
        '200':
          description: Service accounts and assignable tenant roles.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [serviceAccounts, roles]
                properties:
                  serviceAccounts:
                    type: array
                    items: { $ref: '#/components/schemas/ServiceAccount' }
                  roles:
                    type: array
                    items: { $ref: '#/components/schemas/TenantRole' }
    post:
      operationId: createServiceAccount
      summary: Creates a tenant-scoped service account with explicit tenant roles.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantSlug' }]
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/ServiceAccountInput' } } }
      responses:
        '201':
          description: Service account created.
          content:
            application/json:
              schema:
                type: object
                required: [publicId]
                properties: { publicId: { type: string, format: uuid } }
  /cookbook/tenants/{tenantSlug}/service-accounts/{publicId}:
    patch:
      operationId: updateServiceAccount
      summary: Updates a service account's name and tenant roles.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { $ref: '#/components/parameters/PublicId' },
        ]
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/ServiceAccountInput' } } }
      responses: { '204': { description: Service account updated. } }
    delete:
      operationId: disableServiceAccount
      summary: Disables a service account and revokes all of its API tokens.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { $ref: '#/components/parameters/PublicId' },
        ]
      responses: { '204': { description: Service account disabled. } }
  /cookbook/tenants/{tenantSlug}/service-accounts/{publicId}/tokens:
    post:
      operationId: createServiceAccountToken
      summary: Creates an opaque bearer token and returns its plaintext value once.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { $ref: '#/components/parameters/PublicId' },
        ]
      requestBody:
        required: true
        content:
          {
            application/json: { schema: { $ref: '#/components/schemas/ServiceAccountTokenInput' } },
          }
      responses:
        '201':
          description: Token created. Persist the token now; it cannot be retrieved again.
          content:
            {
              application/json:
                { schema: { $ref: '#/components/schemas/ServiceAccountTokenCreated' } },
            }
  /cookbook/tenants/{tenantSlug}/service-accounts/{publicId}/tokens/{tokenId}:
    delete:
      operationId: revokeServiceAccountToken
      summary: Revokes a service-account token.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        [
          { $ref: '#/components/parameters/TenantSlug' },
          { $ref: '#/components/parameters/PublicId' },
          { name: tokenId, in: path, required: true, schema: { type: string, format: uuid } },
        ]
      responses: { '204': { description: Token revoked. } }
  /cookbook/share-links/{token}:
    get:
      operationId: getSharedRecipe
      summary: Resolves an active share link to its published recipe.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          {
            description: Shared recipe,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/SharedRecipeDetail' } } },
          }
components:
  parameters:
    TenantSlug:
      name: tenantSlug
      in: path
      required: true
      schema: { type: string }
    PublicId:
      name: publicId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RecipePublicId:
      name: publicId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    RecipeSlugConflict:
      description: RECIPE_CONFLICT. The recipe URL name is already used by another recipe in this cookbook.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    RecipeUnavailable:
      description: RECIPE_NOT_FOUND or TENANT_NOT_FOUND. The recipe, editable revision, or cookbook is unavailable.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    RecipeVariantInvalid:
      description: INVALID_RECIPE_VARIANT. The variant identifier, name, URL name, or settings are invalid.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    RecipeVariantConflict:
      description: RECIPE_VARIANT_CONFLICT. Another variant in this recipe already uses the URL name.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    AiContextBootstrapUnavailable:
      description: AI_CONTEXT_UNAVAILABLE. The bootstrap link is unknown, expired, consumed, revoked, or its cookbook is disabled.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    AiContextReaderUnavailable:
      description: AI_CONTEXT_UNAVAILABLE. The AI reader token is missing, malformed, unknown, expired, or revoked, the access_token parameter is repeated, or both Authorization and access_token are supplied.
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
        Referrer-Policy: { schema: { type: string, const: no-referrer } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    AiContextRecipeUnavailable:
      description: RECIPE_NOT_FOUND. The recipe or requested revision is outside the grant scope or unavailable; the draft endpoint also returns this response when no current draft exists.
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
        Referrer-Policy: { schema: { type: string, const: no-referrer } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    ReportInvalid:
      description: Invalid report, ticket update, assignee, filter, or report settings. Codes are INVALID_REPORT, INVALID_REPORT_UPDATE, INVALID_REPORT_ASSIGNEE, INVALID_REPORT_FILTER, or INVALID_REPORT_SETTINGS.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ReportForbidden:
      description: PASSWORD_CHANGE_REQUIRED or INSTANCE_PERMISSION_REQUIRED.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ReportNotFound:
      description: REPORT_TARGET_NOT_FOUND or REPORT_NOT_FOUND.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    EmailChangeRateLimited:
      description: EMAIL_CHANGE_RATE_LIMITED. The account must wait before requesting another email.
      headers:
        Retry-After:
          description: Whole seconds until the next allowed send.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    EmailChangeDeliveryFailed:
      description: EMAIL_CHANGE_DELIVERY_FAILED. SMTP delivery failed; the previous pending change is preserved.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    EmailChangeSmtpRequired:
      description: SMTP_REQUIRED. Instance email delivery is not configured; pending changes are preserved.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    AuthenticationRequired:
      description: Authentication is required.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    InstancePermissionRequired:
      description: The active user lacks the required instance permission.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    TenantPermissionRequired:
      description: The active user lacks the required tenant permission.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    TenantNotFound:
      description: The tenant does not exist or is disabled.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    CategoryNotFound:
      description: The category was not found.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    InvalidCategory:
      description: The category input or parent relation is invalid.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    CategoryConflict:
      description: A category with the supplied URL name already exists.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    CategoryInUse:
      description: The category or one of its descendants is used by a recipe revision.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  schemas:
    AiContextScope:
      type: object
      additionalProperties: false
      required: [type, publicId]
      properties:
        type: { type: string, enum: [TENANT, CATEGORY, RECIPE] }
        publicId: { type: string, format: uuid }
    AiContextEndpoint:
      type: object
      additionalProperties: false
      required: [method, path, url]
      properties:
        method: { type: string, const: GET }
        path: { type: string, description: Internal API route template. }
        url:
          {
            type: string,
            description: Absolute public URL template including the API path prefix. Replace placeholders before requesting.,
          }
    RecipeAuthoringResources:
      type: object
      additionalProperties: false
      required:
        [
          name,
          version,
          format,
          formatVersion,
          skillUrl,
          schemaUrl,
          downloadUrl,
          examples,
          instructions,
        ]
      description: Public recipe-authoring resources, independent of the context grant. URLs retain the configured public API prefix. Fetch them without credentials. Context reader access remains read-only; import requires ordinary cookbook permissions and explicit local catalogue mappings.
      properties:
        name: { type: string, const: shadowcook-recipe }
        version: { type: string, const: '1' }
        format: { type: string, const: shadowcook-recipe }
        formatVersion: { type: integer, const: 1 }
        skillUrl: { type: string, format: uri }
        schemaUrl: { type: string, format: uri }
        downloadUrl: { type: string, format: uri }
        examples:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: string, format: uri }
        instructions: { type: string }
    PortableRecipeDocument:
      $ref: ../apps/api/skills/v1/shadowcook-recipe/recipe.schema.json
    RecipeEditorCategory:
      type: object
      additionalProperties: false
      required: [public_id, parent_public_id, name, slug, sort_order]
      properties:
        public_id: { type: string, format: uuid }
        parent_public_id: { type: [string, 'null'], format: uuid }
        name: { type: string }
        slug: { type: string }
        sort_order: { type: integer, minimum: 0 }
    RecipeImportPreviewInput:
      type: object
      additionalProperties: false
      required:
        - json
      properties:
        json:
          type: string
          description: UTF-8 recipe JSON text, at most 1048576 bytes. Files and pasted
            input use the same field.
    RecipeImportIssue:
      type: object
      additionalProperties: false
      required:
        - path
        - code
      properties:
        path:
          type: string
        code:
          type: string
          enum:
            - JSON
            - SCHEMA
            - DUPLICATE
            - REFERENCE
            - VARIANT
            - DURATION
            - URL
            - LIMIT
    RecipeImportError:
      type: object
      additionalProperties: false
      required:
        - code
        - error
      properties:
        code:
          type: string
        error:
          type: string
        issues:
          type: array
          items:
            $ref: '#/components/schemas/RecipeImportIssue'
          maxItems: 40
    RecipeImportCandidate:
      type: object
      additionalProperties: false
      required:
        - publicId
        - name
        - symbol
        - conversion
        - match
      properties:
        publicId:
          type: string
          format: uuid
        name:
          type: string
        symbol:
          type:
            - string
            - 'null'
        conversion:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - dimension
                - baseFactor
                - baseOffset
              properties:
                dimension:
                  type: string
                  enum:
                    - MASS
                    - VOLUME
                    - COUNT
                    - TEMPERATURE
                baseFactor:
                  type: string
                baseOffset:
                  type: string
            - type: 'null'
        match:
          type: string
          enum:
            - EXACT
            - ALIAS
            - SIMILAR
            - DEFINITION
        translations:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required:
              - name
              - symbol
            properties:
              name:
                type: string
              symbol:
                type: string
    RecipeImportSuggestions:
      type: object
      additionalProperties: false
      required:
        - key
        - candidates
        - suggestedPublicId
      properties:
        key:
          type: string
          pattern: ^[a-z][a-z0-9-]{0,79}$
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/RecipeImportCandidate'
          maxItems: 10
        suggestedPublicId:
          type:
            - string
            - 'null'
          format: uuid
    RecipeImportMapping:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - key
            - action
            - publicId
          properties:
            key:
              type: string
            action:
              type: string
              const: EXISTING
            publicId:
              type: string
              format: uuid
            addAsAlias:
              type: boolean
              default: false
              description:
                Ingredient mappings only. Explicitly adds the original ingredient name as an alias
                of the selected local ingredient in the import transaction. Requires ingredient:update. Existing
                equivalent aliases are reused.
        - type: object
          additionalProperties: false
          required:
            - key
            - action
            - name
          properties:
            key:
              type: string
            action:
              type: string
              const: CREATE
            name:
              type: string
              pattern: \S
              maxLength: 240
            symbol:
              type: string
              pattern: \S
              maxLength: 80
          description:
            Creating a unit additionally requires a non-blank symbol. The source conversion definition
            is retained.
    RecipeImportUnitMapping:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - key
            - action
            - publicId
          properties:
            key:
              type: string
            action:
              type: string
              const: EXISTING
            publicId:
              type: string
              format: uuid
        - type: object
          additionalProperties: false
          required:
            - key
            - action
            - name
          properties:
            key:
              type: string
            action:
              type: string
              const: CREATE
            name:
              type: string
              pattern: \S
              maxLength: 240
            symbol:
              type: string
              pattern: \S
              maxLength: 80
          description:
            Creating a unit additionally requires a non-blank symbol. The source conversion definition
            is retained.
    RecipeImportInput:
      type: object
      additionalProperties: false
      required:
        - json
        - slug
        - categoryPublicIds
        - ingredients
        - units
      properties:
        json:
          type: string
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 160
          not:
            enum:
              - admin
              - api
              - assets
              - auth
              - health
              - login
              - logout
              - recipes
              - settings
        categoryPublicIds:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
          maxItems: 200
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/RecipeImportMapping'
          maxItems: 500
        units:
          type: array
          items:
            $ref: '#/components/schemas/RecipeImportUnitMapping'
          maxItems: 200
      description:
        Supply exactly one mapping for every ingredient/unit used by any recipe step. Unused catalogue
        declarations are ignored. Source public IDs are not local mapping targets.
    RecipeImportPreview:
      type: object
      additionalProperties: false
      required:
        - document
        - categories
        - permissions
        - ingredients
        - units
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/RecipeEditorCategory'
        document:
          $ref: '#/components/schemas/PortableRecipeDocument'
        permissions:
          type: object
          additionalProperties: false
          required:
            - canCreateIngredients
            - canCreateUnits
            - canCreateVariants
            - canAddIngredientAliases
          properties:
            canCreateIngredients:
              type: boolean
            canCreateUnits:
              type: boolean
            canCreateVariants:
              type: boolean
            canAddIngredientAliases:
              type: boolean
              description: The current principal has ingredient:update in the receiving cookbook.
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/RecipeImportSuggestions'
        units:
          type: array
          items:
            $ref: '#/components/schemas/RecipeImportSuggestions'
    CookbookImportSources:
      type: object
      additionalProperties: false
      required:
        - recipes
        - ingredients
        - units
      properties:
        recipes:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - recipe_public_id
              - instance_url
              - tenant_public_id
              - remote_recipe_public_id
              - remote_revision_public_id
            properties:
              recipe_public_id:
                type: string
                format: uuid
              instance_url:
                type: string
                format: uri
              tenant_public_id:
                type: string
                format: uuid
              remote_recipe_public_id:
                type: string
                format: uuid
              remote_revision_public_id:
                type:
                  - string
                  - 'null'
                format: uuid
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/CookbookEntityImportSource'
        units:
          type: array
          items:
            $ref: '#/components/schemas/CookbookEntityImportSource'
      description: Unverified import provenance. These source claims are not active federation
        relationships or authorization grants.
    CookbookEntityImportSource:
      type: object
      additionalProperties: false
      required:
        - recipe_public_id
        - local_public_id
        - instance_url
        - remote_tenant_public_id
        - remote_entity_public_id
      properties:
        recipe_public_id:
          type: string
          format: uuid
        local_public_id:
          type: string
          format: uuid
        instance_url:
          type: string
          format: uri
        remote_tenant_public_id:
          type:
            - string
            - 'null'
          format: uuid
        remote_entity_public_id:
          type: string
          format: uuid
    AiContextManifest:
      type: object
      additionalProperties: false
      required:
        [
          version,
          baseUrl,
          accessToken,
          expiresAt,
          tenant,
          web,
          scope,
          endpoints,
          requestInstructions,
          recipeAuthoring,
          authentication,
          restrictions,
        ]
      properties:
        version: { type: string, const: '1' }
        baseUrl: { type: string, format: uri }
        accessToken: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        expiresAt: { type: string, format: date-time }
        tenant:
          type: object
          additionalProperties: false
          required: [publicId, slug, displayName]
          properties:
            publicId: { type: string, format: uuid }
            slug: { type: string }
            displayName: { type: string }
        web:
          type: object
          additionalProperties: false
          required: [baseUrl, routes, categorySlugPath, recipeLinkRule]
          properties:
            baseUrl: { type: string, format: uri }
            routes:
              type: object
              additionalProperties: false
              required: [cookbook, category, rootRecipe, categoryRecipe, variantSuffix]
              properties:
                cookbook: { type: string }
                category: { type: string }
                rootRecipe: { type: string }
                categoryRecipe: { type: string }
                variantSuffix: { type: string }
            categorySlugPath: { type: string }
            recipeLinkRule: { type: string }
        recipeAuthoring: { $ref: '#/components/schemas/RecipeAuthoringResources' }
        scope: { $ref: '#/components/schemas/AiContextScope' }
        endpoints:
          type: object
          additionalProperties: false
          required: [overview, recipe, revisions, revision, draft]
          properties:
            overview: { $ref: '#/components/schemas/AiContextEndpoint' }
            recipe: { $ref: '#/components/schemas/AiContextEndpoint' }
            revisions: { $ref: '#/components/schemas/AiContextEndpoint' }
            revision: { $ref: '#/components/schemas/AiContextEndpoint' }
            draft: { $ref: '#/components/schemas/AiContextEndpoint' }
        requestInstructions: { type: string }
        authentication:
          type: object
          additionalProperties: false
          required: [type, header, queryParameter, queryTemplate]
          properties:
            type: { type: string, const: bearer }
            header: { type: string, const: 'Authorization: Bearer {accessToken}' }
            queryParameter: { type: string, const: access_token }
            queryTemplate: { type: string, const: 'access_token={accessToken}' }
        restrictions:
          type: array
          items: { type: string, enum: [read-only, no administration, scope-limited] }
    AiContextOverview:
      type: object
      additionalProperties: false
      required: [tenant, scope, categories, recipes]
      properties:
        tenant:
          type: object
          additionalProperties: false
          required: [displayName, slug]
          properties:
            displayName: { type: string }
            slug: { type: string }
        scope:
          type: object
          additionalProperties: false
          properties:
            type: { type: string, enum: [TENANT, CATEGORY, RECIPE] }
            publicId: { type: string, format: uuid }
            name: { type: [string, 'null'] }
          required: [type, publicId, name]
        categories:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [public_id, parent_public_id, name, slug, sort_order]
            properties:
              public_id: { type: string, format: uuid }
              parent_public_id: { type: [string, 'null'], format: uuid }
              name: { type: string }
              slug: { type: string }
              sort_order: { type: integer }
        recipes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [public_id, slug, title, summary]
            properties:
              public_id: { type: string, format: uuid }
              slug: { type: string }
              title: { type: string }
              summary: { type: [string, 'null'] }
    AiContextVariant:
      type: object
      additionalProperties: false
      required: [metadata, diet, variant_key, name, slug, is_default, is_visible]
      properties:
        metadata: { $ref: '#/components/schemas/RecipeContentMetadata' }
        diet: { $ref: '#/components/schemas/RecipeDiet' }
        variant_key: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        is_default: { type: boolean }
        is_visible: { type: boolean }
    AiContextRecipe:
      description: Top-level metadata and diet project the selected variant, or the default variant when no selection exists. Legacy recipe writes of these fields update the default variant only.
      type: object
      additionalProperties: false
      required:
        [publicId, slug, title, summary, metadata, diet, createdAt, updatedAt, variants, steps]
      properties:
        metadata: { $ref: '#/components/schemas/RecipeContentMetadata' }
        diet: { $ref: '#/components/schemas/RecipeDiet' }
        createdAt: { $ref: '#/components/schemas/RecipeCreatedAt' }
        updatedAt: { $ref: '#/components/schemas/RecipeUpdatedAt' }
        publicId: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        summary: { type: [string, 'null'] }
        variants:
          type: array
          items: { $ref: '#/components/schemas/AiContextVariant' }
        steps:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [public_id, sort_order, instruction, ingredients]
            properties:
              public_id: { type: string, format: uuid }
              sort_order: { type: integer }
              instruction: { type: string }
              ingredients:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                    [
                      sort_order,
                      amount,
                      unit_symbol,
                      ingredient_name,
                      special_kind,
                      note,
                      is_optional,
                    ]
                  properties:
                    sort_order: { type: integer }
                    amount: { type: [string, 'null'] }
                    unit_symbol: { type: [string, 'null'] }
                    ingredient_name: { type: [string, 'null'] }
                    special_kind:
                      {
                        type: [string, 'null'],
                        enum:
                          [
                            NO_ICON,
                            REMOVE,
                            ADD,
                            INFO,
                            IMPORTANT,
                            COOK,
                            COOL,
                            HEAT,
                            WAIT,
                            WORK_STEP,
                            null,
                          ],
                      }
                    note: { type: [string, 'null'] }
                    is_optional: { type: boolean }
    AiContextRevisionSummary:
      type: object
      additionalProperties: false
      required: [public_id, version, status, published_at, title]
      properties:
        public_id: { type: string, format: uuid }
        version: { type: integer }
        status: { type: string, enum: [PUBLISHED, ARCHIVED] }
        published_at: { type: string, format: date-time }
        title: { type: string }
    AiContextRevision:
      type: object
      additionalProperties: false
      required:
        [
          public_id,
          version,
          status,
          published_at,
          title,
          summary,
          metadata,
          diet,
          categories,
          steps,
          variants,
        ]
      properties:
        metadata: { $ref: '#/components/schemas/RecipeContentMetadata' }
        diet: { $ref: '#/components/schemas/RecipeDiet' }
        public_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
        published_at: { type: [string, 'null'], format: date-time }
        title: { type: string }
        summary: { type: [string, 'null'] }
        categories:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [public_id, name]
            properties:
              public_id: { type: string, format: uuid }
              name: { type: string }
        variants:
          type: array
          items: { $ref: '#/components/schemas/AiContextVariant' }
        steps:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [public_id, step_key, sort_order, instruction, ingredients]
            properties:
              public_id: { type: string, format: uuid }
              step_key: { type: string, format: uuid }
              sort_order: { type: integer }
              instruction: { type: string }
              ingredients:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                    [
                      usageKey,
                      ingredientName,
                      amount,
                      unitSymbol,
                      specialKind,
                      note,
                      isOptional,
                      sortOrder,
                    ]
                  properties:
                    usageKey: { type: string, format: uuid }
                    ingredientName: { type: [string, 'null'] }
                    amount: { type: [string, 'null'] }
                    unitSymbol: { type: [string, 'null'] }
                    specialKind:
                      {
                        type: [string, 'null'],
                        enum:
                          [
                            NO_ICON,
                            REMOVE,
                            ADD,
                            INFO,
                            IMPORTANT,
                            COOK,
                            COOL,
                            HEAT,
                            WAIT,
                            WORK_STEP,
                            null,
                          ],
                      }
                    note: { type: [string, 'null'] }
                    isOptional: { type: boolean }
                    sortOrder: { type: integer }
    CookbookExport:
      type: object
      additionalProperties: false
      required:
        [
          import_sources,
          format,
          format_version,
          exported_at,
          cookbook,
          categories,
          ingredients,
          ingredient_aliases,
          units,
          recipes,
          revisions,
          variants,
          steps,
          ingredient_usages,
        ]
      properties:
        import_sources: { $ref: '#/components/schemas/CookbookImportSources' }
        format: { type: string, const: shadowcook-cookbook }
        format_version: { type: integer, const: 1 }
        exported_at: { type: string, format: date-time, description: UTC export timestamp. }
        cookbook: { $ref: '#/components/schemas/ExportCookbookSettings' }
        categories: { type: array, items: { $ref: '#/components/schemas/ExportCategory' } }
        ingredients: { type: array, items: { $ref: '#/components/schemas/ExportIngredient' } }
        ingredient_aliases:
          { type: array, items: { $ref: '#/components/schemas/ExportIngredientAlias' } }
        units: { type: array, items: { $ref: '#/components/schemas/ExportUnit' } }
        recipes: { type: array, items: { $ref: '#/components/schemas/ExportRecipe' } }
        revisions: { type: array, items: { $ref: '#/components/schemas/ExportRevision' } }
        variants: { type: array, items: { $ref: '#/components/schemas/ExportVariant' } }
        steps: { type: array, items: { $ref: '#/components/schemas/ExportStep' } }
        ingredient_usages:
          { type: array, items: { $ref: '#/components/schemas/ExportIngredientUsage' } }
    ExportCookbookSettings:
      type: object
      additionalProperties: false
      required:
        [
          public_id,
          display_name,
          description,
          slug,
          default_recipe_visibility,
          default_recipe_discoverability,
          frontpage_recipe_count,
          frontpage_heading,
          show_on_start_page,
          created_at,
          updated_at,
        ]
      properties:
        public_id: { type: string, format: uuid }
        display_name: { type: string }
        description: { type: [string, 'null'] }
        slug: { type: string }
        default_recipe_visibility: { type: string, enum: [PRIVATE, MEMBERS_ONLY, PUBLIC] }
        default_recipe_discoverability: { type: string, enum: [DISCOVERABLE, UNLISTED] }
        frontpage_recipe_count: { type: integer, minimum: 1, maximum: 100 }
        frontpage_heading: { type: [string, 'null'] }
        show_on_start_page: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ExportCategory:
      type: object
      additionalProperties: false
      required: [public_id, parent_public_id, name, slug, sort_order]
      properties:
        public_id: { type: string, format: uuid }
        parent_public_id: { type: [string, 'null'], format: uuid }
        name: { type: string }
        slug: { type: string }
        sort_order: { type: integer, minimum: 0 }
    ExportIngredient:
      type: object
      additionalProperties: false
      required: [public_id, canonical_name]
      properties:
        public_id: { type: string, format: uuid }
        canonical_name: { type: string }
    ExportIngredientAlias:
      type: object
      additionalProperties: false
      required: [public_id, ingredient_public_id, alias]
      properties:
        public_id: { type: string, format: uuid }
        ingredient_public_id: { type: string, format: uuid }
        alias: { type: string }
    ExportUnit:
      type: object
      additionalProperties: false
      required:
        [
          public_id,
          is_instance_owned,
          name,
          symbol,
          localization_key,
          dimension,
          base_factor,
          base_offset,
          translations,
        ]
      properties:
        public_id: { type: string, format: uuid }
        is_instance_owned: { type: boolean }
        name: { type: string }
        symbol: { type: string }
        localization_key: { type: [string, 'null'] }
        dimension: { type: [string, 'null'], enum: [MASS, VOLUME, COUNT, TEMPERATURE, null] }
        base_factor:
          {
            type: [string, 'null'],
            description: Exact decimal conversion factor; null for units without conversion.,
          }
        base_offset:
          {
            type: [string, 'null'],
            description: Exact decimal conversion offset; null for units without conversion.,
          }
        translations:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required: [name, symbol]
            properties:
              name: { type: string }
              symbol: { type: string }
    ExportRecipe:
      type: object
      additionalProperties: false
      required:
        [
          public_id,
          lineage_public_id,
          slug,
          visibility_override,
          discoverability_override,
          is_featured,
          published_revision_public_id,
          draft_revision_public_id,
          created_at,
          updated_at,
        ]
      properties:
        public_id: { type: string, format: uuid }
        lineage_public_id: { type: string, format: uuid }
        slug: { type: string }
        visibility_override: { type: [string, 'null'], enum: [PRIVATE, MEMBERS_ONLY, PUBLIC, null] }
        discoverability_override: { type: [string, 'null'], enum: [DISCOVERABLE, UNLISTED, null] }
        is_featured: { type: boolean }
        published_revision_public_id: { type: [string, 'null'], format: uuid }
        draft_revision_public_id: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ExportRevision:
      description: Top-level metadata and diet project the selected variant, or the default variant when no selection exists. Legacy recipe writes of these fields update the default variant only.
      type: object
      additionalProperties: false
      required:
        [
          public_id,
