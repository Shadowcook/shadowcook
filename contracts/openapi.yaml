        slug: { type: string }
        is_default: { type: boolean }
        is_visible: { type: boolean }
    RecipeVariant:
      type: object
      additionalProperties: false
      required: [metadata, diet, variantKey, name, slug, isDefault, isVisible, overrides]
      properties:
        metadata: { $ref: '#/components/schemas/RecipeContentMetadata' }
        diet: { $ref: '#/components/schemas/RecipeDiet' }
        variantKey: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        isDefault: { type: boolean, description: Only a visible variant may be the default. }
        isVisible: { type: boolean }
        overrides:
          type: array
          items: { $ref: '#/components/schemas/RecipeVariantStepOverride' }
    RecipeVariantInput:
      description: Variant preparation data. New variants copy metadata and diet from the current default variant before applying explicitly supplied fields. Explicit null diet clears the inherited classification; a supplied metadata object replaces all inherited metadata. Omitted metadata or diet preserves existing values on update.
      type: object
      additionalProperties: false
      required: [name, slug, isDefault, isVisible]
      properties:
        metadata: { $ref: '#/components/schemas/RecipeContentMetadata' }
        diet: { $ref: '#/components/schemas/RecipeDiet' }
        name: { type: string, minLength: 1, maxLength: 240 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        isDefault: { type: boolean, description: Only a visible variant may be the default. }
        isVisible: { type: boolean }
    TenantRole:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    ServiceAccountInput:
      type: object
      additionalProperties: false
      required: [name, roleIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        roleIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
    ServiceAccountToken:
      type: object
      additionalProperties: false
      required: [id, name, tokenPrefix, expiresAt, lastUsedAt, revokedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        tokenPrefix: { type: string }
        expiresAt: { type: [string, 'null'], format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    ServiceAccount:
      type: object
      additionalProperties: false
      required: [public_id, name, disabled_at, roles, tokens]
      properties:
        public_id: { type: string, format: uuid }
        name: { type: string }
        disabled_at: { type: [string, 'null'], format: date-time }
        roles:
          type: array
          items: { $ref: '#/components/schemas/TenantRole' }
        tokens:
          type: array
          items: { $ref: '#/components/schemas/ServiceAccountToken' }
    ServiceAccountTokenInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        expiresAt: { type: [string, 'null'], format: date-time }
    ServiceAccountTokenCreated:
      type: object
      additionalProperties: false
