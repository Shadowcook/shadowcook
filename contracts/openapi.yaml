        step_key: { type: string, format: uuid }
        sort_order: { type: integer, minimum: 0 }
        instruction:
          { type: string, description: Authored content with recipe reference tokens preserved. }
    ExportIngredientUsage:
      type: object
      additionalProperties: false
      required:
        [
          revision_public_id,
          step_key,
          usage_key,
          ingredient_public_id,
          ingredient_alias_public_id,
          text_override,
          special_kind,
          unit_public_id,
          amount,
          is_optional,
          note,
          sort_order,
        ]
      properties:
        revision_public_id: { type: string, format: uuid }
