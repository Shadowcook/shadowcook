openapi: 3.1.1
info:
  title: Shadowcook API
  version: 0.1.0
paths:
  /cookbook/tenants/{tenantSlug}/recipe-imports/preview:
    post:
      operationId: previewRecipeImport
      summary: Validates portable recipe JSON and suggests cookbook-local catalogue
        matches without writing data.
      description: 'Requires recipe:create in the target cookbook. File contents and
        pasted JSON are submitted as the same json string. The document is validated
        against the bundled v1 schema and semantic rules without fetching its $schema
        or source URLs. Limit: 1 MiB UTF-8 text, nesting depth 64, 500 ingredients,
        200 units, 500 steps, 50 variants, 100 recipe references and 5000 step entries.
        Explicit alias additions require ingredient:update and are committed atomically with the draft. New catalogue entries require ingredient:create or unit:create; additional variants
        require variant:create. Imports use one transaction, generate local IDs, retain
        explicit memberships and known source claims, and never publish or activate
        federation. Existing units must have exactly equivalent definitions when a source
        definition is known. Unknown unit definitions require explicit user selection.
        Imported external recipe references become authored title-and-URL text.'
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: tenantSlug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeImportPreviewInput'
      responses:
        '200':
          description: Validated preview.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeImportPreview'
        '400':
          description: INVALID_RECIPE_IMPORT or INVALID_RECIPE_DOCUMENT. Document failures
            include stable issue codes and JSON paths.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeImportError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          description: TENANT_PERMISSION_REQUIRED, PASSWORD_CHANGE_REQUIRED or IMPORT_CREATE_PERMISSION_REQUIRED or IMPORT_ALIAS_PERMISSION_REQUIRED.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeImportError'
        '404':
          description: TENANT_NOT_FOUND.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeImportError'
        '413':
          description: RECIPE_IMPORT_TOO_LARGE. HTTP request bodies are limited to 4194304
            bytes; recipe JSON text remains limited to 1048576 bytes.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeImportError'
        '415':
          description: INVALID_RECIPE_IMPORT; unsupported request media type.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipeImportError' }
  /cookbook/tenants/{tenantSlug}/recipe-imports:
    post:
      operationId: importRecipeDraft
      summary: Imports a portable recipe as one new draft after explicit catalogue mapping.
      description: 'Requires recipe:create in the target cookbook. File contents and
        pasted JSON are submitted as the same json string. The document is validated
        against the bundled v1 schema and semantic rules without fetching its $schema
        or source URLs. Limit: 1 MiB UTF-8 text, nesting depth 64, 500 ingredients,
        200 units, 500 steps, 50 variants, 100 recipe references and 5000 step entries.
        Explicit alias additions require ingredient:update and are committed atomically with the draft. New catalogue entries require ingredient:create or unit:create; additional variants
        require variant:create. Imports use one transaction, generate local IDs, retain
        explicit memberships and known source claims, and never publish or activate
        federation. Existing units must have exactly equivalent definitions when a source
        definition is known. Unknown unit definitions require explicit user selection.
        Imported external recipe references become authored title-and-URL text.'
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: tenantSlug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeImportInput'
      responses:
        '201':
          description: Draft created with new local public ID and selected URL slug.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - publicId
                  - slug
                properties:
                  publicId:
                    type: string
                    format: uuid
                  slug:
                    type: string
        '400':
          description: INVALID_RECIPE_IMPORT or INVALID_RECIPE_DOCUMENT. Document failures
            include stable issue codes and JSON paths.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeImportError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          description: TENANT_PERMISSION_REQUIRED, PASSWORD_CHANGE_REQUIRED or IMPORT_CREATE_PERMISSION_REQUIRED or IMPORT_ALIAS_PERMISSION_REQUIRED.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeImportError'
        '404':
          description: TENANT_NOT_FOUND.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeImportError'
        '413':
          description: RECIPE_IMPORT_TOO_LARGE. HTTP request bodies are limited to 4194304
            bytes; recipe JSON text remains limited to 1048576 bytes.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeImportError'
        '415':
          description: INVALID_RECIPE_IMPORT; unsupported request media type.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipeImportError' }
        '409':
          description: IMPORT_MAPPING_INVALID, IMPORT_UNIT_MISMATCH, IMPORT_CATALOGUE_CONFLICT,
            INVALID_RECIPE_CATEGORY or RECIPE_IMPORT_CONFLICT. No recipe or catalogue
            changes are committed.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeImportError'
  /cookbook/tenants/{tenantSlug}/recipe-imports/catalogue:
    get:
      operationId: searchRecipeImportCatalogue
      summary: Searches visible ingredients or units while reviewing an import.
      description: Requires recipe:create. Ingredients belong to the receiving cookbook;
        units are instance-owned or belong to that cookbook. Searches names, aliases,
        unit symbols and stored unit translations. Returns at most 25 candidates. An empty search returns the first 25 visible entries.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: tenantSlug
          in: path
          required: true
          schema:
            type: string
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum:
              - INGREDIENT
              - UNIT
        - name: search
          in: query
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: Matching visible catalogue entries.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - candidates
                properties:
                  candidates:
                    type: array
                    items:
                      $ref: '#/components/schemas/RecipeImportCandidate'
                    maxItems: 25
        '400':
          description: INVALID_RECIPE_IMPORT or INVALID_RECIPE_DOCUMENT. Document failures
            include stable issue codes and JSON paths.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeImportError'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          description: TENANT_PERMISSION_REQUIRED, PASSWORD_CHANGE_REQUIRED or IMPORT_CREATE_PERMISSION_REQUIRED or IMPORT_ALIAS_PERMISSION_REQUIRED.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeImportError'
        '404':
          description: TENANT_NOT_FOUND.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeImportError'
  /skills/shadowcook-recipe/v1/SKILL.md:
    get:
      operationId: getRecipeAuthoringSkill
      summary: Public Shadowcook recipe authoring skill.
      description: Public version 1 resource. No authentication, context grant, tenant selection or database access is required. Never attach AI-context tokens. The skill documents JSON delivery and human-reviewed draft import.
      security: []
      responses:
        '200':
          description: Public Shadowcook recipe authoring skill.
          headers:
            Cache-Control: { schema: { type: string, const: 'public, max-age=3600' } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content:
            text/markdown:
              schema: { type: string }
  /skills/shadowcook-recipe/v1/recipe.schema.json:
    get:
      operationId: getPortableRecipeSchema
      summary: Public Draft-07 schema for one portable Shadowcook recipe.
      description: Public version 1 resource. No authentication, context grant, tenant selection or database access is required. Never attach AI-context tokens. The skill documents JSON delivery and human-reviewed draft import.
      security: []
      responses:
        '200':
          description: Public Draft-07 schema for one portable Shadowcook recipe.
          headers:
            Cache-Control: { schema: { type: string, const: 'public, max-age=3600' } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content:
            application/schema+json:
              schema:
                {
                  type: object,
                  additionalProperties: true,
                  description: 'Draft-07 JSON Schema document; its definitions and semantic rules are bundled with the skill.',
                }
  /skills/shadowcook-recipe/v1/references/format.md:
    get:
      operationId: getPortableRecipeFormatGuide
      summary: Portable recipe format and semantic constraints.
      description: Public version 1 resource. No authentication, context grant, tenant selection or database access is required. Never attach AI-context tokens. The skill documents JSON delivery and human-reviewed draft import.
      security: []
      responses:
        '200':
          description: Portable recipe format and semantic constraints.
          headers:
            Cache-Control: { schema: { type: string, const: 'public, max-age=3600' } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content:
            text/markdown:
              schema: { type: string }
  /skills/shadowcook-recipe/v1/references/icons.md:
    get:
      operationId: getRecipeIconGuide
      summary: Supported recipe pictograms and their semantic uses.
      description: Public version 1 resource. No authentication, context grant, tenant selection or database access is required. Never attach AI-context tokens. The skill documents JSON delivery and human-reviewed draft import.
      security: []
      responses:
        '200':
          description: Supported recipe pictograms and their semantic uses.
          headers:
            Cache-Control: { schema: { type: string, const: 'public, max-age=3600' } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content:
            text/markdown:
              schema: { type: string }
  /skills/shadowcook-recipe/v1/examples/simple.json:
    get:
      operationId: getSimplePortableRecipeExample
      summary: Simple portable recipe example.
      description: Public version 1 resource. No authentication, context grant, tenant selection or database access is required. Never attach AI-context tokens. The skill documents JSON delivery and human-reviewed draft import.
      security: []
      responses:
        '200':
          description: Simple portable recipe example.
          headers:
            Cache-Control: { schema: { type: string, const: 'public, max-age=3600' } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content:
            application/json:
              schema: { $ref: '../apps/api/skills/v1/shadowcook-recipe/recipe.schema.json' }
  /skills/shadowcook-recipe/v1/examples/variants.json:
    get:
      operationId: getVariantPortableRecipeExample
      summary: Portable recipe example with shared steps and variants.
      description: Public version 1 resource. No authentication, context grant, tenant selection or database access is required. Never attach AI-context tokens. The skill documents JSON delivery and human-reviewed draft import.
      security: []
      responses:
        '200':
          description: Portable recipe example with shared steps and variants.
          headers:
            Cache-Control: { schema: { type: string, const: 'public, max-age=3600' } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content:
            application/json:
              schema: { $ref: '../apps/api/skills/v1/shadowcook-recipe/recipe.schema.json' }
  /skills/shadowcook-recipe/v1/scripts/validate_recipe.py:
    get:
      operationId: getPortableRecipeValidator
      summary: Downloadable Python validator for structural and semantic recipe checks.
      description: Public version 1 resource. No authentication, context grant, tenant selection or database access is required. Never attach AI-context tokens. The skill documents JSON delivery and human-reviewed draft import.
      security: []
      responses:
        '200':
          description: Downloadable Python validator for structural and semantic recipe checks.
          headers:
            Cache-Control: { schema: { type: string, const: 'public, max-age=3600' } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content:
            text/plain:
              schema: { type: string }
  /skills/shadowcook-recipe/v1/scripts/requirements.txt:
    get:
      operationId: getPortableRecipeValidatorRequirements
      summary: Python dependency constraints for the bundled recipe validator.
      description: Public version 1 resource. No authentication, context grant, tenant selection or database access is required. Never attach AI-context tokens. The skill documents JSON delivery and human-reviewed draft import.
      security: []
      responses:
        '200':
          description: Python dependency constraints for the bundled recipe validator.
          headers:
            Cache-Control: { schema: { type: string, const: 'public, max-age=3600' } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content:
            text/plain:
              schema: { type: string }
  /skills/shadowcook-recipe/v1/shadowcook-recipe.zip:
    get:
      operationId: downloadRecipeAuthoringSkill
      summary: Downloads the complete recipe authoring skill folder.
      description: Public version 1 resource. No authentication, context grant, tenant selection or database access is required. Never attach AI-context tokens. The skill documents JSON delivery and human-reviewed draft import.
      security: []
      responses:
        '200':
          description: Downloads the complete recipe authoring skill folder.
          headers:
            Cache-Control: { schema: { type: string, const: 'public, max-age=3600' } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
            Content-Disposition:
              { schema: { type: string, const: 'attachment; filename="shadowcook-recipe-v1.zip"' } }
          content:
            application/zip:
              schema: { type: string, format: binary }
  /reports:
    post:
      operationId: createContentReport
      summary: Reports an accessible recipe, user, or cookbook to instance administrators.
      description: Requires a signed-in human user without a required password change. Allows ten reports per user per hour. User targets must share a cookbook membership or be an owner or author in an accessible published cookbook. A valid recipe share token also authorizes a recipe target. Saving creates an open, unassigned ticket and a durable email notification. SMTP delivery failure does not discard the ticket.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentReportInput' }
      responses:
        '201':
          description: Report saved.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [publicId]
                properties:
                  publicId: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/ReportInvalid' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/ReportForbidden' }
        '404': { $ref: '#/components/responses/ReportNotFound' }
        '429':
          description: REPORT_RATE_LIMITED; ten reports have already been submitted in the last hour.
          headers:
            Retry-After: { schema: { type: integer }, description: Retry interval in seconds. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /reports/users:
    get:
      operationId: listReportableCookbookUsers
      summary: Returns public identifiers and display names of users that can be reported in a cookbook.
      description: Cookbook members receive fellow members. Other authenticated visitors receive owners and published-recipe authors in accessible cookbooks. No email addresses are returned.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: tenantSlug
          in: query
          required: true
          schema: { type: string, maxLength: 120 }
      responses:
        '200':
          description: Reportable users; empty when the cookbook is unavailable.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [users]
                properties:
                  users: { type: array, items: { $ref: '#/components/schemas/ReportUser' } }
        '400': { $ref: '#/components/responses/ReportInvalid' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/ReportForbidden' }
  /admin/report-settings:
    get:
      operationId: getReportSettings
      summary: Returns the instance report notification email address.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Report settings; requires instance administration permission.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportSettings' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/ReportForbidden' }
    put:
      operationId: updateReportSettings
      summary: Configures the notification address; null disables report email delivery.
      description: Requires instance administration permission. Existing pending notifications use the current configured address.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportSettings' }
      responses:
        '204': { description: Settings saved. }
        '400': { $ref: '#/components/responses/ReportInvalid' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/ReportForbidden' }
  /admin/reports:
    get:
      operationId: listContentReports
      summary: Lists reports and active assignable administrators.
      description: Requires instance administration permission. Reports are ordered by creation time descending, then public ID; page size is 50.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ReportStatus' }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Report page.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [reports, administrators, page, pageSize, totalReports]
                properties:
                  reports: { type: array, items: { $ref: '#/components/schemas/ContentReport' } }
                  administrators:
                    { type: array, items: { $ref: '#/components/schemas/ReportUser' } }
                  page: { type: integer, minimum: 1 }
                  pageSize: { type: integer, const: 50 }
                  totalReports: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/ReportInvalid' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/ReportForbidden' }
  /admin/reports/{publicId}:
    parameters:
      - name: publicId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getContentReport
      summary: Returns a report ticket and active assignable administrators.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Report details; requires instance administration permission.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [report, administrators]
                properties:
                  report: { $ref: '#/components/schemas/ContentReport' }
                  administrators:
                    { type: array, items: { $ref: '#/components/schemas/ReportUser' } }
        '400': { $ref: '#/components/responses/ReportInvalid' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/ReportForbidden' }
        '404': { $ref: '#/components/responses/ReportNotFound' }
    put:
      operationId: updateContentReport
      summary: Updates ticket status, result, result note, and administrator assignment.
      description: Requires instance administration permission. Closed tickets require a result; open and investigating tickets require a null result. Results record a decision and do not execute blocking or deletion. Assignment accepts an active administrator public ID or null. Reporter and target cannot be changed.
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentReportUpdate' }
      responses:
        '204': { description: Ticket saved. }
        '400': { $ref: '#/components/responses/ReportInvalid' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/ReportForbidden' }
        '404': { $ref: '#/components/responses/ReportNotFound' }
  /account/cookbook-slug-preview:
    get:
      operationId: getCookbookSlugPreview
      summary: Returns the URL slug derived from a cookbook name and whether it is currently unused.
      parameters:
        - name: cookbookName
          in: query
          required: true
          description: Leading and trailing whitespace is ignored. The trimmed name starts with an ASCII letter or digit and contains at least three ASCII letters or digits.
          schema:
            {
              type: string,
              minLength: 3,
              maxLength: 120,
              pattern: '^(?=(?:.*[A-Za-z0-9]){3})[A-Za-z0-9].*$',
            }
      responses:
        '200':
          description: Cookbook URL preview.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [slug, available]
                properties:
                  slug: { type: string }
                  available: { type: boolean }
        '400': { description: Cookbook details are invalid. }
  /registration/config:
    get:
      operationId: getPublicRegistrationConfiguration
      summary: Returns whether public self-service registration is enabled.
      responses:
        '200':
          description: Public registration configuration.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [enabled, turnstileSiteKey, turnstileRequired]
                properties:
                  enabled: { type: boolean }
                  turnstileSiteKey: { type: string }
                  turnstileRequired: { type: boolean }
  /admin/registration-settings:
    get:
      operationId: getRegistrationSettings
      summary: Returns the instance public-registration setting.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Registration settings.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [enabled, turnstileEnabled, turnstileConfigured, maxCookbooksPerOwner]
                properties:
                  enabled: { type: boolean }
                  turnstileEnabled: { type: boolean }
                  turnstileConfigured: { type: boolean }
                  maxCookbooksPerOwner: { type: integer, minimum: 1, maximum: 100 }
        '403': { description: Instance administration permission is required. }
    put:
      operationId: updateRegistrationSettings
      summary: Enables or disables public self-service registration.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, turnstileEnabled, maxCookbooksPerOwner]
              properties:
                enabled: { type: boolean }
                turnstileEnabled: { type: boolean }
                maxCookbooksPerOwner: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '204': { description: Registration setting updated. }
        '400': { description: Registration setting is invalid. }
        '403': { description: Instance administration permission is required. }
        '409':
          {
            description: Turnstile was requested but is not configured in the deployment environment.,
          }
  /admin/cookbook-slug-blocked-terms:
    get:
      operationId: getCookbookSlugBlockedTerms
      summary: Lists instance-administered terms that cannot occur in cookbook URL slugs.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Blocked cookbook URL terms.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [terms]
                properties:
                  terms:
                    type: array
                    items: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        '401': { description: Authentication is required. }
        '403': { description: Instance administration permission is required. }
    post:
      operationId: createCookbookSlugBlockedTerm
      summary: Adds an instance-administered blocked cookbook URL term.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [term]
              properties:
                term:
                  {
                    type: string,
                    minLength: 1,
                    maxLength: 64,
                    pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$',
                  }
      responses:
        '201':
          description: Blocked term created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [term]
                properties:
                  term: { type: string }
        '400': { description: Blocked term is invalid or hardcoded-reserved. }
        '401': { description: Authentication is required. }
        '403': { description: Instance administration permission is required. }
        '409': { description: Blocked term already exists. }
  /admin/cookbook-slug-blocked-terms/{term}:
    delete:
      operationId: deleteCookbookSlugBlockedTerm
      summary: Deletes an instance-administered blocked cookbook URL term.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: term
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
      responses:
        '204': { description: Blocked term deleted. }
        '401': { description: Authentication is required. }
        '403': { description: Instance administration permission is required. }
        '404': { description: Blocked term not found. }
  /registration:
    post:
      operationId: createPendingRegistration
      summary: Creates an email-verification pending registration without creating a user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [
                  firstName,
                  lastName,
                  displayName,
                  email,
                  password,
                  tenantName,
                  turnstileToken,
                  website,
                ]
              properties:
                firstName: { $ref: '#/components/schemas/ProfileName' }
                lastName: { $ref: '#/components/schemas/ProfileName' }
                displayName: { $ref: '#/components/schemas/ProfileName' }
                email: { type: string, format: email }
                password:
                  {
                    type: string,
                    format: password,
                    description: Must meet the configured minimum estimated entropy.,
                  }
                tenantName:
                  type: [string, 'null']
                  minLength: 3
                  maxLength: 120
                  pattern: '^(?=(?:.*[A-Za-z0-9]){3})[A-Za-z0-9].*$'
                  description: Leading and trailing whitespace is ignored. A non-null trimmed name starts with an ASCII letter or digit and contains at least three ASCII letters or digits.
                turnstileToken: { type: string }
                website: { type: string, description: Honeypot field which must be empty. }
      responses:
        '202':
          {
            description: The generic registration acknowledgement; it does not disclose account existence.,
          }
        '400': { description: Registration details or Turnstile verification are invalid. }
        '403': { description: Public registration is disabled. }
        '429': { description: Registration request limit reached. }
        '503': { description: Verification email delivery is unavailable. }
  /registration/resend-verification:
    post:
      operationId: resendRegistrationVerification
      summary: Requests a new verification email without disclosing registration existence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Generic acknowledgement. }
        '403': { description: Public registration is disabled. }
  /registration/verify:
    post:
      operationId: verifyPendingRegistration
      summary: Consumes a registration verification token and atomically creates the user and an optional cookbook.
      description: Supports anonymous verification. An active session with a different email address is rejected without consuming the token or creating an account.
      security: [{}, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
      responses:
        '201':
          description: User and optional cookbook were created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [tenantSlug]
                properties:
                  tenantSlug: { type: [string, 'null'] }
        '400': { description: Verification token is invalid, expired, or already consumed. }
        '403':
          description: REGISTRATION_ACCOUNT_MISMATCH. The active session belongs to another email address; the pending registration is preserved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /account/email-change:
    get:
      operationId: getAccountEmailChange
      summary: Returns the current email address and pending change of the authenticated account.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Email change status. Expired pending changes are omitted. Timestamps are UTC.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountEmailChangeStatus' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403':
          description: PASSWORD_CHANGE_REQUIRED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    post:
      operationId: requestAccountEmailChange
      summary: Sends a 24-hour confirmation link to a new email address without updating the account email.
      description: Each successful send replaces the previous link. Sending is serialized per account and limited to waits of 1, 3, 10, 30, then 60 minutes, including requests with a different target address. The send count resets after 24 hours without a successful send. SMTP failures preserve the previous pending change.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202':
          description: Confirmation email sent; the current email remains unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountEmailChangeStatus' }
        '400':
          description: INVALID_EMAIL or EMAIL_UNCHANGED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403':
          description: PASSWORD_CHANGE_REQUIRED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: EMAIL_UNAVAILABLE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429': { $ref: '#/components/responses/EmailChangeRateLimited' }
        '502': { $ref: '#/components/responses/EmailChangeDeliveryFailed' }
        '503': { $ref: '#/components/responses/EmailChangeSmtpRequired' }
  /account/email-change/resend:
    post:
      operationId: resendAccountEmailChange
      summary: Replaces the active pending change link and sends a new 24-hour confirmation email.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        '202':
          description: Confirmation email sent with a replacement token and a new expiration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountEmailChangeStatus' }
        '400':
          description: EMAIL_UNCHANGED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403':
          description: PASSWORD_CHANGE_REQUIRED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: NO_PENDING_EMAIL_CHANGE or EMAIL_UNAVAILABLE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429': { $ref: '#/components/responses/EmailChangeRateLimited' }
        '502': { $ref: '#/components/responses/EmailChangeDeliveryFailed' }
        '503': { $ref: '#/components/responses/EmailChangeSmtpRequired' }
  /account/email-change/verification:
    post:
      operationId: getAccountEmailChangeVerification
      summary: Validates a confirmation link against the signed-in account and returns confirmation details without consuming it.
      description: Requires an active session for the account that requested the change. Returns only that account's current and proposed addresses and reports whether a fresh sign-in is required. Session creation through password or email-code authentication counts as fresh authentication for five minutes. Missing, mismatched, or stale authentication does not extend or consume the link. The token is sent in the JSON body.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailChangeVerificationToken' }
      responses:
        '200':
          description: Confirmation details for the signed-in account. Reading does not consume the token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailChangeVerification' }
        '400':
          description: INVALID_EMAIL_CHANGE_TOKEN. The token is malformed, expired, replaced, consumed, or belongs to a disabled or deleted account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403':
          description: EMAIL_CHANGE_ACCOUNT_MISMATCH or PASSWORD_CHANGE_REQUIRED. No confirmation details are disclosed and the token is preserved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /account/email-change/verify:
    post:
      operationId: verifyAccountEmailChange
      summary: Consumes a confirmation link and atomically changes the account email.
      description: Requires an active session for the account that requested the change and authentication within the last five minutes, measured from session creation through password or email-code authentication. Missing authentication, another account's session, or required reauthentication preserves the token without extending its expiration. Links expire after 24 hours and cannot be reused. Disabled and deleted accounts cannot confirm. Email availability is checked again at confirmation. Account identity and memberships remain unchanged; existing password-reset tokens and login codes for the old address are consumed. Sessions remain valid.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailChangeVerificationToken' }
      responses:
        '204': { description: Email address updated and pending change consumed. }
        '400':
          description: INVALID_EMAIL_CHANGE_TOKEN. The token is malformed, expired, replaced, consumed, or belongs to a disabled or deleted account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: EMAIL_UNAVAILABLE. The pending change is preserved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403':
          description: EMAIL_CHANGE_ACCOUNT_MISMATCH, REAUTHENTICATION_REQUIRED, or PASSWORD_CHANGE_REQUIRED. The pending change is preserved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /account/profile:
    get:
      operationId: getAccountProfile
      summary: Returns the authenticated account's first name, last name, and display name.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Account profile. Existing accounts can have unset first and last names.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [firstName, lastName, displayName]
                properties:
                  firstName: { type: [string, 'null'] }
                  lastName: { type: [string, 'null'] }
                  displayName: { type: string }
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403':
          description: PASSWORD_CHANGE_REQUIRED. The account must change its password first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    put:
      operationId: updateAccountProfile
      summary: Updates all three names of the authenticated account.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountProfile'
      responses:
        '200':
          description: Updated account profile with trimmed names.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountProfile' }
        '400':
          description: INVALID_ACCOUNT_PROFILE. Each trimmed name must contain 1 to 120 characters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403':
          description: PASSWORD_CHANGE_REQUIRED. The account must change its password first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /account/cookbooks:
    get:
      operationId: getAccountCookbooks
      summary: Lists cookbooks owned by the authenticated account and its creation limit.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Owned cookbooks and creation limit.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [cookbooks, maxCookbooksPerOwner]
                properties:
                  cookbooks:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [name, slug, recipeCount, userCount, showOnStartPage]
                      properties:
                        name: { type: string }
                        slug: { type: string }
                        recipeCount: { type: integer, minimum: 0 }
                        userCount: { type: integer, minimum: 0 }
                        showOnStartPage: { type: boolean }
                  maxCookbooksPerOwner: { type: integer, minimum: 1, maximum: 100 }
        '401': { description: Authentication is required. }
    post:
      operationId: createAccountCookbook
      summary: Creates a cookbook owned by the authenticated account.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cookbookName]
              properties:
                cookbookName:
                  type: string
                  minLength: 3
                  maxLength: 120
                  pattern: '^(?=(?:.*[A-Za-z0-9]){3})[A-Za-z0-9].*$'
                  description: Leading and trailing whitespace is ignored. The trimmed name starts with an ASCII letter or digit and contains at least three ASCII letters or digits.
      responses:
        '201':
          description: Cookbook created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [tenantSlug]
                properties:
                  tenantSlug: { type: string }
        '400': { description: Cookbook details are invalid or the derived URL slug is blocked. }
        '401': { description: Authentication is required. }
        '409': { description: Cookbook ownership limit has been reached. }
  /auth/login:
    post:
      operationId: login
      summary: Authenticates a human user and starts a browser session.
      description: Failed password logins are limited to ten per client IP in a rolling 15-minute window, independently of account or email address. Unknown, disabled, passwordless, and incorrect-password accounts count as failed logins. Successful logins and malformed bodies do not count or clear previous failures. Once the limit is reached, further password logins from that IP return LOGIN_RATE_LIMITED without extending the window. Forwarded client IPs are accepted only through configured trusted proxies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Authentication succeeded. The response sets the HttpOnly session cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [hasPassword, passwordChangeRequired]
                properties:
                  hasPassword:
                    type: boolean
                  passwordChangeRequired:
                    type: boolean
        '400':
          description: The request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Authentication failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: PASSWORD_LOGIN_DISABLED; password login is disabled by the instance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: LOGIN_RATE_LIMITED; this client IP has ten failed password logins in the last 15 minutes.
          headers:
            Retry-After:
              description: Seconds until the oldest counted failure leaves the rolling window.
              schema: { type: integer, minimum: 1, maximum: 900 }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiError'
                  - type: object
                    properties:
                      code: { const: LOGIN_RATE_LIMITED }
  /auth/password-requirements:
    get:
      operationId: getPasswordRequirements
      summary: Returns the current instance minimum password entropy for local password-form feedback.
      responses:
        '200':
          description: Password requirements.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [minimumPasswordEntropy]
                properties:
                  minimumPasswordEntropy: { type: integer, minimum: 1, maximum: 256 }
  /auth/change-password:
    post:
      operationId: changePassword
      summary: Changes the authenticated user's password.
      description: Requires the current password when the account already has a password. Accounts without a password can omit currentPassword. Successful changes atomically update the password, clear passwordChangeRequired, and revoke all other browser sessions for this account. The current session and other accounts remain unchanged. Concurrent changes recheck authentication under an account row lock. Rejected changes leave passwords and sessions unchanged. The configured minimum entropy is enforced outside development.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [newPassword]
              properties:
                currentPassword:
                  type: [string, 'null']
                  format: password
                  description: Required as a string for accounts with an existing password; verified before updating the password. Accounts without a password can omit it or supply null.
                newPassword:
                  type: string
                  format: password
                  description: Must meet the configured minimum estimated entropy.
      responses:
        '204':
          description: The password was changed.
        '400':
          description: The request body or new password is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: AUTHENTICATION_REQUIRED for a missing session credential or AUTHENTICATION_FAILED for an invalid session or incorrect current password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      summary: Requests a password-reset email without exposing whether an account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '204': { description: The request was accepted without account-existence disclosure. }
  /auth/password-reset/verification:
    post:
      operationId: getPasswordResetVerification
      summary: Validates a password-reset link and rejects an active session for another account without consuming the token.
      description: Anonymous recovery remains supported. Matching sessions are checked by immutable account ID. The response contains only the expiration time, without an email address or other account details. Disabled and deleted target accounts are rejected.
      security: [{}, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 1 }
      responses:
        '200':
          description: Valid password-reset link. Reading does not consume or extend it.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [expiresAt]
                properties:
                  expiresAt: { type: string, format: date-time }
        '400':
          description: INVALID_PASSWORD_RESET. Invalid, expired, consumed, or inactive-account token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403':
          description: PASSWORD_RESET_ACCOUNT_MISMATCH. The active session belongs to another account; the token is preserved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /auth/password-reset/complete:
    post:
      operationId: completePasswordReset
      description: Supports anonymous recovery and matching active sessions. An active session for another account is rejected inside the reset transaction without changing passwords, tokens, or sessions. Disabled and deleted accounts cannot reset. Successful recovery revokes all target-account sessions and clears the browser session cookie.
      security: [{}, { sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword:
                  {
                    type: string,
                    format: password,
                    description: Must meet the configured minimum estimated entropy.,
                  }
      responses:
        '204':
          description: The password was changed, the reset token was consumed, target-account sessions were revoked, and the browser session cookie was cleared.
          headers:
            Set-Cookie:
              description: Clears the browser session cookie.
              schema: { type: string }
        '400':
          description: The reset token or password is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: PASSWORD_RESET_ACCOUNT_MISMATCH. The active session belongs to another account; the token is preserved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /auth/session:
    get:
      operationId: getCurrentSession
      summary: Returns the current browser session state.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The active session.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [email, displayName, hasPassword, passwordChangeRequired]
                properties:
                  email:
                    type: string
                    format: email
                  displayName:
                    type: string
                  hasPassword:
                    type: boolean
                  passwordChangeRequired:
                    type: boolean
        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /auth/logout:
    post:
      operationId: logout
      summary: Revokes the current browser session.
      security:
        - sessionCookie: []
      responses:
        '204':
          description: The session was revoked.
  /auth/authentication-methods:
    get:
      operationId: getAuthenticationMethods
      summary: Returns publicly enabled browser sign-in methods.
      responses:
        '200':
          description: Enabled methods.
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      additionalProperties: false,
                      required: [password, emailCode],
                      properties: { password: { type: boolean }, emailCode: { type: boolean } },
                    },
                },
            }
  /auth/email-code/request:
    post:
      operationId: requestLoginEmailCode
      summary: Requests a sign-in code without revealing whether an account exists.
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    additionalProperties: false,
                    required: [email],
                    properties: { email: { type: string, format: email } },
                  },
              },
          }
      responses: { '204': { description: The request was accepted. } }
  /auth/email-code/verify:
    post:
      operationId: verifyLoginEmailCode
      summary: Verifies a login code and starts a browser session.
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    additionalProperties: false,
                    required: [email, code],
                    properties:
                      {
                        email: { type: string, format: email },
                        code: { type: string, pattern: '^[0-9]{6}$' },
                      },
                  },
              },
          }
      responses:
        '200':
          {
            description: Authentication succeeded.,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        required: [hasPassword, passwordChangeRequired],
                        properties:
                          {
                            hasPassword: { type: boolean },
                            passwordChangeRequired: { type: boolean },
                          },
                      },
                  },
              },
          }
        '400':
          {
            description: Invalid request,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
        '401':
          {
            description: Invalid or expired code,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } },
          }
  /admin/authentication-settings:
    get:
      operationId: getAuthenticationSettings
      security: [{ sessionCookie: [] }]
      responses:
        {
          '200':
            {
              description: Settings,
              content:
                {
                  application/json:
                    {
                      schema:
                        {
                          type: object,
                          required: [loginMode, minimumPasswordEntropy],
                          properties:
                            {
                              loginMode:
                                {
                                  type: string,
                                  enum: [PASSWORD_ONLY, EMAIL_CODE_ONLY, PASSWORD_OR_EMAIL_CODE],
                                },
