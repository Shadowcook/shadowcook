openapi: 3.1.1
info:
  title: Shadowcook API
  version: 0.1.0
  description: >-
    Sessions with pending owner cookbook resets return 403 COOKBOOK_NAME_RESET_REQUIRED for normal API operations until every cookbook identity is repaired. Authentication, password recovery, invitation acceptance, account cookbook listing, identity repair routes and permission-checked cookbook administration remain available.
    Ordinary recipe surfaces exclude administratively restricted recipes and disabled/identity-locked cookbooks, including shares, media, history, trash, export and AI readers. Cookbook moderation now requires instance:administer, reason and confirmation; tenant:create alone is insufficient. Owners cannot rename disabled cookbooks.
    Responses include X-Request-ID for support correlation. Unless a route explicitly specifies another cache policy, successful responses use Cache-Control private, no-store. Errors use Cache-Control no-store.
    Domain errors retain their documented payloads. Framework and unexpected failures use
    the common safe error payload. The web proxy returns 503 UPSTREAM_UNAVAILABLE if the API is unreachable.
paths:
  /admin/reports/{publicId}/notices:
    {
      'parameters':
        [
          {
            'name': 'publicId',
            'in': 'path',
            'required': true,
            'schema': { 'type': 'string', 'format': 'uuid' },
          },
        ],
      'post':
        {
          'operationId': 'createReportPublicNotice',
          'description': 'Creates a separate, confirmed public notice to the reporter or current reported account/cookbook owner; expected recipient identity is rechecked under locks. Deleted accounts and unavailable target owners cannot receive a new notice. Private report description, resultNote and administrative reason are never automatically included. Requires a separate public explanation and actionable review/contact instructions. Commits notice/audit before one SMTP attempt; delivery failure does not roll back creation. No automatic delivery retry or enforcement occurs. A process interruption can leave PENDING (unknown delivery outcome); inspect history before creating a replacement. Public notice content expires with the audit retention period. Requires an active human instance:administer browser session; any Authorization header is rejected. Required password changes and owned-cookbook identity repairs remain enforced. Responses use private/no-store, noindex/nofollow and no-referrer. Audit failure releases no history and rolls back mutations.',
          'security': [{ 'sessionCookie': [] }],
          'requestBody':
            {
              'required': true,
              'content':
                {
                  'application/json':
                    { 'schema': { '$ref': '#/components/schemas/ReportNoticeInput' } },
                },
            },
          'responses':
            {
              '200':
                {
                  'description': 'Scoped result.',
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'type': 'object',
                              'additionalProperties': false,
                              'properties':
                                {
                                  'noticePublicId': { 'type': 'string', 'format': 'uuid' },
                                  'deliveryStatus':
                                    { 'type': 'string', 'enum': ['SENT', 'FAILED'] },
                                },
                              'required': ['noticePublicId', 'deliveryStatus'],
                            },
                        },
                    },
                },
              '400':
                {
                  'description': 'INVALID_REPORT_HISTORY, INVALID_REPORT_NOTICE or INVALID_ADMINISTRATIVE_PURPOSE; unknown fields and missing purpose/confirmation are rejected.',
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'anyOf':
                                [
                                  { '$ref': '#/components/schemas/ApiError' },
                                  { '$ref': '#/components/schemas/UnhandledApiError' },
                                ],
                            },
                        },
                    },
                },
              '401':
                {
                  'description': 'AUTHENTICATION_REQUIRED',
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'anyOf':
                                [
                                  { '$ref': '#/components/schemas/ApiError' },
                                  { '$ref': '#/components/schemas/UnhandledApiError' },
                                ],
                            },
                        },
                    },
                },
              '403':
                {
                  'description': 'ADMIN_SESSION_REQUIRED, INSTANCE_PERMISSION_REQUIRED, PASSWORD_CHANGE_REQUIRED or COOKBOOK_NAME_RESET_REQUIRED.',
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'anyOf':
                                [
                                  { '$ref': '#/components/schemas/ApiError' },
                                  { '$ref': '#/components/schemas/UnhandledApiError' },
                                ],
                            },
                        },
                    },
                },
              '404':
                {
                  'description': 'RESOURCE_NOT_FOUND: report or scoped retained audit event unavailable.',
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'anyOf':
                                [
                                  { '$ref': '#/components/schemas/ApiError' },
                                  { '$ref': '#/components/schemas/UnhandledApiError' },
                                ],
                            },
                        },
                    },
                },
              'default': { '$ref': '#/components/responses/UnexpectedError' },
              '409':
                {
                  'description': 'STALE_NOTICE_RECIPIENT: selected recipient no longer matches the current target/reporter account. Reload report context.',
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'anyOf':
                                [
                                  { '$ref': '#/components/schemas/ApiError' },
                                  { '$ref': '#/components/schemas/UnhandledApiError' },
                                ],
                            },
                        },
                    },
                },
            },
        },
    }
  /admin/reports/{publicId}/events:
    {
      'parameters':
