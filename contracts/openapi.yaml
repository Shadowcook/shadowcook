        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalPages: { type: integer, minimum: 0 }
        totalRecipes: { type: integer, minimum: 0 }
    CookbookRecipeDetail:
      description: Preparation metadata and diet project the selected variant in reader detail responses and the default variant in editor and snapshot responses.
      type: object
      additionalProperties: false
      required:
        [
          public_id,
          cookbook_name,
          version,
          slug,
          title,
          summary,
          creator_display_name,
          contributors,
          can_edit,
          can_share,
          selectedVariant,
          variants,
          steps,
          recipe_links,
          metadata,
          diet,
          createdAt,
          updatedAt,
        ]
      properties:
        metadata: { $ref: '#/components/schemas/RecipeContentMetadata' }
        diet: { $ref: '#/components/schemas/RecipeDiet' }
        createdAt: { $ref: '#/components/schemas/RecipeCreatedAt' }
        updatedAt: { $ref: '#/components/schemas/RecipeUpdatedAt' }
        cookbook_name:
          type: string
          description: Current display name of the cookbook that owns this recipe.
        version:
          type: integer
          minimum: 1
          description: Version number of the published recipe revision returned in this response. An unpublished draft does not change this value.
        public_id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        summary:
          type: [string, 'null']
        creator_display_name:
          type: [string, 'null']
          description: Current display name of the principal that created the earliest recipe revision. Human creators use their account display name; service creators use their service-account name. No account identifiers or authentication data are exposed. Null when that revision has no creator.
        contributors:
          type: array
          description: Creators and recorded content editors of published and archived revisions, deduplicated by principal and ordered by first contributed revision and current display name. Draft-only contributions are excluded. Returns display names without account identifiers or authentication data.
          items: { $ref: '#/components/schemas/RecipeContributor' }
        can_edit:
          type: boolean
        can_share:
          type: boolean
        selectedVariant:
          type: string
        variants:
          type: array
          items: { $ref: '#/components/schemas/PublishedRecipeVariant' }
        steps:
          type: array
          items:
            $ref: '#/components/schemas/CookbookRecipeStep'
        recipe_links:
          type: array
          items: { $ref: '#/components/schemas/RecipeLink' }
    RecipeContributor:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name: { type: string }
    CookbookRecipeStep:
      type: object
      additionalProperties: false
      required: [public_id, sort_order, instruction, ingredients]
      properties:
        public_id:
          type: string
          format: uuid
        sort_order:
          type: integer
          minimum: 0
        instruction:
          type: string
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/CookbookIngredientUsage'
    CookbookIngredientUsage:
      type: object
      additionalProperties: false
      required:
        [
          sort_order,
          amount,
          unit_public_id,
          unit_symbol,
          unit_localization_key,
          unit_translations,
          ingredient_public_id,
          ingredient_name,
          is_catalog_ingredient,
          special_kind,
          note,
          is_optional,
        ]
      properties:
        sort_order:
          type: integer
          minimum: 0
        amount:
          type: [string, 'null']
        unit_public_id:
          type: [string, 'null']
          format: uuid
        unit_symbol:
          type: [string, 'null']
        unit_localization_key:
          type: [string, 'null']
        unit_translations:
          $ref: '#/components/schemas/UnitTranslations'
        ingredient_public_id:
          type: [string, 'null']
          format: uuid
        ingredient_name:
          type: string
        is_catalog_ingredient:
          type: boolean
        special_kind:
          type: [string, 'null']
          enum: [NO_ICON, REMOVE, ADD, INFO, IMPORTANT, COOK, COOL, HEAT, WAIT, WORK_STEP, null]
        note:
          type: [string, 'null']
        is_optional:
          type: boolean
    RecipeDraftStep:
      type: object
      additionalProperties: false
      required: [id, stepKey, instruction, sortOrder, ingredients]
      properties:
        id: { type: string, format: uuid }
        stepKey:
          { type: string, format: uuid, description: Stable step identity across recipe revisions. }
        instruction: { type: string }
        sortOrder: { type: integer, minimum: 0 }
        ingredients:
          type: array
          items: { $ref: '#/components/schemas/RecipeDraftUsage' }
    RecipeDraftStepInput:
      type: object
      additionalProperties: false
      required: [instruction, ingredients]
      properties:
        id:
          type: string
          format: uuid
          description: Existing step row ID or a client-generated identifier for a new step. Must be unique within the request.
        includedVariantKeys:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
          description: Complete direct membership for this step. Keys must belong to this draft. An empty array excludes the step from every variant.
        instruction:
          type: string
          minLength: 1
          description: Authored preparation text. Whitespace and line breaks are preserved verbatim.
        ingredients:
          type: array
          items: { $ref: '#/components/schemas/RecipeDraftUsageInput' }
    RecipeDraftUsage:
      type: object
      additionalProperties: false
      required:
        [
          id,
          ingredientPublicId,
          ingredientAliasPublicId,
          ingredientName,
          textOverride,
          specialKind,
          amount,
          unitPublicId,
          note,
          isOptional,
          sortOrder,
        ]
      properties:
        id: { type: string, format: uuid }
        ingredientPublicId: { type: [string, 'null'], format: uuid }
        ingredientAliasPublicId: { type: [string, 'null'], format: uuid }
        ingredientName: { type: [string, 'null'] }
        textOverride: { type: [string, 'null'] }
        specialKind:
          type: [string, 'null']
          enum: [NO_ICON, REMOVE, ADD, INFO, IMPORTANT, COOK, COOL, HEAT, WAIT, WORK_STEP, null]
        amount: { type: [string, 'null'] }
        unitPublicId: { type: [string, 'null'], format: uuid }
        note: { type: [string, 'null'] }
        isOptional: { type: boolean }
        sortOrder: { type: integer, minimum: 0 }
    RecipeDraftUsageInput:
      type: object
      additionalProperties: false
      properties:
        ingredientPublicId: { type: string, format: uuid }
        ingredientAliasPublicId: { type: string, format: uuid }
        textOverride: { type: string, minLength: 1 }
        specialKind:
          type: string
          enum: [NO_ICON, REMOVE, ADD, INFO, IMPORTANT, COOK, COOL, HEAT, WAIT, WORK_STEP]
          description: When supplied, textOverride, amount, unitPublicId, and isOptional are ignored.
        amount: { type: string, pattern: '^\\d+(?:\\.\\d+)?$' }
        unitPublicId: { type: string, format: uuid }
        note: { type: string }
        isOptional: { type: boolean }
    EditorUnit:
