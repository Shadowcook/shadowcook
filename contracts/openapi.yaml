  schemas:
    ReportAdministrationContext:
      {
        'type': 'object',
        'additionalProperties': false,
        'properties':
          {
            'available': { 'type': 'boolean' },
            'cookbookPublicId': { 'type': ['string', 'null'], 'format': 'uuid' },
            'recipePublicId': { 'type': ['string', 'null'], 'format': 'uuid' },
            'inspectionPath': { 'type': ['string', 'null'] },
            'accountPath': { 'type': ['string', 'null'] },
            'cookbookDisabled': { 'type': ['boolean', 'null'] },
            'identityResetRequired': { 'type': ['boolean', 'null'] },
            'recipeBlocked': { 'type': ['boolean', 'null'] },
            'trashed': { 'type': ['boolean', 'null'] },
            'accountDisabled': { 'type': ['boolean', 'null'] },
            'recipients':
              {
                'type': 'array',
                'maxItems': 2,
                'items':
                  {
                    'type': 'object',
                    'additionalProperties': false,
                    'properties':
                      {
                        'role': { 'type': 'string', 'enum': ['REPORTER', 'TARGET'] },
                        'publicId': { 'type': 'string', 'format': 'uuid' },
                        'displayName': { 'type': 'string' },
                      },
