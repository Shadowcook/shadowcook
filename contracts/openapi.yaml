        default_recipe_discoverability: { type: string, enum: [DISCOVERABLE, UNLISTED] }
        frontpage_recipe_count: { type: integer, minimum: 1, maximum: 100 }
        frontpage_heading: { type: [string, 'null'] }
        show_on_start_page: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ExportCategory:
      type: object
      additionalProperties: false
      required: [public_id, parent_public_id, name, slug, sort_order]
      properties:
        public_id: { type: string, format: uuid }
        parent_public_id: { type: [string, 'null'], format: uuid }
        name: { type: string }
        slug: { type: string }
        sort_order: { type: integer, minimum: 0 }
    ExportIngredient:
      type: object
      additionalProperties: false
      required: [public_id, canonical_name]
      properties:
        public_id: { type: string, format: uuid }
        canonical_name: { type: string }
    ExportIngredientAlias:
      type: object
      additionalProperties: false
      required: [public_id, ingredient_public_id, alias]
      properties:
        public_id: { type: string, format: uuid }
        ingredient_public_id: { type: string, format: uuid }
        alias: { type: string }
    ExportUnit:
      type: object
      additionalProperties: false
      required:
        [
          public_id,
          is_instance_owned,
          name,
          symbol,
          localization_key,
          dimension,
          base_factor,
          base_offset,
          translations,
        ]
      properties:
        public_id: { type: string, format: uuid }
        is_instance_owned: { type: boolean }
        name: { type: string }
        symbol: { type: string }
        localization_key: { type: [string, 'null'] }
        dimension: { type: [string, 'null'], enum: [MASS, VOLUME, COUNT, TEMPERATURE, null] }
        base_factor:
          {
            type: [string, 'null'],
            description: Exact decimal conversion factor; null for units without conversion.,
          }
        base_offset:
          {
            type: [string, 'null'],
            description: Exact decimal conversion offset; null for units without conversion.,
          }
        translations:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required: [name, symbol]
            properties:
              name: { type: string }
              symbol: { type: string }
    ExportRecipe:
      type: object
      additionalProperties: false
      required:
        [
          public_id,
          lineage_public_id,
          slug,
          visibility_override,
          discoverability_override,
          is_featured,
          published_revision_public_id,
          draft_revision_public_id,
          created_at,
          updated_at,
        ]
      properties:
        public_id: { type: string, format: uuid }
        lineage_public_id: { type: string, format: uuid }
        slug: { type: string }
        visibility_override: { type: [string, 'null'], enum: [PRIVATE, MEMBERS_ONLY, PUBLIC, null] }
        discoverability_override: { type: [string, 'null'], enum: [DISCOVERABLE, UNLISTED, null] }
        is_featured: { type: boolean }
        published_revision_public_id: { type: [string, 'null'], format: uuid }
        draft_revision_public_id: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ExportRecipeImage:
      type: object
      additionalProperties: false
      required: [content_type, encoding, data]
      properties:
        content_type: { type: string, const: image/jpeg }
        encoding: { type: string, const: base64 }
        data:
          type: string
          contentEncoding: base64
          contentMediaType: image/jpeg
          description: Exact stored 1200 by 800 JPEG bytes, encoded as Base64 without a data URL prefix. The thumbnail is not included.
    ExportRevision:
      description: Top-level metadata and diet project the selected variant, or the default variant when no selection exists. Legacy recipe writes of these fields update the default variant only.
      type: object
      additionalProperties: false
      required:
        [
          image,
          public_id,
          recipe_public_id,
          revision_no,
          status,
          title,
          summary,
          version,
          author_display_name,
          contributor_display_names,
          created_at,
          published_at,
          category_public_ids,
          metadata,
          diet,
        ]
      properties:
        image:
          description: Embedded cover image for this revision. Null when absent or expired under the configured image-retention policy. Older version 1 archives may omit this field.
          oneOf:
            - { $ref: '#/components/schemas/ExportRecipeImage' }
            - { type: 'null' }
        metadata: { $ref: '#/components/schemas/RecipeContentMetadata' }
        diet: { $ref: '#/components/schemas/RecipeDiet' }
        public_id: { type: string, format: uuid }
        recipe_public_id: { type: string, format: uuid }
        revision_no: { type: integer, minimum: 1 }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
        title: { type: string }
        summary: { type: [string, 'null'] }
        version: { type: integer, minimum: 1 }
        author_display_name:
          {
            type: [string, 'null'],
            description: Current author display name without account or authentication data.,
          }
        contributor_display_names:
          type: array
          description: Current display names of the revision creator and recorded editors, deduplicated by principal. Includes draft contributors. Account identifiers and authentication data are excluded.
          items: { type: string }
        created_at: { type: string, format: date-time }
        published_at: { type: [string, 'null'], format: date-time }
        category_public_ids: { type: array, items: { type: string, format: uuid } }
    ExportVariant:
      type: object
      additionalProperties: false
      required:
        [
          metadata,
          diet,
          revision_public_id,
          variant_key,
          name,
          slug,
          is_default,
          is_visible,
          included_step_keys,
        ]
      properties:
        metadata: { $ref: '#/components/schemas/RecipeContentMetadata' }
        diet: { $ref: '#/components/schemas/RecipeDiet' }
        revision_public_id: { type: string, format: uuid }
        variant_key: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        is_default: { type: boolean }
        is_visible: { type: boolean }
        included_step_keys:
          type: array
          description: Explicit step membership for this variant in the referenced revision.
          items: { type: string, format: uuid }
    ExportStep:
      type: object
      additionalProperties: false
      required: [revision_public_id, step_key, sort_order, instruction]
      properties:
        revision_public_id: { type: string, format: uuid }
        step_key: { type: string, format: uuid }
        sort_order: { type: integer, minimum: 0 }
        instruction:
          { type: string, description: Authored content with recipe reference tokens preserved. }
    ExportIngredientUsage:
      type: object
      additionalProperties: false
      required:
        [
          revision_public_id,
          step_key,
          usage_key,
          ingredient_public_id,
          ingredient_alias_public_id,
          text_override,
          special_kind,
          unit_public_id,
          amount,
          is_optional,
          note,
          sort_order,
        ]
      properties:
        revision_public_id: { type: string, format: uuid }
        step_key: { type: string, format: uuid }
        usage_key: { type: string, format: uuid }
        ingredient_public_id: { type: [string, 'null'], format: uuid }
        ingredient_alias_public_id: { type: [string, 'null'], format: uuid }
        text_override: { type: [string, 'null'] }
        special_kind:
          {
            type: [string, 'null'],
            enum: [NO_ICON, REMOVE, ADD, INFO, IMPORTANT, COOK, COOL, HEAT, WAIT, WORK_STEP, null],
          }
        unit_public_id: { type: [string, 'null'], format: uuid }
        amount:
          {
            type: [string, 'null'],
            description: Exact decimal amount without conversion to floating point.,
          }
        is_optional: { type: boolean }
        note: { type: [string, 'null'] }
        sort_order: { type: integer, minimum: 0 }
    ReportSettings:
      type: object
      additionalProperties: false
      required: [recipientEmail]
      properties:
        recipientEmail: { type: [string, 'null'], format: email, maxLength: 254 }
    ReportUser:
      type: object
      additionalProperties: false
      required: [publicId, displayName]
      properties:
        publicId: { type: string, format: uuid }
        displayName: { type: string }
    ReportTargetType: { type: string, enum: [RECIPE, USER, COOKBOOK] }
    ReportReason: { type: string, enum: [ILLEGAL_CONTENT, IMPROPER_NAME, HARASSMENT, SPAM, OTHER] }
    ReportStatus: { type: string, enum: [OPEN, UNDER_INVESTIGATION, CLOSED] }
    ReportResult:
      {
        type: [string, 'null'],
        enum: [BLOCKED, UNFOUNDED, USER_DELETED, COOKBOOK_DELETED, RECIPE_DELETED, OTHER, null],
      }
    ContentReportInput:
      type: object
      additionalProperties: false
      required: [targetType, targetPublicId, reason, description]
      properties:
        targetType: { $ref: '#/components/schemas/ReportTargetType' }
        targetPublicId: { type: string, format: uuid }
        reason: { $ref: '#/components/schemas/ReportReason' }
        description: { type: string, minLength: 1, maxLength: 5000, pattern: '\S' }
        shareToken: { type: string, maxLength: 200 }
    ContentReportUpdate:
      type: object
      additionalProperties: false
      required: [status, result, resultNote, assignedAdminPublicId]
      properties:
        status: { $ref: '#/components/schemas/ReportStatus' }
        result: { $ref: '#/components/schemas/ReportResult' }
        resultNote: { type: string, maxLength: 5000 }
        assignedAdminPublicId: { type: [string, 'null'], format: uuid }
      allOf:
        - if:
            properties:
              status: { const: CLOSED }
          then:
            properties:
              result: { type: string }
          else:
            properties:
              result: { type: 'null' }
    ContentReport:
      type: object
      additionalProperties: false
      required:
        [
          publicId,
          targetType,
          targetPublicId,
          targetName,
          targetUrl,
          reporterName,
          reporterEmail,
          reason,
          description,
          status,
          result,
          resultNote,
          assignedAdminPublicId,
          assignedAdminName,
          createdAt,
          updatedAt,
          notificationSentAt,
        ]
      properties:
        publicId: { type: string, format: uuid }
        targetType: { $ref: '#/components/schemas/ReportTargetType' }
        targetPublicId: { type: string, format: uuid }
        targetName: { type: [string, 'null'] }
        targetUrl:
          {
            type: [string, 'null'],
            description: Relative target URL or null when the target no longer exists.,
          }
        reporterName: { type: string }
        reporterEmail: { type: string, format: email }
        reason: { $ref: '#/components/schemas/ReportReason' }
        description: { type: string, minLength: 1, maxLength: 5000 }
        status: { $ref: '#/components/schemas/ReportStatus' }
        result: { $ref: '#/components/schemas/ReportResult' }
        resultNote: { type: string, maxLength: 5000 }
        assignedAdminPublicId: { type: [string, 'null'], format: uuid }
        assignedAdminName: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        notificationSentAt: { type: [string, 'null'], format: date-time }
    EmailChangeVerificationToken:
      type: object
      required: [token]
      properties:
        token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
    EmailChangeVerification:
      type: object
      additionalProperties: false
      required: [currentEmail, email, expiresAt, reauthenticationRequired]
      properties:
        currentEmail: { type: string, format: email }
        email: { type: string, format: email }
        expiresAt: { type: string, format: date-time }
        reauthenticationRequired:
          type: boolean
          description: True when the session was not created through authentication within the last five minutes. A new password or email-code sign-in is required before confirmation.
    AccountEmailChangeStatus:
      type: object
      additionalProperties: false
      required: [email, pending, nextResendAt, serverTime]
      properties:
        email: { type: string, format: email }
        pending:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [email, expiresAt]
              properties:
                email: { type: string, format: email }
                expiresAt: { type: string, format: date-time }
        nextResendAt:
          type: [string, 'null']
          format: date-time
          description: Earliest allowed send time, including when the requested target address changes. Null before any request.
        serverTime: { type: string, format: date-time }
    ProfileName:
      type: string
      minLength: 1
      maxLength: 120
      pattern: '\S'
      description: Leading and trailing whitespace is ignored. The trimmed name contains 1 to 120 characters.
    AccountProfile:
      type: object
      additionalProperties: false
      required: [firstName, lastName, displayName]
      properties:
        firstName: { $ref: '#/components/schemas/ProfileName' }
        lastName: { $ref: '#/components/schemas/ProfileName' }
        displayName: { $ref: '#/components/schemas/ProfileName' }
    OAuthProtectedResourceMetadata:
      type: object
      additionalProperties: false
      required: [resource, authorization_servers, scopes_supported]
      properties:
        resource: { type: string, format: uri }
        authorization_servers:
          type: array
          items: { type: string, format: uri }
        scopes_supported:
          type: array
          items: { type: string, const: shadowcook:recipes }
    OAuthAuthorizationServerMetadata:
      type: object
      additionalProperties: false
      required:
        [
          issuer,
          authorization_endpoint,
          token_endpoint,
          registration_endpoint,
          client_id_metadata_document_supported,
          response_types_supported,
          grant_types_supported,
          token_endpoint_auth_methods_supported,
          code_challenge_methods_supported,
          scopes_supported,
        ]
      properties:
        issuer: { type: string, format: uri }
        authorization_endpoint: { type: string, format: uri }
        token_endpoint: { type: string, format: uri }
        registration_endpoint: { type: string, format: uri }
        client_id_metadata_document_supported: { type: boolean, const: true }
        response_types_supported:
          type: array
          items: { type: string, const: code }
        grant_types_supported:
          type: array
          items: { type: string, enum: [authorization_code, refresh_token] }
        token_endpoint_auth_methods_supported:
          type: array
          items: { type: string, const: none }
        code_challenge_methods_supported:
          type: array
          items: { type: string, const: S256 }
        scopes_supported:
          type: array
          items: { type: string, const: shadowcook:recipes }
    OAuthClientRegistrationResponse:
      type: object
      additionalProperties: false
      required: [client_id, client_name, redirect_uris, token_endpoint_auth_method]
      properties:
        client_id: { type: string }
        client_name: { type: string }
        redirect_uris:
          type: array
          minItems: 1
          items: { type: string, format: uri }
        token_endpoint_auth_method: { type: string, const: none }
    OAuthTokenRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [grant_type, code, redirect_uri, client_id, code_verifier]
          properties:
            grant_type: { type: string, const: authorization_code }
            code: { type: string }
            redirect_uri: { type: string, format: uri }
            client_id: { type: string }
            code_verifier: { type: string }
            resource: { type: string, format: uri }
        - type: object
          additionalProperties: false
          required: [grant_type, refresh_token, client_id]
          properties:
            grant_type: { type: string, const: refresh_token }
            refresh_token: { type: string }
            client_id: { type: string }
    OAuthTokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, refresh_token, scope]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, minimum: 1 }
        refresh_token: { type: string }
        scope: { type: string, const: shadowcook:recipes }
    TenantListResponse:
      type: object
      additionalProperties: false
      required: [tenants, smtpConfigured]
      properties:
        tenants:
          type: array
          items: { $ref: '#/components/schemas/TenantSummary' }
        smtpConfigured:
          type: boolean
    TenantSummary:
      type: object
      additionalProperties: false
      required:
        [
          public_id,
          display_name,
          description,
          slug,
          disabled_at,
          name_reset_required,
          recipe_count,
          owner_name,
        ]
      properties:
        public_id: { type: string, format: uuid }
        display_name: { type: string }
        description: { type: [string, 'null'] }
        slug: { type: string }
        disabled_at: { type: [string, 'null'], format: date-time }
        name_reset_required: { type: boolean }
        recipe_count: { type: integer, minimum: 0 }
        owner_name:
          {
            type: [string, 'null'],
            description: 'Canonical owner display name, resolved from tenant.owner_principal_id; null for unclaimed cookbooks.',
          }
    TenantRecipePolicy:
      type: object
      additionalProperties: false
      required:
        [
          defaultVisibility,
          defaultDiscoverability,
          showOnStartPage,
          frontpageRecipeCount,
          frontpageHeading,
          description,
        ]
      properties:
        recipeRetentionDays:
          type: integer
          minimum: 1
          maximum: 36500
          default: 30
          description: Trash retention for future deletions in this cookbook; omitted PATCH values retain the current setting. Requires tenant:manage.
        defaultVisibility: { type: string, enum: [PRIVATE, MEMBERS_ONLY, PUBLIC] }
        defaultDiscoverability: { type: string, enum: [DISCOVERABLE, UNLISTED] }
        showOnStartPage: { type: boolean }
        frontpageRecipeCount: { type: integer, minimum: 1, maximum: 100 }
        frontpageHeading: { type: [string, 'null'], minLength: 1, maxLength: 80 }
        description: { type: [string, 'null'], minLength: 1, maxLength: 280 }
    AdministrativeAuditSettings:
      type: object
      additionalProperties: false
      required: [retentionDays]
      properties:
        retentionDays: { type: integer, minimum: 1, maximum: 3650 }
    InstanceMediaSettings:
      type: object
      additionalProperties: false
